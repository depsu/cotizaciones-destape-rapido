<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Postventa · Destape Rápido</title>

<!--
  POSTVENTA (21-nov-2026, pedido de Alejandro y del repartidor). Los baños que están en terreno, vivos desde
  Supabase: hasta cuándo, cuándo toca la limpieza, dónde están (lista y mapa) y lo que el equipo anota desde el
  celular (limpieza hecha con foto, extensión del plazo cuando renuevan por llamada, retiro, ubicación exacta).
  Las reglas viven en postventa-logica.js (probadas contra el Python del bot y la tarjeta). Las anotaciones van a
  la tabla postventa_evento: el bot las lee para su ciclo de limpiezas. Detalle en ARQUITECTURA.md (Postventa).

<style>
  :root { --azul:#1F5AA8; --azul-f:#EFF6FF; --tinta:#0F172A; --gris:#64748B; --gris-2:#94A3B8; --linea:#E2E8F0;
          --fondo:#F1F5F9; --blanco:#fff; --rojo:#B91C1C; --rojo-f:#FEF2F2; --rojo-b:#FECACA;
          --ambar:#B45309; --ambar-f:#FFFBEB; --ambar-b:#FDE68A; --verde:#166534; --verde-f:#F0FDF4; --verde-b:#BBF7D0;
          --sombra:0 1px 2px rgba(15,23,42,.06), 0 1px 1px rgba(15,23,42,.04); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden] { display:none !important; }
  html, body { max-width:100%; overflow-x:hidden; }
  body { margin:0; background:var(--fondo); color:var(--tinta);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px; line-height:1.45; }
  button, input, textarea, select { font:inherit; color:inherit; }
  a { color:var(--azul); }

  header { position:sticky; top:0; z-index:1000; background:var(--azul); color:#fff;
    padding:12px 16px 0; padding-top:max(12px, env(safe-area-inset-top)); box-shadow:0 2px 8px rgba(15,23,42,.18); }
  .h1 { display:flex; align-items:baseline; justify-content:space-between; gap:10px; max-width:640px; margin:0 auto; }
  h1 { margin:0; font-size:20px; letter-spacing:-.01em; }
  #act { font-size:12px; opacity:.8; white-space:nowrap; }
  #resumen { max-width:640px; margin:2px auto 0; font-size:14px; opacity:.92; min-height:20px; }
  .tabs { display:flex; gap:4px; max-width:640px; margin:10px auto 0; }
  .tabs button { flex:1; border:0; background:transparent; color:#fff; opacity:.75; font-weight:700; font-size:15px;
    min-height:44px; border-bottom:3px solid transparent; cursor:pointer; }
  .tabs button.on { opacity:1; border-bottom-color:#fff; }

  .barra { position:relative; z-index:900; background:var(--fondo);
    padding:10px 12px 6px; border-bottom:1px solid var(--linea); }
  .barra-in { max-width:616px; margin:0 auto; }
  .buscar { width:100%; min-height:44px; border:1px solid var(--linea); border-radius:10px; padding:10px 12px;
    background:var(--blanco); font-size:16px; }
  .buscar:focus { outline:2px solid var(--azul); outline-offset:0; border-color:transparent; }
  .chips { display:flex; gap:6px; overflow-x:auto; padding:8px 0 2px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip-f { flex:none; border:1px solid var(--linea); background:var(--blanco); border-radius:20px; min-height:36px;
    padding:6px 12px; font-size:14px; font-weight:600; color:var(--tinta); cursor:pointer; white-space:nowrap; }
  .chip-f .n { color:var(--gris); font-weight:700; margin-left:3px; }
  .chip-f.on { background:var(--tinta); color:#fff; border-color:var(--tinta); }
  .chip-f.on .n { color:#CBD5E1; }

  main { max-width:640px; margin:0 auto; padding:8px 12px 48px; }
  .aviso { border-radius:12px; padding:10px 12px; font-size:14px; margin:8px 0; border:1px solid; }
  .aviso.info { background:var(--azul-f); border-color:#BFDBFE; color:#1E3A8A; }
  .aviso.mal { background:var(--rojo-f); border-color:var(--rojo-b); color:#7F1D1D; }
  h2.sec { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--gris); margin:20px 4px 8px;
    display:flex; align-items:center; gap:8px; }
  h2.sec .n { background:var(--gris-2); color:#fff; font-size:12px; min-width:22px; height:22px; border-radius:11px;

  h2.sec.rojo .n { background:var(--rojo); } h2.sec.ambar .n { background:var(--ambar); } h2.sec.verde .n { background:var(--verde); }

    box-shadow:var(--sombra); overflow:hidden; scroll-margin-top:calc(var(--alto-header, 112px) + 10px); }
  .card.rojo { border-left:4px solid var(--rojo); } .card.ambar { border-left:4px solid #F59E0B; }
  .card.verde { border-left:4px solid #22C55E; } .card.gris { border-left:4px solid var(--gris-2); }
  .card.brilla { animation:brilla 2.2s ease-out 1; }
  @keyframes brilla { 0%,40% { box-shadow:0 0 0 3px rgba(31,90,168,.45); } 100% { box-shadow:var(--sombra); } }
  .c-in { padding:14px 14px 12px; }
  .c-top { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .c-nom { font-weight:700; font-size:17px; line-height:1.3; overflow-wrap:anywhere; }
  .c-cant { color:var(--gris); font-weight:600; font-size:14px; white-space:nowrap; }
  .est { flex:none; font-size:12px; font-weight:700; padding:4px 9px; border-radius:20px; white-space:nowrap; }
  .est.rojo { background:var(--rojo-f); color:var(--rojo); } .est.ambar { background:var(--ambar-f); color:var(--ambar); }
  .est.verde { background:var(--verde-f); color:var(--verde); } .est.gris { background:#F1F5F9; color:var(--gris); }
  .c-dir { margin-top:4px; font-size:15px; color:#334155; overflow-wrap:anywhere; }
  .c-dir .aprox { color:var(--gris); font-size:13px; }
  .filas { margin-top:8px; display:grid; grid-template-columns:auto 1fr; column-gap:10px; row-gap:3px; font-size:14px; }
  .filas dt { color:var(--gris); }
  .filas dd { margin:0; color:#334155; }
  .filas dd.rojo { color:var(--rojo); font-weight:600; } .filas dd.ambar { color:var(--ambar); font-weight:600; }

  .b { min-height:44px; border-radius:10px; border:1px solid var(--linea); background:var(--blanco); color:var(--tinta);
    font-weight:700; font-size:14px; display:flex; align-items:center; justify-content:center; gap:6px; text-decoration:none;
    padding:6px 8px; cursor:pointer; text-align:center; line-height:1.2; }
  .b:active { transform:scale(.98); }
  .b.p { background:var(--azul); border-color:var(--azul); color:#fff; }
  .b.v { background:var(--verde); border-color:var(--verde); color:#fff; }
  .b.s { background:var(--fondo); }
  .b svg { width:18px; height:18px; flex:none; }
  .b[aria-disabled="true"] { opacity:.45; pointer-events:none; }
  details.mas { border-top:1px solid var(--linea); }
  details.mas > summary { list-style:none; cursor:pointer; padding:11px 14px; font-size:14px; color:var(--azul); font-weight:600; }
  details.mas > summary::-webkit-details-marker { display:none; }
  details.mas > summary::after { content:" ▾"; }
  details.mas[open] > summary::after { content:" ▴"; }
  .mas-in { padding:0 14px 14px; font-size:14px; color:#334155; }
  .mas-in .filas { margin-top:0; }
  .acc-mas { display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 4px; }
  .acc-mas .b { flex:1 1 auto; min-width:130px; }
  .hist { list-style:none; margin:10px 0 0; padding:0; border-top:1px dashed var(--linea); }
  .hist li { padding:8px 0; border-bottom:1px dashed var(--linea); display:flex; gap:10px; align-items:flex-start; }
  .hist li.anulado { opacity:.5; text-decoration:line-through; }
  .hist .h-txt { flex:1; min-width:0; overflow-wrap:anywhere; }
  .hist .h-meta { color:var(--gris); font-size:12px; }
  .hist img { width:56px; height:56px; object-fit:cover; border-radius:8px; border:1px solid var(--linea); flex:none; }
  .hist .anular { border:0; background:none; color:var(--rojo); font-size:13px; padding:4px 0 4px 8px; cursor:pointer; flex:none; }
  .vacio { text-align:center; color:var(--gris); padding:40px 16px; }
  .vacio b { display:block; color:var(--tinta); font-size:17px; margin-bottom:4px; }
  .pie { margin:24px 4px 0; font-size:13px; color:var(--gris); display:flex; flex-direction:column; gap:10px; }
  .pie button { align-self:flex-start; border:0; background:none; color:var(--azul); font-weight:600; padding:6px 0; cursor:pointer; font-size:14px; }

  .esq { background:var(--blanco); border:1px solid var(--linea); border-radius:14px; height:150px; margin-bottom:10px;
    position:relative; overflow:hidden; }
  .esq::after { content:""; position:absolute; inset:0; transform:translateX(-100%);
    background:linear-gradient(90deg, transparent, rgba(241,245,249,.9), transparent); animation:esq 1.3s infinite; }
  @keyframes esq { 100% { transform:translateX(100%); } }

  #vista-mapa { position:relative; }
  #mapa { height:calc(100vh - var(--alto-header, 112px) - var(--alto-barra, 96px)); height:calc(100dvh - var(--alto-header, 112px) - var(--alto-barra, 96px));
    min-height:320px; background:#E5E7EB; }
  .mapa-pie { position:absolute; left:10px; right:10px; bottom:calc(14px + env(safe-area-inset-bottom)); z-index:800;

  .leyenda { pointer-events:auto; background:rgba(255,255,255,.95); border:1px solid var(--linea); border-radius:12px;
    padding:8px 10px; font-size:12px; box-shadow:var(--sombra); display:grid; gap:3px; }
  .leyenda i { display:inline-block; width:11px; height:11px; border-radius:50%; margin-right:6px; vertical-align:-1px; }

  .mapa-btn { pointer-events:auto; min-height:44px; border-radius:22px; border:1px solid var(--linea); background:#fff;

  .pop { font-size:14px; line-height:1.35; min-width:190px; }

  .pop .pop-l { color:#334155; margin-top:3px; }
  .pop .pop-acc { display:flex; gap:6px; margin-top:8px; }

    text-decoration:none; color:var(--tinta); cursor:pointer; }
  .pop .pop-acc a.p { background:var(--azul); border-color:var(--azul); color:#fff; }
  .leaflet-popup-content { margin:12px 14px; }
  .leaflet-tooltip.num-tt { background:transparent; border:0; box-shadow:none; color:#fff; font-weight:800; font-size:11px; padding:0; }
  .leaflet-tooltip.num-tt.osc { color:var(--tinta); }
  .leaflet-tooltip.num-tt::before { display:none; }

  .velo { position:fixed; inset:0; background:rgba(15,23,42,.45); z-index:2000; display:flex; align-items:flex-end; justify-content:center; }
  .hoja { background:#fff; width:100%; max-width:560px; border-radius:18px 18px 0 0; padding:18px 16px;
    padding-bottom:max(18px, env(safe-area-inset-bottom)); max-height:92vh; overflow-y:auto; box-shadow:0 -6px 24px rgba(15,23,42,.2); }
  .hoja h3 { margin:0 0 2px; font-size:18px; }
  .hoja .sub { color:var(--gris); font-size:14px; margin-bottom:14px; }
  .hoja label.l { display:block; font-weight:600; font-size:14px; margin:12px 0 6px; }
  .hoja input[type=date], .hoja input[type=text], .hoja textarea { width:100%; min-height:44px; border:1px solid var(--linea);
    border-radius:10px; padding:10px 12px; background:#fff; font-size:16px; }
  .hoja textarea { min-height:76px; resize:vertical; }
  .opciones { display:grid; gap:6px; }
  .op { display:flex; align-items:center; gap:10px; border:1px solid var(--linea); border-radius:10px; padding:10px 12px;
    min-height:48px; cursor:pointer; }
  .op input { width:20px; height:20px; flex:none; accent-color:var(--azul); }
  .op .op-t { flex:1; }
  .op .op-f { color:var(--gris); font-size:14px; white-space:nowrap; }
  .op:has(input:checked) { border-color:var(--azul); background:var(--azul-f); }
  .foto-btn { display:flex; align-items:center; justify-content:center; gap:8px; min-height:48px; border:1px dashed var(--gris-2);
    border-radius:10px; color:var(--azul); font-weight:700; cursor:pointer; }
  .foto-prev { display:flex; gap:10px; align-items:center; margin-top:8px; font-size:14px; color:var(--gris); }
  .foto-prev img { width:72px; height:72px; object-fit:cover; border-radius:10px; }
  .hoja .nota-ayuda { font-size:13px; color:var(--gris); margin-top:6px; }
  .hoja .botones { display:grid; grid-template-columns:1fr 2fr; gap:8px; margin-top:18px; }
  .hoja .error { color:var(--rojo); font-size:14px; margin-top:10px; }
  .quien-sug { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }

  #toast { position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(20px);
    background:var(--tinta); color:#fff; padding:10px 16px; border-radius:12px; font-size:14px; z-index:3000; opacity:0;
    transition:opacity .2s, transform .2s; pointer-events:none; max-width:calc(100% - 32px); text-align:center; }
  #toast.on { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<header id="cab">
  <div class="h1"><h1>Postventa</h1><span id="act"></span></div>
  <div id="resumen">Cargando…</div>

  </div>
</section>
<div id="toast" role="status" aria-live="polite"></div>

<script src="postventa-logica.js?v=1"></script>

    if (d === 1) { return 'mañana'; }
    if (d === -1) { return 'ayer'; }
    if (d > 1 && d <= 6) { return diaSemana(iso); }
    return 'el ' + dia(iso);
  }
  function hace(n) { return n === 1 ? 'hace 1 día' : 'hace ' + n + ' días'; }
  function hora(ts) {
    var d = new Date(ts);
    return isNaN(d.getTime()) ? '' : String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  // ── red ─────────────────────────────────────────────────────────────────────────────────────
  function leer(ruta) {
    var ctl = typeof AbortController === 'function' ? new AbortController() : null;
    var t = ctl ? setTimeout(function () { ctl.abort(); }, 30000) : null;
    var url = SUPA + '/rest/v1/' + ruta + (ruta.indexOf('?') === -1 ? '?' : '&') + 'apikey=' + encodeURIComponent(KEY);
    return fetch(url, ctl ? { signal: ctl.signal } : undefined).then(function (r) {
      if (t) { clearTimeout(t); }
      if (!r.ok) { throw new Error('la base respondió ' + r.status); }
      return r.json();
    });
  }
  function escribir(tabla, cuerpo, extra) {
    return fetch(SUPA + '/rest/v1/' + tabla + (extra || ''), {
      method: extra ? 'PATCH' : 'POST',
      headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json',
        Prefer: extra ? 'return=representation' : 'return=representation' },
      body: JSON.stringify(cuerpo)
    }).then(function (r) {
      if (!r.ok) { return r.text().then(function (t) { throw new Error('no se guardó (' + r.status + ') ' + t.slice(0, 120)); }); }
      return r.json();
    });
  }
  function urlFoto(ruta) { return SUPA + '/storage/v1/object/public/' + BUCKET + '/' + ruta.split('/').map(encodeURIComponent).join('/'); }

  function cargar(silencioso) {
    if (!silencioso) { $('act').textContent = 'actualizando…'; }
    return Promise.all([
      leer('entrega?select=id,fecha,eliminado,data&eliminado=eq.false'),
      leer('entrega_estado?select=id,estado,fecha,eliminado'),
      leer('tarea_estado?select=id,realizada,realizada_at'),
      leer('postventa_evento?select=*&order=created_at.asc'),
      leer('postventa_geo?select=*')
    ]).then(function (r) {
      DATOS = { filas: r[0], estados: r[1], tareas: r[2], eventos: r[3], geo: r[4], ts: Date.now() };
      guardar(CACHE, JSON.stringify(DATOS));
      HOY = PV.hoyLocal();
      armar();
      $('act').textContent = 'al día ' + hora(DATOS.ts);
    }).catch(function (err) {
      var c = null;
      try { c = JSON.parse(leerLocal(CACHE) || 'null'); } catch (e) { c = null; }
      if (c && !DATOS) {
        DATOS = c;
        armar();
        $('act').textContent = 'sin señal';
        toast('Sin conexión: ves lo último guardado (' + hora(c.ts) + ')');
      } else if (!DATOS) {
        $('resumen').textContent = 'Sin conexión';
        $('vista-lista').innerHTML = '<div class="aviso mal">No pude traer los datos (' + esc(err.message) +
          '). Revisa la señal y <button type="button" class="b s" id="reintentar" style="display:inline-flex;min-height:36px;margin-left:4px">reintenta</button></div>';
        $('act').textContent = '';
      } else {
        $('act').textContent = 'sin señal';
      }
    });
  }

  // ── armar los servicios ─────────────────────────────────────────────────────────────────────
  function armar() {
    var est = {}, tar = {}, evs = {};
    DATOS.estados.forEach(function (x) { est[x.id] = x; });
    DATOS.tareas.forEach(function (x) { tar[x.id] = x; });
    DATOS.eventos.forEach(function (x) { (evs[x.entrega_id] = evs[x.entrega_id] || []).push(x); });
    var geo = {};
    (DATOS.geo || []).forEach(function (g) { geo[g.id] = g; });
    SERVICIOS = [];
    DATOS.filas.forEach(function (f) {
      var s = PV.servicio(f, est[f.id], tar, evs[f.id] || [], HOY);
      if (!s) { return; }
      s.urg = PV.urgencia(s, HOY);
      s.geo = geo[s.id] || null;
      s.tono = tono(s);
      SERVICIOS.push(s);
    });
    pintar();
    if (VISTA === 'mapa') { pintarMapa(); }
  }

  function enTerreno(s) { return s.grupo === 'activo' || s.grupo === 'revisar' || s.grupo === 'retirar'; }
  function esRetiro(s) {
    return s.grupo === 'retirar' || (s.grupo === 'activo' && s.fin && s.fin <= PV.sumarDias(HOY, 1) && (s.corto || !s.renovable));
  }
  function esRenovar(s) {
    return s.grupo === 'revisar' || (s.grupo === 'activo' && s.fin && !s.corto && s.renovable && PV.diasEntre(HOY, s.fin) <= 7);
  }
  // la limpieza solo se pide mientras el plazo corre: si terminó, primero hay que saber si renovó
  function esLimpieza(s) { return s.grupo === 'activo' && s.limpieza && (s.limpieza.estado === 'toca' || s.limpieza.estado === 'atrasada'); }

  /** El color y la frase corta del estado (lo más urgente gana). */
  function tono(s) {
    if (s.grupo === 'retirado') { return { c: 'gris', t: 'Retirado' }; }
    if (s.grupo === 'terminado') { return { c: 'gris', t: 'Terminado' }; }
    if (s.grupo === 'retirar') { return { c: 'rojo', t: 'Retirar' }; }
    if (s.grupo === 'revisar') { var v = PV.diasEntre(s.fin, HOY); return { c: 'rojo', t: v === 1 ? 'Venció ayer' : 'Venció ' + hace(v) }; }
    if (s.limpieza && s.limpieza.estado === 'atrasada') { return s.hechas.length ? { c: 'rojo', t: 'Limpieza atrasada' } : { c: 'ambar', t: 'Toca limpieza' }; }
    // (desde acá solo quedan los que siguen en curso)
    if (s.fin && s.fin === HOY) { return { c: 'ambar', t: s.corto || !s.renovable ? 'Retiro hoy' : 'Vence hoy' }; }
    if (s.limpieza && s.limpieza.estado === 'toca') { return { c: 'ambar', t: 'Toca limpieza' }; }
    if (s.fin && PV.diasEntre(HOY, s.fin) <= 5) {
      var n = PV.diasEntre(HOY, s.fin);
      return { c: 'ambar', t: (s.corto || !s.renovable ? 'Retiro ' : 'Vence ') + (n === 1 ? 'mañana' : 'en ' + n + ' días') };
    }
    return { c: 'verde', t: 'Al día' };
  }

  // ── la lista ────────────────────────────────────────────────────────────────────────────────
  var SECCIONES = [
    { id: 'revisar', titulo: 'Terminó el plazo', ayuda: '¿Renovó o hay que retirar? Si renovó por llamada, toca Extender.', c: 'rojo',
      es: function (s) { return s.grupo === 'revisar'; } },
    { id: 'retiros', titulo: 'Retiros', ayuda: '', c: 'rojo', es: function (s) { return esRetiro(s); } },
    { id: 'limpiezas', titulo: 'Toca limpieza', ayuda: '', c: 'ambar', es: function (s) { return esLimpieza(s); } },
    { id: 'aldia', titulo: 'Al día', ayuda: '', c: 'verde', es: function () { return true; } }
  ];
  var FILTROS = [
    { id: 'todos', texto: 'Todos', es: enTerreno },
    { id: 'limpiezas', texto: 'Limpiezas', es: esLimpieza },
    { id: 'retiros', texto: 'Retiros', es: function (s) { return enTerreno(s) && esRetiro(s); } },
    { id: 'renovar', texto: 'Por renovar', es: function (s) { return enTerreno(s) && esRenovar(s); } }
  ];
  function filtroActual() { return FILTROS.filter(function (f) { return f.id === FILTRO; })[0] || FILTROS[0]; }

  function coincide(s, q) {
    if (!q) { return true; }
    var t = PV.norm([s.cliente, s.direccion, s.direccionOriginal, s.lugar, s.telefono, s.id].join(' '));
    return q.split(/\s+/).every(function (p) { return t.indexOf(p) !== -1; });
  }

  function pintar() {
    var enCurso = SERVICIOS.filter(function (s) { return s.grupo === 'activo' || s.grupo === 'retirar'; });
    var banos = enCurso.reduce(function (a, s) { return a + s.cantidad; }, 0);
    var porConfirmar = SERVICIOS.filter(function (s) { return s.grupo === 'revisar'; }).length;
    $('resumen').textContent = enCurso.length + ' cliente' + (enCurso.length === 1 ? '' : 's') + ' en curso · ' +
      banos + ' baño' + (banos === 1 ? '' : 's') + (porConfirmar ? ' · ' + porConfirmar + ' por confirmar' : '');
    $('chips').innerHTML = FILTROS.map(function (f) {
      var n = SERVICIOS.filter(f.es).length;
      return '<button type="button" class="chip-f' + (f.id === FILTRO ? ' on' : '') + '" data-filtro="' + f.id + '" aria-pressed="' +
        (f.id === FILTRO) + '">' + esc(f.texto) + '<span class="n">' + n + '</span></button>';
    }).join('');

    var q = PV.norm(BUSCA.trim());
    var h = '';
    if (q) {
      var hall = SERVICIOS.filter(function (s) { return coincide(s, q); })
        .sort(function (a, b) { return (enTerreno(b) - enTerreno(a)) || b.inicio.localeCompare(a.inicio); });
      h += '<h2 class="sec"><span>Resultados</span><span class="n">' + hall.length + '</span></h2>';
      h += hall.length ? hall.slice(0, 60).map(ficha).join('') : '<div class="vacio"><b>Nada con "' + esc(BUSCA.trim()) + '"</b>Prueba con otra parte del nombre o la calle.</div>';
      if (hall.length > 60) { h += '<p class="sec-ayuda">Y ' + (hall.length - 60) + ' más: escribe un poco más para acotar.</p>'; }
    } else {
      var lista = SERVICIOS.filter(filtroActual().es);
      var usados = {};
      SECCIONES.forEach(function (sec) {
        var de = lista.filter(function (s) { return !usados[s.id] && sec.es(s); })
          .sort(function (a, b) {
            // los que terminaron hace poco primero: son los que más probablemente renovaron
            if (a.grupo === 'revisar' && b.grupo === 'revisar') { return b.fin.localeCompare(a.fin) || a.cliente.localeCompare(b.cliente); }
            return (b.urg - a.urg) || (a.limpieza && b.limpieza ? a.limpieza.toca.localeCompare(b.limpieza.toca) : 0) || a.cliente.localeCompare(b.cliente);
          });
        if (!de.length) { return; }
        de.forEach(function (s) { usados[s.id] = 1; });
        h += '<h2 class="sec ' + sec.c + '"><span>' + esc(sec.titulo) + '</span><span class="n">' + de.length + '</span></h2>';
        if (sec.ayuda) { h += '<p class="sec-ayuda">' + esc(sec.ayuda) + '</p>'; }
        h += de.map(ficha).join('');
      });
      if (!lista.length) {
        h += '<div class="vacio"><b>' + (FILTRO === 'todos' ? 'No hay baños en terreno' : 'Nada pendiente acá') + '</b>' +
          (FILTRO === 'todos' ? 'Cuando se entregue un baño aparece solo.' : 'Mira "Todos" para ver el resto.') + '</div>';
      }
      var fuera = SERVICIOS.filter(function (s) { return !enTerreno(s); });
      if (VER_TERMINADOS && fuera.length) {
        fuera.sort(function (a, b) { return b.inicio.localeCompare(a.inicio); });
        h += '<h2 class="sec"><span>Terminados y retirados</span><span class="n">' + fuera.length + '</span></h2>' +
          '<p class="sec-ayuda">Si alguno sigue con el baño (renovó y nadie lo anotó), ábrelo y toca Extender.</p>' +
          fuera.slice(0, 80).map(ficha).join('');
      }
      h += '<div class="pie">' + (fuera.length ? '<button type="button" id="ver-terminados">' +
        (VER_TERMINADOS ? 'Ocultar terminados' : 'Ver terminados y retirados (' + fuera.length + ')') + '</button>' : '') +
        '<span>Anotando como <b>' + esc(quien() || 'sin nombre') + '</b> · <button type="button" id="cambiar-quien" style="display:inline;padding:0">cambiar</button></span></div>';
    }
    $('vista-lista').innerHTML = h;
  }

  function telWsp(t) {
    var d = String(t || '').replace(/\D/g, '');
    if (d.length === 9 && d.charAt(0) === '9') { d = '56' + d; }
    return d.length >= 11 ? d : '';
  }

  function lineaPlazo(s) {
    if (s.corto && s.fin) {
      return s.inicio === s.fin ? 'evento del ' + dia(s.inicio) : 'del ' + dia(s.inicio) + ' al ' + dia(s.fin);
    }
    var t = 'desde el ' + dia(s.inicio);
    if (s.fin) { t += ' hasta el ' + dia(s.fin); } else { t += ', sin fecha de término'; }
    if (!s.corto && s.fin && PV.diasEntre(s.inicio, s.fin) >= 27) { t += ' · mes ' + PV.mesDelArriendo(s.inicio, s.fin < HOY ? s.fin : HOY); }
    if (s.extensiones.length) { t += ' · extendido ' + (s.extensiones.length === 1 ? '1 vez' : s.extensiones.length + ' veces'); }
    return t;
  }

  function lineaLimpieza(s) {
    var l = s.limpieza;
    if (!s.cadaDias) { return { c: '', t: s.corto ? 'sin limpieza (arriendo corto)' : s.aseoTexto }; }
    if (!l) { return { c: '', t: '' }; }
    var ult = s.ultimaLimpieza && s.ultimaLimpieza > s.inicio ? 'la última fue el ' + dia(s.ultimaLimpieza) : 'ninguna desde la entrega';
    // sin ninguna limpieza anotada no se sabe si está atrasada (hasta nov-2026 no había dónde anotarlas): se pide, sin alarma
    if (l.estado === 'atrasada' && !s.hechas.length) { return { c: 'ambar', t: 'toca, no hay limpiezas anotadas desde la entrega (' + dia(s.inicio) + ')' }; }
    if (l.estado === 'atrasada') { return { c: 'rojo', t: 'atrasada ' + (l.atraso === 1 ? '1 día' : l.atraso + ' días') + ' · ' + ult }; }
    if (l.estado === 'toca') { return { c: 'ambar', t: 'toca ya, a más tardar ' + relativo(l.vence) + ' · ' + ult }; }
    if (l.estado === 'no-toca') { return { c: 'verde', t: 'no alcanza a tocar antes del término · ' + ult }; }
    return { c: 'verde', t: 'al día, la próxima desde ' + relativo(l.toca) + ' · ' + ult };
  }

  function ficha(s) {
    var tel = telWsp(s.telefono);
    var lim = lineaLimpieza(s);
    var filas = '<dt>Plazo</dt><dd' + (s.grupo === 'revisar' || s.grupo === 'retirar' ? ' class="rojo"' : '') + '>' + esc(lineaPlazo(s)) + '</dd>';
    if (lim.t && s.grupo === 'activo') { filas += '<dt>Limpieza</dt><dd class="' + lim.c + '">' + esc(lim.t) + '</dd>'; }
    if (s.retirado) { filas += '<dt>Retiro</dt><dd>' + esc('el ' + dia(s.retirado.fecha) + (s.retirado.por ? ' · ' + s.retirado.por : '')) + '</dd>'; }
    var acc1 = '<div class="acc">' +
      (s.navegar ? '<a class="b p" href="' + esc(s.navegar) + '" target="_blank" rel="noopener">' + ICONOS.llegar + 'Cómo llegar</a>' : '<span class="b" aria-disabled="true">Sin dirección</span>') +
      (tel ? '<a class="b" href="tel:+' + tel + '">' + ICONOS.llamar + 'Llamar</a>' : '<span class="b" aria-disabled="true">Sin teléfono</span>') +
      (tel ? '<a class="b" href="https://wa.me/' + tel + '" target="_blank" rel="noopener">' + ICONOS.wsp + 'WhatsApp</a>' : '<span class="b" aria-disabled="true">WhatsApp</span>') +
      '</div>';
    var acc2;
    if (enTerreno(s)) {
      // el botón verde es lo que más probablemente toca: renovar si el plazo terminó, retirar si es un evento, si no la limpieza
      var verde = s.grupo === 'revisar' ? 'extender' : s.grupo === 'retirar' || (esRetiro(s) && !esLimpieza(s)) ? 'retiro' : s.cadaDias ? 'limpieza' : '';
      var bt = function (acc, txt) { return '<button type="button" class="b' + (verde === acc ? ' v' : '') + '" data-acc="' + acc + '">' + txt + '</button>'; };
      acc2 = '<div class="acc">' + bt('limpieza', 'Limpieza hecha') + bt('extender', 'Extender') + bt('retiro', 'Retirado') + '</div>';
    } else {
      acc2 = '<div class="acc" style="grid-template-columns:1fr"><button type="button" class="b" data-acc="extender">Sigue con el baño: extender</button></div>';
    }
    return '<article class="card ' + s.tono.c + '" id="f-' + esc(s.id) + '" data-id="' + esc(s.id) + '"><div class="c-in">' +
      '<div class="c-top"><div><div class="c-nom">' + esc(s.cliente) + '</div><div class="c-cant">' + s.cantidad + ' baño' + (s.cantidad === 1 ? '' : 's') +
      (s.lugar ? ' · ' + esc(s.lugar) : '') + '</div></div><span class="est ' + s.tono.c + '">' + esc(s.tono.t) + '</span></div>' +
      '<div class="c-dir">' + esc(s.direccion || s.lugar || 'Sin dirección') + '</div>' +
      '<dl class="filas">' + filas + '</dl>' + acc1 + acc2 + '</div>' +
      '<details class="mas"' + (ABIERTOS[s.id] ? ' open' : '') + '><summary>Detalle e historial</summary><div class="mas-in">' + detalle(s) + '</div></details>' +
      '</article>';
  }

  var NOMBRE_EV = { limpieza: 'Limpieza hecha', extension: 'Extendido', retiro: 'Retirado', ubicacion: 'Ubicación', nota: 'Nota' };
  function detalle(s) {
    var f = '';
    var dato = function (k, v) { if (v) { f += '<dt>' + esc(k) + '</dt><dd>' + esc(v) + '</dd>'; } };
    dato('Acordado', s.periodo || s.servicioTexto);
    dato('Aseo', s.aseoTexto);
    if (s.extensiones.length || s.finBase !== s.fin) { dato('Plazo original', s.finBase ? 'hasta el ' + dia(s.finBase) : 'sin fecha'); }
    dato('Recibe', s.marcas.RECIBE);
    dato('Acceso', s.marcas.ACCESO);
    dato('Equipo', s.marcas.EQUIPO);
    dato('Notas', s.notas);
    if (s.direccionOriginal && s.direccionOriginal !== s.direccion) { dato('Dirección de la ficha', s.direccionOriginal); }
    dato('Teléfono', s.telefono ? '+' + telWsp(s.telefono) : '');
    var h = '<dl class="filas">' + f + '</dl>';
    h += '<div class="acc-mas"><button type="button" class="b s" data-acc="ubicacion">' + (s.ubicacion ? 'Cambiar ubicación' : 'Poner ubicación exacta') + '</button>' +
      '<button type="button" class="b s" data-acc="nota">Anotar algo</button>' +
      '<button type="button" class="b s" data-acc="ver-mapa">Ver en el mapa</button></div>';
    var items = [];
    s.eventos.concat((DATOS.eventos || []).filter(function (x) { return x.entrega_id === s.id && x.anulado === true; }))
      .forEach(function (x) { items.push({ ev: x, ts: x.created_at }); });
    s.hechas.filter(function (x) { return x.fuente === 'bot'; }).forEach(function (x) {
      items.push({ bot: x, ts: x.fecha + 'T12:00:00' });
    });
    items.sort(function (a, b) { return String(b.ts).localeCompare(String(a.ts)); });
    var vistos = {};
    items = items.filter(function (i) { var k = i.ev ? i.ev.id : 'b' + i.ts; if (vistos[k]) { return false; } vistos[k] = 1; return true; });
    if (!items.length) {
      h += '<p class="sec-ayuda" style="margin:10px 0 0">Todavía no hay nada anotado.</p>';
    } else {
      h += '<ul class="hist">' + items.map(function (i) {
        if (i.bot) {
          return '<li><div class="h-txt"><b>Limpieza hecha</b> el ' + esc(dia(i.bot.fecha)) + '<div class="h-meta">marcada por WhatsApp o en la página de entregas' +
            (i.bot.nota ? ' · ' + esc(i.bot.nota) : '') + '</div></div></li>';
        }
        var x = i.ev;
        var que = NOMBRE_EV[x.tipo] || x.tipo;
        var cuando = x.tipo === 'extension' ? ' hasta el ' + dia(x.fecha) : (x.fecha ? ' el ' + dia(x.fecha) : '');
        var meta = [x.por || 'sin nombre', 'anotado ' + dia(PV.fechaDeMarca(x.created_at)) + ' ' + hora(x.created_at)];
        var nota = x.nota ? (x.tipo === 'ubicacion' && /^https?:/.test(x.nota) ? '<a href="' + esc(x.nota) + '" target="_blank" rel="noopener">' + esc(x.nota.slice(0, 48)) + '</a>' : esc(x.nota)) : '';
        return '<li class="' + (x.anulado ? 'anulado' : '') + '">' +
          (x.foto ? '<a href="' + esc(urlFoto(x.foto)) + '" target="_blank" rel="noopener"><img src="' + esc(urlFoto(x.foto)) + '" alt="Foto de la limpieza" loading="lazy"></a>' : '') +
          '<div class="h-txt"><b>' + esc(que) + '</b>' + esc(cuando) + (nota ? '<div>' + nota + '</div>' : '') +
          '<div class="h-meta">' + esc(meta.join(' · ')) + (x.anulado ? ' · anulado' : '') + '</div></div>' +
          (x.anulado ? '' : '<button type="button" class="anular" data-acc="anular" data-ev="' + esc(x.id) + '">Anular</button>') + '</li>';
      }).join('') + '</ul>';
    }
    return h;
  }

  // ── quién anota ─────────────────────────────────────────────────────────────────────────────
  function quien() { return (leerLocal('postventa_quien') || '').trim(); }
  function pedirQuien(obligatorio) {
    return new Promise(function (listo) {
      var previos = [];
      (DATOS ? DATOS.eventos : []).forEach(function (x) { if (x.por && previos.indexOf(x.por) === -1) { previos.push(x.por); } });
      var cuerpo = '<label class="l" for="q-nombre">Tu nombre</label><input type="text" id="q-nombre" maxlength="40" autocomplete="name" value="' + esc(quien()) + '" placeholder="Ej: Juan">' +
        (previos.length ? '<div class="quien-sug">' + previos.slice(-6).map(function (p) { return '<button type="button" class="chip-f" data-nombre="' + esc(p) + '">' + esc(p) + '</button>'; }).join('') + '</div>' : '') +
        '<p class="nota-ayuda">Queda anotado en cada limpieza y cada cambio. Así se sabe quién hizo qué.</p>';
      hoja({ titulo: '¿Quién anota?', sub: obligatorio ? 'Una sola vez en este teléfono.' : '', cuerpo: cuerpo, boton: 'Listo',
        alAbrir: function (el) {
          el.querySelectorAll('[data-nombre]').forEach(function (b) {
            b.addEventListener('click', function () { el.querySelector('#q-nombre').value = b.dataset.nombre; });
          });
        },
        alGuardar: function (el) {
          var n = el.querySelector('#q-nombre').value.trim();
          if (n.length < 2) { throw new Error('Escribe tu nombre'); }
          guardar('postventa_quien', n);
          return Promise.resolve(n);
        }
      }).then(listo);
    });
  }
  function conQuien() { return quien() ? Promise.resolve(quien()) : pedirQuien(true); }

  // ── la hoja (formularios) ───────────────────────────────────────────────────────────────────
  function hoja(op) {
    return new Promise(function (listo) {
      var velo = document.createElement('div');
      velo.className = 'velo';
      velo.innerHTML = '<div class="hoja" role="dialog" aria-modal="true" aria-labelledby="hoja-t"><h3 id="hoja-t">' + esc(op.titulo) + '</h3>' +
        (op.sub ? '<div class="sub">' + esc(op.sub) + '</div>' : '') + '<form novalidate>' + op.cuerpo +
        '<div class="error" hidden></div><div class="botones"><button type="button" class="b" data-cerrar>Cancelar</button>' +
        '<button type="submit" class="b p">' + esc(op.boton) + '</button></div></form></div>';
      document.body.appendChild(velo);
      var el = velo.querySelector('.hoja');
      var form = velo.querySelector('form');
      var err = velo.querySelector('.error');
      var cerrar = function (v) { velo.remove(); document.removeEventListener('keydown', tecla); listo(v); };
      var tecla = function (ev) { if (ev.key === 'Escape') { cerrar(null); } };
      document.addEventListener('keydown', tecla);
      velo.addEventListener('click', function (ev) { if (ev.target === velo || ev.target.hasAttribute('data-cerrar')) { cerrar(null); } });
      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        var btn = form.querySelector('button[type=submit]');
        err.hidden = true;
        var p;
        try { p = op.alGuardar(el); } catch (e) { err.textContent = e.message; err.hidden = false; return; }
        btn.disabled = true;
        btn.textContent = 'Guardando…';
        Promise.resolve(p).then(function (v) { cerrar(v === undefined ? true : v); }).catch(function (e) {
          err.textContent = e.message || 'No se pudo guardar';
          err.hidden = false;
          btn.disabled = false;
          btn.textContent = op.boton;
        });
      });
      if (op.alAbrir) { op.alAbrir(el); }
      var primero = el.querySelector('input:not([type=radio]):not([type=file]), textarea');
      if (primero && !('ontouchstart' in window)) { primero.focus(); }
    });
  }

  function servicioDe(id) { return SERVICIOS.filter(function (s) { return s.id === id; })[0] || null; }

  function anotar(s, tipo, campos) {
    return conQuien().then(function (por) {
      if (!por) { throw new Error('Falta tu nombre'); }
      var fila = { entrega_id: s.id, tipo: tipo, fecha: campos.fecha || null, nota: campos.nota || null, por: por, foto: campos.foto || null };
      return escribir('postventa_evento', fila).then(function (r) {
        DATOS.eventos.push(r[0]);
        guardar(CACHE, JSON.stringify(DATOS));
        armar();
        return r[0];
      });
    });
  }

  // foto: se achica en el teléfono (1280 px, JPG) antes de subirla
  function achicar(file) {
    return new Promise(function (ok, mal) {
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function () {
        var max = 1280;
        var k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        var c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * k);
        c.height = Math.round(img.naturalHeight * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(function (b) { if (b) { ok(b); } else { mal(new Error('No pude leer la foto')); } }, 'image/jpeg', 0.72);
      };
      img.onerror = function () { URL.revokeObjectURL(url); mal(new Error('No pude leer la foto')); };
      img.src = url;
    });
  }
  function subirFoto(s, blob, fecha) {
    var ruta = s.id + '/' + fecha + '-' + Date.now().toString(36) + '.jpg';
    return fetch(SUPA + '/storage/v1/object/' + BUCKET + '/' + ruta, {
      method: 'POST', headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'image/jpeg' }, body: blob
    }).then(function (r) {
      if (!r.ok) { throw new Error('La foto no se subió (' + r.status + '). Prueba de nuevo o guarda sin foto.'); }
      return ruta;
    });
  }

  function campoFecha(id, valor, max) {
    return '<input type="date" id="' + id + '" value="' + valor + '"' + (max ? ' max="' + max + '"' : '') + ' required>';
  }

  function formLimpieza(s) {
    var foto = null;
    var cuerpo = '<label class="l" for="f-fecha">¿Qué día se hizo?</label>' + campoFecha('f-fecha', HOY, HOY) +
      '<label class="l">Foto del baño limpio <span style="font-weight:400;color:var(--gris)">(recomendado)</span></label>' +
      '<label class="foto-btn" for="f-foto">Sacar o elegir foto</label><input type="file" id="f-foto" accept="image/*" capture="environment" hidden>' +
      '<div class="foto-prev" id="f-prev" hidden></div>' +
      '<label class="l" for="f-nota">Nota <span style="font-weight:400;color:var(--gris)">(opcional)</span></label>' +
      '<textarea id="f-nota" maxlength="300" placeholder="Ej: se limpiaron los 2 baños, cliente conforme"></textarea>';
    return hoja({ titulo: 'Limpieza hecha', sub: s.cliente + ' · ' + s.cantidad + ' baño' + (s.cantidad === 1 ? '' : 's'), cuerpo: cuerpo, boton: 'Guardar limpieza',
      alAbrir: function (el) {
        el.querySelector('#f-foto').addEventListener('change', function (ev) {
          var f = ev.target.files && ev.target.files[0];
          var prev = el.querySelector('#f-prev');
          if (!f) { return; }
          prev.hidden = false;
          prev.textContent = 'Preparando la foto…';
          achicar(f).then(function (b) {
            foto = b;
            prev.innerHTML = '<img alt="" src="' + URL.createObjectURL(b) + '"><span>Foto lista (' + Math.round(b.size / 1024) + ' KB)</span>';
          }).catch(function (e) { foto = null; prev.textContent = e.message; });
        });
      },
      alGuardar: function (el) {
        var fecha = el.querySelector('#f-fecha').value;
        if (!PV.fechaIso(fecha)) { throw new Error('Elige la fecha'); }
        if (fecha > HOY) { throw new Error('La fecha no puede ser futura'); }
        var nota = el.querySelector('#f-nota').value.trim();
        return conQuien().then(function () {
          return foto ? subirFoto(s, foto, fecha) : null;
        }).then(function (ruta) {
          return anotar(s, 'limpieza', { fecha: fecha, nota: nota, foto: ruta });
        }).then(function () { toast('Limpieza anotada' + (foto ? ' con foto' : '')); });
      }
    });
  }

  function formExtender(s) {
    var base = s.fin || HOY;
    // desde el fin del plazo; si terminó hace rato, se suman pasos hasta llegar a hoy (cubre el tiempo que siguió usándolo)
    var avanzar = function (paso, uno, varios) {
      var f = paso(base);
      var n = 1;
      while (f < HOY && n < 36) { f = paso(f); n += 1; }
      return { f: f, t: n === 1 ? uno : varios(n) };
    };
    var mes = avanzar(function (d) { return PV.masMeses(d, 1); }, '1 mes más', function (n) { return n + ' meses más (desde que terminó)'; });
    var quin = avanzar(function (d) { return PV.sumarDias(d, 14); }, '2 semanas más', function (n) { return (n * 2) + ' semanas más (desde que terminó)'; });
    var sem = avanzar(function (d) { return PV.sumarDias(d, 7); }, '1 semana más', function (n) { return n + ' semanas más (desde que terminó)'; });
    var opciones = [{ id: 'mes', t: mes.t, f: mes.f }, { id: 'quincena', t: quin.t, f: quin.f }, { id: 'semana', t: sem.t, f: sem.f }]
      .filter(function (o, i, a) { return a.findIndex(function (x) { return x.f === o.f; }) === i; });
    var porDefecto = s.corto ? 'semana' : 'mes';
    if (!opciones.some(function (o) { return o.id === porDefecto; })) { porDefecto = opciones[0].id; }
    var cuerpo = '<div class="opciones" role="radiogroup">' + opciones.map(function (o) {
      return '<label class="op"><input type="radio" name="ext" value="' + o.f + '"' + (o.id === porDefecto ? ' checked' : '') + '>' +
        '<span class="op-t">' + esc(o.t) + '</span><span class="op-f">hasta el ' + esc(dia(o.f)) + '</span></label>';
    }).join('') + '<label class="op"><input type="radio" name="ext" value="otra"><span class="op-t">Otra fecha</span>' +
      '<input type="date" id="e-otra" min="' + HOY + '" style="width:auto;min-height:38px;padding:4px 8px"></label></div>' +
      '<label class="l" for="e-nota">Cómo se acordó</label>' +
      '<textarea id="e-nota" maxlength="300" placeholder="Ej: renovó por llamada, paga por transferencia"></textarea>' +
      '<p class="nota-ayuda">Las limpiezas siguen corriendo hasta la fecha nueva y el bot lo sabe.</p>';
    var sub = s.fin ? (s.fin < HOY ? 'Terminaba el ' + dia(s.fin) : 'Hoy termina el ' + dia(s.fin)) : 'No tenía fecha de término';
    if (s.fin && s.fin < HOY) { sub += '. Se cuenta desde esa fecha.'; }
    return hoja({ titulo: 'Extender · ' + s.cliente, sub: sub, cuerpo: cuerpo, boton: 'Guardar extensión',
      alAbrir: function (el) {
        var otra = el.querySelector('#e-otra');
        otra.addEventListener('focus', function () { el.querySelector('input[value=otra]').checked = true; });
        otra.addEventListener('change', function () { el.querySelector('input[value=otra]').checked = true; });
      },
      alGuardar: function (el) {
        var sel = el.querySelector('input[name=ext]:checked');
        var fecha = sel ? sel.value : '';
        if (fecha === 'otra') { fecha = el.querySelector('#e-otra').value; }
        if (!PV.fechaIso(fecha)) { throw new Error('Elige hasta cuándo queda'); }
        if (fecha < HOY) { throw new Error('La fecha nueva tiene que ser de hoy en adelante'); }
        var nota = el.querySelector('#e-nota').value.trim();
        return anotar(s, 'extension', { fecha: fecha, nota: nota }).then(function () { toast('Extendido hasta el ' + dia(fecha)); });
      }
    });
  }

  function formRetiro(s) {
    var cuerpo = '<label class="l" for="r-fecha">¿Qué día se retiró?</label>' + campoFecha('r-fecha', HOY, HOY) +
      '<label class="l" for="r-nota">Nota <span style="font-weight:400;color:var(--gris)">(opcional)</span></label>' +
      '<textarea id="r-nota" maxlength="300" placeholder="Ej: retirados los 2 baños"></textarea>' +
      '<p class="nota-ayuda">Sale de los activos y el bot deja de pedir limpiezas. Si fue un error, se anula en el historial.</p>';
    return hoja({ titulo: 'Retirado · ' + s.cliente, sub: s.cantidad + ' baño' + (s.cantidad === 1 ? '' : 's') + ' · ' + (s.lugar || ''), cuerpo: cuerpo, boton: 'Marcar retirado',
      alGuardar: function (el) {
        var fecha = el.querySelector('#r-fecha').value;
        if (!PV.fechaIso(fecha) || fecha > HOY) { throw new Error('Elige un día de hoy hacia atrás'); }
        return anotar(s, 'retiro', { fecha: fecha, nota: el.querySelector('#r-nota').value.trim() }).then(function () { toast('Marcado como retirado'); });
      }
    });
  }

  function formUbicacion(s) {
    var cuerpo = '<label class="l" for="u-txt">Link de Google Maps o dirección exacta</label>' +
      '<textarea id="u-txt" maxlength="400" placeholder="Pega el link que mandó el cliente, o escribe calle, número y comuna">' + esc(s.ubicacion) + '</textarea>' +
      '<p class="nota-ayuda">Desde ahora el botón Cómo llegar abre esto. Dirección de la ficha: ' + esc(s.direccionOriginal || 'sin dirección') + '</p>';
    return hoja({ titulo: 'Ubicación · ' + s.cliente, cuerpo: cuerpo, boton: 'Guardar ubicación',
      alGuardar: function (el) {
        var t = el.querySelector('#u-txt').value.trim();
        if (t.length < 5) { throw new Error('Pega el link o escribe la dirección'); }
        return anotar(s, 'ubicacion', { nota: t }).then(function () { toast('Ubicación guardada'); });
      }
    });
  }

  function formNota(s) {
    return hoja({ titulo: 'Anotar · ' + s.cliente, cuerpo: '<label class="l" for="n-txt">¿Qué pasó?</label><textarea id="n-txt" maxlength="400" placeholder="Ej: pidió que la próxima limpieza sea el martes"></textarea>',
      boton: 'Guardar nota',
      alGuardar: function (el) {
        var t = el.querySelector('#n-txt').value.trim();
        if (t.length < 2) { throw new Error('Escribe la nota'); }
        return anotar(s, 'nota', { nota: t }).then(function () { toast('Nota guardada'); });
      }
    });
  }

  function anular(idEv) {
    var x = DATOS.eventos.filter(function (e) { return e.id === idEv; })[0];
    if (!x) { return; }
    var s = servicioDe(x.entrega_id);
    hoja({ titulo: 'Anular: ' + (NOMBRE_EV[x.tipo] || x.tipo), sub: (s ? s.cliente + ' · ' : '') + 'queda en el historial tachado',
      cuerpo: '<p style="margin:0">Úsalo si se anotó por error. No se borra: queda a la vista como anulado.</p>', boton: 'Anular',
      alGuardar: function () {
        return escribir('postventa_evento', { anulado: true }, '?id=eq.' + encodeURIComponent(idEv)).then(function () {
          x.anulado = true;
          guardar(CACHE, JSON.stringify(DATOS));
          armar();
          toast('Anulado');
        });
      }
    });
  }

  // ── el mapa ─────────────────────────────────────────────────────────────────────────────────
  var MAPA = null, CAPA = null, YO = null, LEAFLET = null, COLA_GEO = [], GEO_CORRIENDO = false;
  var COLOR = { rojo: '#DC2626', ambar: '#F59E0B', verde: '#16A34A', gris: '#64748B' };

  function cargarLeaflet() {
    if (LEAFLET) { return LEAFLET; }
    LEAFLET = new Promise(function (ok, mal) {
      var sc = document.createElement('script');
      sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
      sc.onload = function () { ok(window.L); };
      sc.onerror = function () { LEAFLET = null; mal(new Error('No cargó el mapa. Revisa la señal.')); };
      document.head.appendChild(sc);
    });
    return LEAFLET;
  }

  /** El punto de un servicio: exacto (link o coordenadas) › el buscado y guardado › el centro de la comuna. */
  function punto(s) {
    if (s.exacto) { return { ll: s.exacto, aprox: false }; }
    var g = s.geo;
    // la fila vale si se buscó lo mismo que hoy dice la ficha (o, con un link corto, su dirección mientras tanto)
    if (g && (g.q === s.geoQ || g.q === 'dir:' + s.geoQ) && g.lat !== null && g.lat !== undefined) {
      return { ll: [g.lat, g.lng], aprox: g.fuente === 'comuna' };
    }
    if (g && (g.q === s.geoQ || g.q === 'dir:' + s.geoQ) && g.fuente === 'nada') {
      return s.comunaCentro ? { ll: s.comunaCentro, aprox: true } : null;
    }
    if (s.comunaCentro) { return { ll: s.comunaCentro, aprox: true, falta: true }; }
    return null;
  }

  function enMapa() {
    var q = PV.norm(BUSCA.trim());
    return SERVICIOS.filter(function (s) { return q ? coincide(s, q) && enTerreno(s) : filtroActual().es(s); });
  }

  function popup(s) {
    var lim = lineaLimpieza(s);
    return '<div class="pop"><b>' + esc(s.cliente) + '</b><div class="pop-l">' + s.cantidad + ' baño' + (s.cantidad === 1 ? '' : 's') + ' · ' + esc(s.tono.t) + '</div>' +
      '<div class="pop-l">' + esc(s.direccion || s.lugar) + '</div>' + (lim.t && s.grupo === 'activo' ? '<div class="pop-l">Limpieza: ' + esc(lim.t) + '</div>' : '') +
      '<div class="pop-acc">' + (s.navegar ? '<a class="p" href="' + esc(s.navegar) + '" target="_blank" rel="noopener">Cómo llegar</a>' : '') +
      '<button type="button" data-ir="' + esc(s.id) + '">Ver ficha</button></div></div>';
  }

  function pintarMapa(encuadrar) {
    cargarLeaflet().then(function (L) {
      if (!MAPA) {
        MAPA = L.map('mapa', { zoomControl: true, attributionControl: true }).setView([-33.45, -70.66], 10);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19,
          attribution: '© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>' }).addTo(MAPA);
        CAPA = L.layerGroup().addTo(MAPA);
        MAPA.on('popupopen', function (ev) {
          var b = ev.popup.getElement().querySelector('[data-ir]');
          if (b) { b.addEventListener('click', function () { irAFicha(b.dataset.ir); }); }
        });
        encuadrar = true;
      }
      MAPA.invalidateSize();
      CAPA.clearLayers();
      var lista = enMapa();
      var limites = [];
      var faltan = [];
      // dos baños en el mismo punto (la misma comuna aproximada) se separan un poco para poder tocarlos
      var usados = {};
      lista.forEach(function (s) {
        var p = punto(s);
        if (!p) { return; }
        if (p.falta) { faltan.push(s); }
        var k = p.ll[0].toFixed(4) + ',' + p.ll[1].toFixed(4);
        var n = usados[k] = (usados[k] || 0) + 1;
        var ll = n === 1 ? p.ll : [p.ll[0] + Math.sin(n * 2.4) * 0.0025 * Math.sqrt(n), p.ll[1] + Math.cos(n * 2.4) * 0.003 * Math.sqrt(n)];
        var col = COLOR[s.tono.c] || COLOR.gris;
        var m = L.circleMarker(ll, { radius: s.cantidad > 1 ? 11 : 9, color: p.aprox ? col : '#fff', weight: p.aprox ? 2.5 : 2,
          dashArray: p.aprox ? '3 3' : null, fillColor: p.aprox ? '#fff' : col, fillOpacity: p.aprox ? 0.85 : 0.95 });
        m.bindPopup(popup(s), { maxWidth: 260 });
        if (s.cantidad > 1) {
          m.bindTooltip(String(s.cantidad), { permanent: true, direction: 'center', className: 'num-tt' + (p.aprox ? ' osc' : ''), interactive: false });
        }
        m.addTo(CAPA);
        m._pvId = s.id;
        limites.push(ll);
      });
      if (encuadrar && limites.length) { MAPA.fitBounds(limites, { padding: [36, 36], maxZoom: 14 }); }
      var est = $('mapa-estado');
      if (faltan.length) { buscarPuntos(faltan); }
      else if (!GEO_CORRIENDO) { est.hidden = !lista.length ? false : true; est.textContent = lista.length ? '' : 'No hay baños para mostrar con este filtro'; }
    }).catch(function (e) { $('mapa-estado').hidden = false; $('mapa-estado').textContent = e.message; });
  }

  // Busca en OpenStreetMap la dirección de los que no tienen punto (de a uno por segundo, como pide OSM) y la guarda
  // en postventa_geo: la próxima vez, y en cualquier teléfono, ya está.
  function buscarPuntos(lista) {
    lista.forEach(function (s) { if (COLA_GEO.indexOf(s) === -1) { COLA_GEO.push(s); } });
    if (GEO_CORRIENDO) { return; }
    GEO_CORRIENDO = true;
    var est = $('mapa-estado');
    var total = COLA_GEO.length;
    var hechos = 0;
    var cambio = false;
    var siguiente = function () {
      var s = COLA_GEO.shift();
      if (!s) {
        GEO_CORRIENDO = false;
        est.hidden = true;
        if (cambio) { pintarMapa(false); }
        return;
      }
      hechos += 1;
      est.hidden = false;
      est.textContent = 'Ubicando direcciones ' + hechos + ' de ' + total + '…';
      geocodificar(s).then(function (g) {
        if (g) { s.geo = g; cambio = true; if (hechos % 5 === 0) { pintarMapa(false); } }
      }).catch(function () { /* sin red: queda en la comuna */ }).then(function () { setTimeout(siguiente, 1100); });
    };
    siguiente();
  }

  // una búsqueda en OSM: el punto si es de calle o más fino, null si no (de a una por segundo: lo pide OSM)
  function osm(q) {
    var url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=cl&accept-language=es' +
      '&viewbox=-71.75,-32.85,-70.15,-34.25&q=' + encodeURIComponent(q + (/chile/i.test(q) ? '' : ', Chile'));
    return fetch(url).then(function (r) { return r.ok ? r.json() : []; }).then(function (r) {
      var x = r && r[0];
      if (!x || Math.abs(parseFloat(x.lat) + 33.5) > 1.6 || Math.abs(parseFloat(x.lon) + 70.8) > 1.6) { return null; }
      return Number(x.place_rank || 0) >= 26 ? [parseFloat(x.lat), parseFloat(x.lon)] : null;
    });
  }
  function enCascada(qs) {
    if (!qs.length) { return Promise.resolve(null); }
    return osm(qs[0]).then(function (p) {
      if (p || qs.length === 1) { return p; }
      return new Promise(function (ok) { setTimeout(ok, 1100); }).then(function () { return enCascada(qs.slice(1)); });
    });
  }
  function geocodificar(s) {
    // un link corto (maps.app.goo.gl) no se puede abrir desde acá: lo resuelve scripts/geo-postventa.mjs; mientras, la dirección
    var qs = PV.consultasGeo(s);
    if (!qs.length) { return Promise.resolve(null); }
    return enCascada(qs).then(function (p) {
      var fila;
      if (p) {
        fila = { id: s.id, q: s.geoQ, lat: p[0], lng: p[1], fuente: 'osm' };
      } else if (s.comunaCentro) {
        fila = { id: s.id, q: s.geoQ, lat: s.comunaCentro[0], lng: s.comunaCentro[1], fuente: 'comuna' };
      } else {
        fila = { id: s.id, q: s.geoQ, lat: null, lng: null, fuente: 'nada' };
      }
      // si el punto viene de un link corto, la fila queda con la dirección: el script la cambia por el punto exacto
      if (s.linkCorto) { fila.q = 'dir:' + s.geoQ; }
      return fetch(SUPA + '/rest/v1/postventa_geo', { method: 'POST',
        headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates,return=minimal' },
        body: JSON.stringify(fila) }).catch(function () { return null; }).then(function () {
        var i = DATOS.geo.findIndex(function (y) { return y.id === s.id; });
        if (i === -1) { DATOS.geo.push(fila); } else { DATOS.geo[i] = fila; }
        guardar(CACHE, JSON.stringify(DATOS));
        return fila;
      });
    });
  }

  function irAFicha(id) {
    BUSCA = '';
    $('buscar').value = '';
    var s = servicioDe(id);
    if (s && !filtroActual().es(s)) { FILTRO = 'todos'; }
    if (s && !enTerreno(s)) { VER_TERMINADOS = true; }
    ABIERTOS[id] = true;
    ponerVista('lista');
    pintar();
    var el = document.getElementById('f-' + id);
    if (el) {
      el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      el.classList.remove('brilla');
      void el.offsetWidth;
      el.classList.add('brilla');
    }
  }

  function verEnMapa(id) {
    var s = servicioDe(id);
    ponerVista('mapa');
    var tras = function () {
      if (!MAPA || !s) { return; }
      var p = punto(s);
      if (p) { MAPA.setView(p.ll, 15); }
      CAPA.eachLayer(function (m) { if (m._pvId === id) { m.openPopup(); } });
    };
    cargarLeaflet().then(function () { setTimeout(tras, 350); });
  }

  // ── vistas, filtros y clics ─────────────────────────────────────────────────────────────────
  function medir() {
    var h = $('cab').offsetHeight;
    document.documentElement.style.setProperty('--alto-header', h + 'px');
    document.documentElement.style.setProperty('--alto-barra', $('barra').offsetHeight + 'px');
  }
  function ponerVista(v) {
    VISTA = v;
    document.querySelectorAll('.tabs button').forEach(function (b) {
      var on = b.dataset.tab === v;
      b.classList.toggle('on', on);
      b.setAttribute('aria-selected', String(on));
    });
    $('vista-lista').hidden = v !== 'lista';
    $('vista-mapa').hidden = v !== 'mapa';
    medir();
    if (v === 'mapa' && DATOS) { pintarMapa(!MAPA); }
  }

  document.querySelector('.tabs').addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-tab]');
    if (b) { ponerVista(b.dataset.tab); }
  });
  $('chips').addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-filtro]');
    if (!b) { return; }
    FILTRO = b.dataset.filtro;
    guardar('postventa_filtro', FILTRO);
    pintar();
    if (VISTA === 'mapa') { pintarMapa(true); }
  });
  var tBusca = null;
  $('buscar').addEventListener('input', function (ev) {
    BUSCA = ev.target.value;
    clearTimeout(tBusca);
    tBusca = setTimeout(function () { pintar(); if (VISTA === 'mapa') { pintarMapa(true); } }, 150);
  });
  $('donde-estoy').addEventListener('click', function () {
    if (!navigator.geolocation) { toast('Este teléfono no da su ubicación'); return; }
    navigator.geolocation.getCurrentPosition(function (p) {
      var ll = [p.coords.latitude, p.coords.longitude];
      cargarLeaflet().then(function (L) {
        if (YO) { YO.remove(); }
        YO = L.circleMarker(ll, { radius: 8, color: '#fff', weight: 3, fillColor: '#2563EB', fillOpacity: 1 }).addTo(MAPA).bindTooltip('Tú');
        MAPA.setView(ll, 13);
      });
    }, function () { toast('No pude saber dónde estás (revisa el permiso de ubicación)'); }, { enableHighAccuracy: true, timeout: 12000 });
  });

  $('vista-lista').addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-acc], #ver-terminados, #cambiar-quien, #reintentar');
    if (!b) { return; }
    if (b.id === 'reintentar') { cargar(); return; }
    if (b.id === 'ver-terminados') { VER_TERMINADOS = !VER_TERMINADOS; pintar(); return; }
    if (b.id === 'cambiar-quien') { pedirQuien(false).then(function () { pintar(); }); return; }
    var card = b.closest('.card');
    var s = card ? servicioDe(card.dataset.id) : null;
    var acc = b.dataset.acc;
    if (acc === 'anular') { anular(b.dataset.ev); return; }
    if (!s) { return; }
    ABIERTOS[s.id] = ABIERTOS[s.id] || acc === 'nota' || acc === 'ubicacion';
    if (acc === 'ver-mapa') { verEnMapa(s.id); return; }
    var form = { limpieza: formLimpieza, extender: formExtender, retiro: formRetiro, ubicacion: formUbicacion, nota: formNota }[acc];
    // el nombre se pide ANTES del formulario (una vez por teléfono), no encima de él
    if (form) { conQuien().then(function (n) { if (n) { form(servicioDe(s.id) || s); } }); }
  });
  $('vista-lista').addEventListener('toggle', function (ev) {
    var d = ev.target;
    if (!d.classList || !d.classList.contains('mas')) { return; }
    var card = d.closest('.card');
    if (card) { if (d.open) { ABIERTOS[card.dataset.id] = true; } else { delete ABIERTOS[card.dataset.id]; } }
  }, true);

  var tToast = null;
  function toast(t) {
    var el = $('toast');
    el.textContent = t;
    el.classList.add('on');
    clearTimeout(tToast);
    tToast = setTimeout(function () { el.classList.remove('on'); }, 2600);
  }

  // al volver a la pestaña (o pasado medio minuto), se trae lo nuevo sin borrar lo que se está mirando
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && DATOS && Date.now() - DATOS.ts > 30000 && !document.querySelector('.velo')) { cargar(true); }
  });
  window.addEventListener('resize', medir);
  medir();
  // lo guardado de la última visita sale al tiro; lo vivo lo reemplaza apenas llega
  try {
    var previo = JSON.parse(leerLocal(CACHE) || 'null');
    if (previo && previo.filas) { DATOS = previo; armar(); $('act').textContent = 'cargando…'; }
  } catch (e) { /* caché roto: se espera la red */ }
  cargar();
})();
</script>
</body>
</html>
