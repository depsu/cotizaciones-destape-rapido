<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Bandeja · {{BRAND_NAME}}</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="{{BRAND_SHORT}}" />
<meta name="theme-color" content="#F1F4F5" media="(max-width:820px)" />
<meta name="theme-color" content="{{BRAND_COLOR}}" />
<style>
  :root{
    --brand:{{BRAND_COLOR}}; --brand-rgb:{{BRAND_RGB}}; --brand-soft:color-mix(in srgb, var(--brand) 8%, #fff); --accent:#E0A82E;
    --dark:#1E2A2A; --gray:#5F6B6B; --line:#E1E3E6; --bg:#F1F4F5;
    /* Segunda capa de neutros: el menú y las barras van un tono más frío que el contenido. */
    --panel:#eef2f2; --superficie:#fff; --linea-suave:#edf1f1;
    /* Escala de profundidad con nombre, para no inventar números sueltos. */
    --z-lista:1; --z-barra:5; --z-cabecera:10; --z-cajon:12; --z-vista:20;
    --z-compose:25; --z-toast:40; --z-modal:50;
    /* Curva y tiempos únicos: 150-250 ms, salida suave, sin rebotes. */
    --curva:cubic-bezier(.2,.8,.3,1); --rapido:.15s; --normal:.22s;
    /* Alto real de la cabecera. Lo mide el JS al arrancar: si se escribe a mano queda
       desfasado en cuanto cambia el tamaño de letra, y las barras pegajosas se cortan. */
    --alto-cabecera:64px;
    /* Superficies Material 3 (las de Gmail): el fondo NO es blanco y cada correo va sobre
       una superficie propia. Deja además el modo oscuro listo para una segunda tanda. */
    --sup:#fff; --sup-low:#F7F9FA; --sup-c:#F1F4F5; --sup-high:#ECEFF1;
    --on-sup:#1B1C1E; --on-sup-var:#5F6368; --outline-var:#E1E3E6;
    /* Escala de radios y elevación con nombre: nada de números sueltos. */
    --r-xs:4px; --r-s:8px; --r-m:12px; --r-l:16px; --r-xl:28px;
    --el3:0 1px 3px rgba(0,0,0,.15),0 4px 8px rgba(0,0,0,.10);
  }
  /* Sin rectángulo gris de iOS al tocar: el feedback lo damos nosotros con :active. */
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:'Google Sans','Google Sans Text',Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--dark)}
  /* El rebote de la página no debe disparar el pull-to-refresh del navegador: ya tenemos uno. */
  html,body{overscroll-behavior-y:contain}
  button,[role="button"],[role="checkbox"],.side-b,.pag{touch-action:manipulation}
  /* Arrastrar una fila para deslizarla no debe seleccionar su texto; el cuerpo del correo sí. */
  .hrow{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .mbody,.hm-body{-webkit-user-select:text;user-select:text}
  header{background:var(--brand);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 14px;display:flex;align-items:center;gap:12px;
         position:sticky;top:0;z-index:var(--z-cabecera);
         transition:transform var(--normal) var(--curva)}
  header h1{font-size:17px;margin:0;font-weight:600;flex:1}
  header button{background:rgba(0,0,0,.16);color:#fff;border:0;border-radius:8px;padding:7px 12px;
                min-height:44px;min-width:44px;
                font-size:13px;cursor:pointer}
  header button:hover{background:rgba(0,0,0,.30)}
  .wrap{max-width:880px;margin:0 auto;padding:14px}

  #login{max-width:360px;margin:14vh auto;background:#fff;border:1px solid var(--line);border-radius:14px;
         padding:26px;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.06)}
  #login h2{margin:0 0 4px;color:var(--brand)}
  #login p{color:var(--gray);font-size:13px;margin:0 0 18px}
  #login input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;font-size:15px}
  #login button{margin-top:12px;width:100%;background:var(--brand);color:#fff;border:0;border-radius:9px;
                padding:11px;font-size:15px;font-weight:600;cursor:pointer}
  .err{color:#9c3a25;font-size:13px;margin-top:10px;min-height:16px}

  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:8px;
        cursor:pointer;transition:.12s;position:relative}
  .card:hover{border-color:var(--brand);box-shadow:0 3px 12px rgba(var(--brand-rgb),.08)}
  .card-noleido{border-left:3px solid var(--brand)}
  .row1{display:flex;align-items:center;gap:8px;margin-bottom:3px}
  .de{font-size:14px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--dark)}
  .de.bold,.asunto.bold{font-weight:700}
  .fecha{font-size:12px;color:var(--gray);white-space:nowrap}
  .asunto{font-size:14px;color:var(--dark);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .snippet{font-size:12.5px;color:var(--gray);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{font-size:10.5px;background:var(--brand-soft);color:var(--brand);padding:2px 7px;border-radius:20px;font-weight:600}
  .est{font-size:10.5px;padding:2px 7px;border-radius:20px;font-weight:700}
  .est-ajuste{background:#fde0e0;color:#9c3a25}
  .qa{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .qa-b{background:#f2f5f5;border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12px;
        cursor:pointer;color:var(--dark)}
  .qa-b:hover{background:#e7edec}
  .cargar-mas{display:block;width:100%;margin:6px 0 20px;background:#fff;border:1px solid var(--line);
              border-radius:10px;padding:12px;font-size:13.5px;color:var(--brand);font-weight:600;cursor:pointer}
  .cargar-mas:hover{background:var(--brand-soft)}

  .tabs{display:flex;gap:8px;overflow-x:auto;max-width:820px;margin:0 auto;padding:12px 16px 0;-webkit-overflow-scrolling:touch}
  .tab{flex:0 0 auto;font-size:13.5px;font-weight:600;background:#fff;border:1px solid var(--line);color:var(--gray);
       border-radius:999px;padding:7px 15px;cursor:pointer;white-space:nowrap}
  .tab.activo{background:var(--brand);border-color:var(--brand);color:#fff}
  .tab-cnt{display:inline-block;min-width:18px;height:18px;line-height:18px;padding:0 5px;margin-left:4px;
           background:#e5484d;color:#fff;border-radius:999px;font-size:11px;text-align:center;vertical-align:1px}
  .tab-cnt.gris{background:#9aa5a5}
  .vacio{text-align:center;color:var(--gray);padding:50px 0;font-size:14px}

  .blq{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
  .blq .v{font-weight:600;font-size:14px}
  .blq .m{font-size:12.5px;color:var(--gray);margin-top:3px}
  .blq .f{font-size:11.5px;color:var(--gray);margin-top:3px}
  .blq button{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 11px;
              font-size:12.5px;cursor:pointer;color:var(--brand)}

  /* ===== Lectura =====
     En escritorio ancho es un PANEL AL COSTADO (la lista sigue a la vista, como un
     cliente de correo de verdad); en pantallas chicas ocupa todo, con flecha de volver.
     Nunca es una ventana flotante con scroll dentro de otro scroll. */
  #overlay{display:none}
  #overlay.abierta{display:block}
  #modal{width:100%;background:transparent}
  @media (min-width:1180px){
    #overlay.abierta{position:relative;flex:1 1 0;min-width:0;align-self:stretch;
      height:100%;overflow-y:auto;background:var(--bg);
      border-left:1px solid var(--line);z-index:var(--z-lista)}
    /* Con el panel abierto la lista se angosta. En ese ancho, una sola línea deja el
       asunto en 90px (ilegible): la fila pasa a DOS líneas, como Apple Mail o Outlook. */
    body.leyendo .principal{flex:0 0 clamp(340px, 30%, 460px)}
    body.leyendo .hadj{display:none}
    body.leyendo .hrow{height:auto;padding:8px 12px;align-items:flex-start}
    body.leyendo .hrow > .hcheck,body.leyendo .hrow > .hstar,
    body.leyendo .hrow > .av,body.leyendo .hrow > .hdot{margin-top:2px}
    body.leyendo .hfila2{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
    body.leyendo .hquien{flex:none;width:auto;max-width:100%;font-size:13.5px}
    body.leyendo .hasunto{flex:none;white-space:normal;display:-webkit-box;
      -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35;font-size:13px}
    body.leyendo .hfecha{align-self:flex-start;margin-top:2px}
    /* Los estados bajan a su propia línea: si no, le comen el nombre al cliente. */
    body.leyendo .hestados{display:flex;gap:4px;flex-wrap:wrap;margin-top:1px}
    body.leyendo .hestados:empty{display:none}
  }
  @media (max-width:1179px){
    /* La conversación ocupa la pantalla ENTERA, tapando la cabecera (como la app de
       Gmail en el teléfono). Así su barra de acciones se pega arriba del todo: no hay
       rendija por donde asome la lista ni nada que le corte los botones. */
    #overlay.abierta{position:fixed;inset:0;background:var(--bg);z-index:var(--z-vista);
      overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
    #modal{max-width:820px;margin:0 auto}
  }
  /* Barra superior fija: atrás + acciones, igual que la barra de Gmail sobre la conversación. */
  /* Barra de acciones pegada arriba del panel. Opaca y con sombra al despegarse, para
     que se note que el contenido pasa POR DEBAJO y no queda cortado a medias. */
  .vbar{position:sticky;top:0;z-index:var(--z-barra);background:var(--bg);
        border-bottom:1px solid var(--line);display:flex;align-items:center;gap:4px;
        padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;
        transition:box-shadow var(--rapido) var(--curva)}
  .vbar.despegada{box-shadow:0 4px 12px rgba(15,42,42,.10)}
  /* Barras con scroll horizontal: iOS no muestra scrollbar → sin pista, los botones de la
     derecha "no existen". El difuminado aparece solo cuando de verdad hay más contenido. */
  .vbar.desborda,.tabs.desborda,.mbar.desborda{
    -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 34px),rgba(0,0,0,.15));
    mask-image:linear-gradient(90deg,#000 calc(100% - 34px),rgba(0,0,0,.15))}
  /* Al despegarse aparece el asunto en la barra: así sabes qué estás leyendo aunque
     hayas bajado. Gmail deja el asunto arriba y lo pierdes de vista. */
  .vbar-asunto{display:none;flex:1;min-width:0;font-size:13.5px;font-weight:600;
        color:var(--dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
        padding-left:6px}
  .vbar.despegada .vbar-asunto{display:block}
  .vbar.despegada .mbar{flex:0 0 auto}
  /* Con panel al costado no hace falta "volver": la lista está ahí al lado. */
  @media (min-width:1180px){ .vback{display:none} }
  .vback{flex:none;background:none;border:0;font-size:20px;line-height:1;cursor:pointer;color:var(--dark);
         padding:6px 10px;border-radius:8px}
  .vback:hover{background:var(--surface2,#e7edec)}
  .mhead{padding:16px 18px 10px;background:transparent;color:var(--dark)}
  .mhead .masunto{font-size:21px;font-weight:600;margin-bottom:6px;line-height:1.25;color:var(--dark)}
  .mhead .meta{font-size:12.5px;color:var(--gray);line-height:1.5}
  /* El hilo NO es una tarjeta con tarjetas dentro: cada mensaje es su propia superficie. */
  .mbody{font-size:14px;line-height:1.6;word-break:break-word;margin:0 14px;
         display:flex;flex-direction:column;gap:8px}
  .mbody:not(.hilo){padding:16px 18px;white-space:pre-wrap;background:var(--superficie);
         border:1px solid var(--line);border-radius:12px}
  /* Sin min-height: el alto lo calcula montarIframe() según el contenido real del correo. */
  .mbody iframe{width:100%;border:0;background:#fff;border-radius:6px;display:block}
  .mclose{display:none}
  .burbuja{max-width:82%;padding:9px 12px;border-radius:12px;margin:8px 0;white-space:pre-wrap;
           font-size:13.5px;line-height:1.5;word-break:break-word}
  .b-cli{background:#fff;border:1px solid var(--line);margin-right:auto;border-top-left-radius:3px}
  .b-nos{background:var(--brand-soft);margin-left:auto;border-top-right-radius:3px}
  .b-meta{font-size:11px;color:var(--gray);margin-bottom:4px;font-weight:600}
  .b-adj{font-size:12px;color:var(--brand);margin-top:6px}
  /* La caja de respuesta es la acción principal: se distingue del hilo con un fondo propio
     y el borde en color de marca, no con más ruido. */
  .resp{padding:16px 18px;background:var(--superficie);border:1px solid var(--line);
        border-top:2px solid var(--brand);border-radius:12px;margin:14px 14px 48px;
        box-shadow:0 2px 10px rgba(15,42,42,.06)}
  .resp h3{margin:0 0 10px;font-size:14px;font-weight:700;color:var(--brand);
        text-transform:none;letter-spacing:0}
  .resp textarea{width:100%;min-height:160px;border:1px solid var(--line);border-radius:9px;padding:11px;
                 font-size:14px;font-family:inherit;line-height:1.6;resize:vertical}
  .acciones{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .btn{border:0;border-radius:9px;padding:10px 14px;font-size:14px;font-weight:600;cursor:pointer}
  .btn-claude{background:#5b3fbf;color:#fff}
  .btn-guardar{background:#eef2f2;color:var(--dark)}
  .btn-enviar{background:var(--brand);color:#fff}
  .btn-spam{background:#fff;border:1px solid var(--line);color:#9c3a25}
  .btn[disabled]{opacity:.55;cursor:default}
  .estado-msg{font-size:12.5px;color:var(--gray);margin-top:8px;min-height:16px}
  .enviada{background:#d6f0e2;border:1px solid #aedcc4;border-radius:9px;padding:12px;white-space:pre-wrap;
           font-size:13.5px;line-height:1.6}
  .ajuste-box textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:9px;padding:10px;
           font-size:13.5px;font-family:inherit;margin-bottom:8px}
  .ajuste-cola{background:#fff6ed;border:1px solid #f1d3b5;border-radius:9px;padding:11px;font-size:13px;line-height:1.55}
  .ajuste-tit{font-size:12px;color:#5b3fbf;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
  .chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
  .chip{font-size:10.5px;background:#eef3f2;color:var(--brand);padding:2px 8px;border-radius:20px;
        font-weight:600;white-space:nowrap}
  .metiquetas{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .chip-x{cursor:pointer;margin-left:5px;opacity:.7;font-weight:700}
  /* La cabecera de la conversación ahora es clara (vista, no modal teal): chip legible. */
  .chip-add{font-size:11px;background:var(--brand-soft);color:var(--brand);border:1px solid var(--line);
        border-radius:20px;padding:3px 10px;cursor:pointer}
  .chip-add:hover{background:#d8ebe8}
  .mbar{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;background:transparent;
        padding:0;flex:1}
  .mbar-b{min-height:40px;padding:0 12px;font-size:13.5px;border-radius:var(--r-s);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;
        background:#f2f5f5;color:var(--dark);flex:0 0 auto;cursor:pointer;white-space:nowrap}
  .mbar-b.primary{border-color:var(--brand);color:var(--brand)}
  .mbar-b.danger{color:#9c3a25}
  .mbar-b[disabled]{opacity:.5;cursor:default}
  /* ===== Movimiento (fase 18) =====
     Gmail es casi estático: aparecer/desaparecer sin transición. Aquí se suaviza lo que
     el ojo necesita seguir —abrir un mensaje, entrar a la conversación, el aviso que
     aparece abajo— sin caer en adornos. Todo se apaga si el sistema pide menos movimiento. */
  .toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));
        transform:translateX(-50%) translateY(12px);
        background:var(--dark);color:#fff;padding:10px 16px;border-radius:var(--r-xs);font-size:14px;
        min-height:48px;align-items:center;box-shadow:var(--el3);max-width:calc(100vw - 32px);
        z-index:var(--z-toast);opacity:0;pointer-events:none;
        transition:opacity .18s ease, transform .22s cubic-bezier(.2,.8,.3,1)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* El cuerpo de un mensaje se despliega al abrirse. Se anima el CONTENIDO (no la altura
     con grid): los iframes de los correos calculan su alto solos y una animación de
     altura les gana la pelea, dejando el correo cortado. */
  .hm-body{display:none;padding:0 16px 12px}
  .hm.abierto .hm-body{display:block;animation:despliega .26s cubic-bezier(.2,.8,.3,1)}
  @keyframes despliega{ from{opacity:0; transform:translateY(-6px)} to{opacity:1; transform:none} }
  .hm.abierto .hm-snip{display:none}
  .hm-head{transition:background .12s ease}
  .hm-head:hover{background:#fafcfc}

  /* La conversación entra deslizándose desde la derecha (y el gesto atrás se siente natural). */
  @keyframes entraVista{ from{opacity:0; transform:translateX(18px)} to{opacity:1; transform:none} }
  #overlay.abierta #modal{animation:entraVista var(--normal) var(--curva)}
  /* La ventana de redactar sube desde abajo, como en Gmail al abrirla. */
  @keyframes subeCompose{ from{opacity:0; transform:translateY(24px)} to{opacity:1; transform:none} }
  #overlay2[style*="block"] #compose{animation:subeCompose .2s cubic-bezier(.2,.8,.3,1)}
  #overlay2{transition:max-height .2s ease}
  /* Las filas de la lista aparecen escalonadas al cargar: se nota que "llegó" correo. */
  @keyframes entraFila{ from{opacity:0; transform:translateY(-4px)} to{opacity:1; transform:none} }
  .hlist.animar .hrow{animation:entraFila .22s ease backwards}
  .mini-abre{animation:subeCompose .16s ease}
  /* Respeto por quien pide menos movimiento en su teléfono (accesibilidad). */
  /* Switcher de buzones (modo agencia) */
  #menuBuzones{display:none;position:fixed;top:56px;right:12px;z-index:80;background:#fff;
    border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.16);
    min-width:250px;max-width:min(320px,calc(100vw - 24px));padding:6px}
  #menuBuzones .bz-cta,#menuBuzones .bz-dom{display:flex;align-items:center;gap:8px;width:100%;
    min-height:44px;padding:6px 12px;border:0;background:none;cursor:pointer;text-decoration:none;
    color:inherit;font-size:13.5px;text-align:left;border-radius:9px;box-sizing:border-box}
  #menuBuzones .bz-cta:hover,#menuBuzones .bz-dom:hover{background:var(--brand-soft)}
  #menuBuzones .bz-cta.on{background:var(--brand-soft);font-weight:700}
  #menuBuzones .bz-dom{font-weight:700;font-size:14.5px}
  #menuBuzones .bz-dom span{margin-left:auto;color:var(--brand)}
  #menuBuzones .bz-sep{border-top:1px solid var(--line);margin:6px 4px}
  #menuBuzones .buzon-add{width:100%;border:0;background:none;color:var(--brand);padding:12px;
    cursor:pointer;font-weight:600;min-height:44px}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;
      transition-duration:.01ms !important;scroll-behavior:auto !important}
  }

  /* ===== Fase 10: lista por CONVERSACIONES (filas densas estilo Gmail) ===== */
  .hlist{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  /* Fila de 40px de alto, como la de Gmail (medido en su interfaz real). */
  .hrow{display:flex;align-items:center;gap:8px;padding:0 12px;height:40px;
        border-bottom:1px solid var(--line);cursor:pointer;position:relative;min-width:0}
  .hrow:last-child{border-bottom:0}
  .hrow:hover{background:#f7fafa}
  .hrow.leida{background:#fafcfc}
  .hrow.leida:hover{background:#f2f6f6}
  .hdot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--brand)}
  .hrow.leida .hdot{background:transparent}
  /* En la lista ancha, remitente, asunto y estados van en la misma línea:
     el envoltorio desaparece con display:contents y no estorba. */
  .hfila2{display:contents}
  .hestados{display:contents}
  /* Columna de participantes de 200px fija, como Gmail: los asuntos quedan alineados. */
  .hquien{flex:0 0 200px;font-size:14px;color:var(--ink,#1E2A2A);
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* Entre 820 y 900 la lista sigue en una línea pero con menos espacio para el nombre.
     Bajo 820 manda el bloque de fila compacta (dos líneas). */
  @media (max-width:900px){ .hquien{flex:0 0 150px} }
  .hrow.noleida .hquien,.hrow.noleida .hasunto{font-weight:700}
  .hn{color:var(--gray);font-size:11.5px;font-weight:400}
  .hasunto{flex:1 1 auto;min-width:0;font-size:14px;color:var(--dark);
           white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hasunto .hsnip{color:var(--gray);font-weight:400}
  .hsnip-l{display:none}   /* tercera línea: solo en teléfono */
  /* Nombres de los adjuntos en la propia fila, como hace Gmail. */
  .hadj{flex:none;display:flex;gap:4px;max-width:230px;overflow:hidden}
  .hadj span{font-size:11px;background:var(--surface2,#eef2f2);border:1px solid var(--line);
        border-radius:6px;padding:1px 7px;color:var(--gray);white-space:nowrap;
        overflow:hidden;text-overflow:ellipsis;max-width:110px}
  @media (max-width:820px){ .hadj{display:none} }
  .hclip{flex:none;font-size:12px;color:var(--gray)}
  .hchip{flex:none;font-size:10px;font-weight:800;border-radius:8px;padding:1.5px 7px;white-space:nowrap}
  .hchip-rev{background:#fde0e0;color:#9c3a25}
  .hchip-bor{background:#efe9fb;color:#5b3fbf}
  .hchip-aju{background:#fff6ed;color:#8a591b}
  .hchip-ok{background:var(--brand-soft);color:color-mix(in srgb, var(--brand) 70%, #000)}
  .hfecha{flex:none;font-size:12px;color:var(--ink,#1E2A2A);white-space:nowrap;min-width:48px;text-align:right}
  .pag{border:0;background:none;color:var(--gray);cursor:pointer;font-size:15px;padding:2px 8px;
       border-radius:6px;line-height:1;min-width:44px;min-height:44px}
  .pag:hover:not([disabled]){background:#e7edec;color:var(--dark)}
  .pag[disabled]{opacity:.3;cursor:default}
  .hacts{display:none;position:absolute;right:8px;top:50%;transform:translateY(-50%);gap:4px;
         background:#fff;border:1px solid var(--line);border-radius:9px;padding:3px 5px;
         box-shadow:0 3px 10px rgba(0,0,0,.08)}
  /* Al pasar el cursor, las acciones ocupan el lugar de la fecha y los chips (no los tapan). */
  @media (hover:hover){
    .hrow:hover .hacts{display:flex}
    .hrow:hover .hfecha,.hrow:hover .hchip,.hrow:hover .hclip{visibility:hidden}
  }
  .hacts button{border:0;background:none;font-size:14px;cursor:pointer;padding:3px 6px;border-radius:6px}
  /* Táctil: sin hover, las acciones aparecen en la fila con foco (cursor j/k) y en la
     que estás leyendo. Lo demás va por swipe, ✓ selección o dentro del hilo. */
  @media (hover:none){
    .hrow.activo .hacts,.hrow.leyendo .hacts{display:flex;background:var(--bg);box-shadow:-8px 0 8px var(--bg)}
    .hacts button{padding:10px 9px}
  }
  .hacts button:hover{background:var(--brand-soft)}

  /* ===== Fase 10: vista de hilo (mensajes colapsados + citas ocultas) ===== */
  /* El hilo NO tiene scroll propio: scrollea la página, como Gmail. */
  .mbody.hilo{white-space:normal;padding:0}
  /* CERRADO: fila plana y compacta, casi parte del fondo.
     ABIERTO: tarjeta elevada, con borde y sombra. Se ve de inmediato cuál estás leyendo. */
  .hm{background:var(--superficie);border:1px solid var(--linea-suave);border-radius:10px;
      transition:box-shadow var(--normal) var(--curva), border-color var(--normal) var(--curva),
                 margin var(--normal) var(--curva)}
  .hm.abierto{border-color:var(--line);box-shadow:0 2px 10px rgba(15,42,42,.09);margin:6px 0}
  .hm-head{display:flex;align-items:center;gap:8px;padding:9px 14px;cursor:pointer;min-width:0;
           border-radius:10px}
  .hm.abierto .hm-head{padding:12px 16px 6px;border-bottom:1px solid var(--linea-suave);
           border-radius:10px 10px 0 0}
  /* Flecha que gira: dice si el mensaje está abierto o cerrado sin leer nada. */
  .hm-chev{flex:none;color:var(--gray);font-size:11px;width:14px;text-align:center;
           transition:transform var(--normal) var(--curva)}
  .hm.abierto .hm-chev{transform:rotate(90deg);color:var(--brand)}
  .hm-quien{flex:none;font-size:13px;font-weight:700;color:var(--dark);max-width:38%;
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hm-quien.nos{color:var(--brand)}
  .hm-mail{flex:0 1 auto;font-size:11.5px;color:var(--gray);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hm-snip{flex:1 1 auto;min-width:0;font-size:12.5px;color:var(--gray);
           white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hm-fecha{flex:none;font-size:11px;color:var(--gray);white-space:nowrap}
  .hm-mas{flex:none;background:none;border:0;color:var(--gray);cursor:pointer;font-size:15px;
          line-height:1;padding:4px 6px;border-radius:6px;opacity:0}
  .hm:hover .hm-mas,.hm.abierto .hm-mas{opacity:1}
  .hm-mas:hover{background:var(--surface2,#e7edec)}
  @media (hover:none){ .hm-mas{opacity:1} }
  /* Teléfono: la cabecera del mensaje se apila en dos líneas (quién + fecha / extracto).
     Antes quien/mail/extracto/fecha competían con 4 elipsis en ~340px. */
  @media (max-width:820px){
    .hm-head{flex-wrap:wrap;row-gap:2px}
    .hm-quien{max-width:calc(100% - 120px)}
    .hm-mail{display:none}
    .hm-snip{flex-basis:100%;order:9;padding-left:22px}
    .hm.abierto .hm-snip{display:none}
  }
  /* El mostrar/ocultar y su animación están en el bloque de movimiento, más abajo. */
  .hm-body{font-size:13.5px;line-height:1.6}
  .hm-txt{white-space:pre-wrap;word-break:break-word}
  .hm-cita{display:none;white-space:pre-wrap;word-break:break-word;color:var(--gray);
           border-left:2px solid var(--line);padding-left:10px;margin-top:8px}
  .hm.concita .hm-cita.abierta{display:block}
  .qbtn{display:inline-block;margin-top:8px;background:#f2f5f5;border:1px solid var(--line);
        border-radius:10px;padding:0 10px;color:var(--gray);font-weight:800;letter-spacing:.12em;
        cursor:pointer;font-size:13px;line-height:1.5}
  .qbtn:hover{background:#e7edec}
  .hm-body iframe{width:100%;border:0;background:#fff;border-radius:6px;display:block}
  .hm-adj{font-size:12.5px;color:var(--brand);margin-top:8px}

  /* ===== Fase 13: adjuntos del cliente + estrella ===== */
  /* Zona de "suelta el archivo aquí": aparece solo mientras arrastras algo. */
  .soltando{position:relative}
  .soltando::after{content:"📎  Suelta el archivo para adjuntarlo";position:absolute;inset:6px;
        border:2px dashed var(--brand);border-radius:12px;background:rgba(var(--brand-rgb),.07);
        display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;
        color:var(--brand);pointer-events:none;z-index:2}
  .adjs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .adj{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;
       padding:7px 11px;background:#fbfdfd;font-size:12.5px;max-width:280px;text-decoration:none;color:var(--dark)}
  .adj:hover{background:var(--brand-soft);border-color:var(--brand)}
  .adj .ic{font-size:16px;flex:none}
  .adj .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
  .adj .t{color:var(--gray);font-size:11px}
  .adj.grande{background:#fff8ed;border-color:#f1d3b5;cursor:default}
  .adj.grande:hover{background:#fff8ed;border-color:#f1d3b5}
  /* ===== Fase 15: avatares (el círculo con la inicial, marca de Gmail) ===== */
  .av{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;
      justify-content:center;color:#fff;font-weight:700;font-size:13px;text-transform:uppercase;
      user-select:none}
  .hrow .av{width:24px;height:24px;font-size:11.5px}
  /* Tocar el avatar selecciona la conversación (gesto de Gmail): el ✓ reemplaza la inicial. */
  .avsel{flex:none;display:flex;cursor:pointer}
  .hrow.sel .avsel .av{background:var(--brand);color:#fff;font-size:0}
  .hrow.sel .avsel .av::after{content:"✓";font-size:18px}

  /* ===== Fila compacta de dos líneas =====
     Se usa en TODO ancho estrecho: el teléfono y el panel de lectura de escritorio.
     En una línea, el asunto queda en 90px y la fecha se sale de la pantalla. */
  @media (max-width:820px){
    /* Ningún campo bajo 16px: si no, iOS hace zoom al enfocarlo y descuadra la pantalla. */
    input,textarea,select,[contenteditable="true"]{font-size:16px}
    /* FAB extendido: se contrae a solo icono al bajar, como Gmail. */
    .fab{display:flex;align-items:center;justify-content:center;gap:12px;position:fixed;
         right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));height:56px;min-width:56px;
         padding:0 20px;border:0;border-radius:var(--r-l);
         background:color-mix(in srgb, var(--brand) 18%, #fff);
         color:color-mix(in srgb, var(--brand) 75%, #000);
         font-size:14px;line-height:20px;font-weight:500;letter-spacing:.1px;
         box-shadow:var(--el3);z-index:var(--z-barra);
         transition:min-width var(--normal) var(--curva),padding var(--normal) var(--curva)}
    .fab.chico{padding:0;min-width:56px}
    /* Barra de la conversación: solo iconos, como Gmail (con texto no caben ni cuatro). */
    .mbar-b{min-width:44px;justify-content:center;padding:0 10px;gap:0}
    .mb-tx{display:none}
    /* Conversación: mensajes planos separados por una línea, como Gmail (nada de tarjetas
       flotando dentro de otra tarjeta). */
    .hm{border:0;border-radius:0;background:var(--superficie)}
    .hm.abierto{box-shadow:none;margin:0;border-top:1px solid var(--line)}
    .mbody{margin:0}
    .hm-chev{display:none}
    .resp{border:0;border-top:1px solid var(--line);border-radius:0;box-shadow:none;
          margin:0;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px))}
    /* Compositor a pantalla completa: el editor crece, la barra vive abajo con área segura. */
    #editor{max-height:none;flex:1;min-height:120px}
    #compose .cacciones{padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
    #compose .chead{background:var(--superficie);color:var(--on-sup);border-bottom:1px solid var(--line)}
    #compose .cclose{background:var(--sup-c);color:var(--on-sup)}
    /* La cabecera se va al bajar: en una pantalla chica, 72px de chrome son una fila menos. */
    header.oculta{transform:translateY(-100%)}
    .fab.chico .fab-lbl{display:none}
    body.leyendo .fab{display:none}
    /* Snackbar M3: ancho completo abajo, por encima del FAB y del área segura. */
    .toast{left:12px;right:12px;max-width:none;transform:translateY(12px);
           bottom:calc(84px + env(safe-area-inset-bottom,0px))}
    .toast.show{transform:none}
    /* ===== Lista a sangre: sin tarjeta contenedora; cada correo es su propio bloque
       redondeado sobre el fondo gris, como Gmail desde sep-2025. ===== */
    .hlist{background:transparent;border:0;border-radius:0;overflow:visible}
    .hrow{height:auto;min-height:88px;padding:12px 16px;align-items:flex-start;gap:16px;
          overflow:hidden;background:var(--sup);border-bottom:0;border-radius:var(--r-l);
          margin:0 8px 2px}
    .hrow.leida,.hrow.noleida{background:var(--sup)}
    .hlist > .hrow:first-child{border-radius:var(--r-xl) var(--r-xl) var(--r-l) var(--r-l)}
    .hlist > .hrow:last-child{border-radius:var(--r-l) var(--r-l) var(--r-xl) var(--r-xl)}
    /* Fila de tres líneas (remitente / asunto / extracto) con avatar de 40, como Gmail. */
    .hrow .av{width:40px;height:40px;font-size:16px;font-weight:500}
    .hcheck,.hdot{display:none}          /* seleccionar es tocar el avatar (ver hiloHtml) */
    .hfila2{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;flex:1;min-width:0}
    .hquien{grid-column:1;grid-row:1;flex:none;max-width:100%;font-size:16px;line-height:24px;
            letter-spacing:.5px;font-weight:400;color:var(--on-sup);
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .hrow.noleida .hquien{font-weight:500}
    .hfecha{grid-column:2;grid-row:1;align-self:start;margin-top:4px;font-size:11px;line-height:16px;
            letter-spacing:.5px;font-weight:500;color:var(--on-sup-var);min-width:0;
            font-variant-numeric:tabular-nums}
    .hasunto{grid-column:1/-1;grid-row:2;flex:none;display:block;white-space:nowrap;
             -webkit-line-clamp:none;font-size:14px;line-height:20px;letter-spacing:.2px;
             color:var(--on-sup);overflow:hidden;text-overflow:ellipsis}
    .hrow.noleida .hasunto{font-weight:500}
    .hasunto .hsnip{display:none}
    .hsnip-l{display:block;grid-column:1/-1;grid-row:3;font-size:14px;line-height:20px;
             color:var(--on-sup-var);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    /* Un solo chip y discreto: en la bandeja de Gmail la fila no lleva medallas. */
    .hchip{font-size:11px;line-height:16px;font-weight:500;border-radius:var(--r-s);padding:2px 8px}
    .hestados > *:nth-child(n+2){display:none}
    .hchip-ok{display:none}
    .hestados{grid-column:1/-1;grid-row:4;display:flex;gap:4px;margin-top:2px}
    .hestados:empty{display:none}
    .hadj{display:none}
    .hstar{order:9;align-self:center;padding:14px;margin:-14px -12px -14px 0;font-size:18px}
    .hclip{align-self:center}
    /* Blancos táctiles pendientes de la auditoría: nada útil bajo ~44px. */
    .tab{padding:11px 15px}
    .pag{padding:10px 12px;min-width:44px;min-height:44px}
    .vback{padding:10px 12px}
    #compose .cclose{width:38px;height:38px}
    .selbar{position:sticky;top:0;z-index:var(--z-barra);background:var(--panel);
            padding:8px 12px;border-bottom:1px solid var(--line);margin:0 0 8px}
    .selbar button{min-height:44px;padding:0 14px}
    .fchip{padding:10px 12px}
    .chip-add{padding:9px 12px}
    .blq button{padding:10px 12px}
    .img-aviso button{padding:9px 10px}
    .bavanz,.blimpiar{min-width:44px;min-height:44px}
    header button{min-height:44px;min-width:44px}
    .btn,.qa-b,.mbar-b,.side-b{min-height:44px}
    .ctoolbar button{min-width:44px;height:44px}
    .hm-head{min-height:44px}
    .hm-mas{padding:11px}
    header button{min-height:44px;min-width:44px}
  }
  .hm-av{width:34px;height:34px;font-size:14px;margin-right:2px}
  /* En el teléfono el avatar SÍ se muestra (con la fila de dos líneas hay espacio y
     ayuda a reconocer al cliente de una mirada, como la app de Gmail). */

  /* ===== Fase 15: menú lateral de carpetas (sidebar en escritorio, cajón en el teléfono) ===== */
  /* Medidas tomadas del Gmail real: menú 240px, botón Redactar 140×56 con radio 16.
     La aplicación ocupa TODO el ancho disponible: nada de una columna angosta al centro. */
  .layout{display:flex;align-items:flex-start;width:100%;margin:0}
  .side{flex:0 0 240px;padding:12px 8px 40px;position:sticky;top:var(--alto-cabecera);
        align-self:flex-start;background:var(--panel);
        min-height:calc(100vh - var(--alto-cabecera))}

  /* ===== En escritorio la página NO scrollea: scrollea cada columna por separado.
     Es como funciona un cliente de correo de verdad, y evita que las barras pegajosas
     se metan debajo de la cabecera al hacer scroll. ===== */
  @media (min-width:1180px){
    html,body{height:100%;overflow:hidden}
    .layout{height:calc(100vh - var(--alto-cabecera));align-items:stretch}
    .side{position:static;min-height:0;overflow-y:auto;height:100%}
    .principal{overflow-y:auto;height:100%}
  }
  /* El FAB es solo de teléfono; en escritorio manda el botón Redactar del menú lateral.
     (La regla va por min-width para no depender del orden con el media de la lista.) */
  @media (min-width:821px){ .fab{display:none} }
  /* Fondo que queda "detrás" de la fila mientras se desliza (leave-behind de Gmail). */
  #swipeBg{position:fixed;display:none;align-items:center;padding:0 24px;color:#fff;
           font-size:14px;font-weight:500;letter-spacing:.1px;border-radius:var(--r-l);
           z-index:0;pointer-events:none}
  /* Campos que antes llevaban el tamaño en el atributo style (pisaba el mínimo de 16px de iOS). */
  .cc-inline{flex:1;border:1px solid var(--line);border-radius:var(--r-s);padding:7px 10px;font-size:13.5px}
  .de-sel{flex:1;border:0;outline:0;font-size:14px;background:none;color:inherit}
  .btn-redactar{display:flex;align-items:center;gap:10px;width:140px;height:56px;border:0;
        border-radius:16px;background:var(--brand);color:#fff;font-size:14.5px;font-weight:600;
        cursor:pointer;padding:0 18px;margin:4px 0 14px 8px;box-shadow:0 1px 3px rgba(0,0,0,.16)}
  .btn-redactar:hover{box-shadow:0 2px 8px rgba(0,0,0,.24)}
  .btn-redactar .ic{font-size:17px}
  .side-b{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;min-height:44px;
          background:none;border-radius:0 999px 999px 0;padding:8px 14px;font-size:13.5px;
          color:var(--dark);cursor:pointer;margin-bottom:2px}
  .side-b:hover{background:#e9efee}
  .side-b.activo{background:var(--brand-soft);color:var(--brand-ink,#0A5252);font-weight:700}
  .side-b .ic{flex:none;width:18px;text-align:center;font-size:15px}
  /* Iconos Material: heredan el color del texto, así que sirven en cualquier tema. */
  .ic24{width:24px;height:24px;fill:currentColor;flex:none;vertical-align:middle}
  .side-b .ic24{margin-right:0}
  .side-b .lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .side-b .cnt{font-size:11.5px;color:var(--gray);font-weight:600}
  .side-b.activo .cnt{color:var(--brand)}
  .principal{flex:1;min-width:0;padding:12px 14px 40px}
  .burger{display:none;background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;
          padding:7px 11px;font-size:15px;cursor:pointer}
  .velo{display:block;opacity:0;pointer-events:none;position:fixed;inset:0;
        background:rgba(20,30,30,.4);z-index:calc(var(--z-cajon) - 1);
        transition:opacity var(--normal) var(--curva)}
  @media (max-width:820px){
    .burger{display:block}
    .side{position:fixed;left:0;top:0;bottom:0;width:min(320px, 86vw);background:var(--superficie);
          z-index:var(--z-cajon);overscroll-behavior:contain;
          transform:translateX(-102%);transition:transform .22s ease;overflow-y:auto;
          box-shadow:2px 0 16px rgba(0,0,0,.14);
          padding-top:calc(8px + env(safe-area-inset-top,0px));
          padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
    /* Items en píldora de 56, como el NavigationDrawer de Material 3. */
    .side-b{min-height:56px;margin:0 12px 2px;padding:0 16px;border-radius:var(--r-xl);
            font-size:14px;line-height:20px;font-weight:500;letter-spacing:.1px}
    .side-b.activo{background:color-mix(in srgb, var(--brand) 16%, #fff);color:var(--on-sup)}
    .side.abierto{transform:none}
    .velo.on{opacity:1;pointer-events:auto}
    .principal{padding:0 0 calc(96px + env(safe-area-inset-bottom,0px))}
  }
  .side-tit{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gray);
            font-weight:700;padding:10px 14px 6px}

  .hstar{flex:none;background:none;border:0;cursor:pointer;font-size:14px;line-height:1;
         padding:15px;margin:-15px -13px;box-sizing:content-box;
         color:#c8d2d1;filter:none;opacity:1}
  .hstar.on{color:#F9AB00}
  .hstar:hover{opacity:1}

  /* ===== Fase 11: buscador + chips ===== */
  /* Buscador dentro de la cabecera, ancho completo (como Gmail). */
  .buscador{flex:1;max-width:720px;margin:0 12px;display:flex;gap:4px;align-items:center;
        background:rgba(255,255,255,.16);border-radius:10px;padding:2px 6px 2px 12px;
        transition:background var(--rapido) var(--curva)}
  .buscador:focus-within{background:#fff}
  .buscador input{flex:1;padding:8px 4px;border:0;font-size:14px;background:transparent;
        outline:none;color:#fff;min-width:0}
  .buscador input::placeholder{color:rgba(255,255,255,.9)}
  .buscador:focus-within input{color:var(--dark)}
  .buscador:focus-within input::placeholder{color:var(--gray)}
  .buscador .blimpiar{border:0;background:none;font-size:15px;cursor:pointer;
        color:rgba(255,255,255,.8);display:none;padding:4px 6px}
  .buscador:focus-within .blimpiar,.buscador:focus-within .bavanz{color:var(--gray)}
  .solo-angosto{display:none}
  /* Avatar de la cuenta en la cabecera: círculo de 30 (token de Gmail) con blanco táctil de 44. */
  .av-cuenta{width:44px;height:44px;min-width:44px;padding:0;border:0;background:none;
             border-radius:50%;align-items:center;justify-content:center}
  .av-cuenta::before{content:attr(data-ini);width:30px;height:30px;border-radius:50%;
             background:var(--brand);color:#fff;font-size:13px;font-weight:600;
             display:flex;align-items:center;justify-content:center}
  /* TELÉFONO: Gmail no tiene barra de color arriba — el chrome superior ES la píldora de
     búsqueda (M3 SearchBar: alto 56, radio completo, fondo surface-container-high). */
  @media (max-width:820px){
    header h1{display:none}
    header{background:var(--bg);color:var(--on-sup);box-shadow:none;
           padding:calc(8px + env(safe-area-inset-top,0px)) 8px 8px;gap:4px}
    .burger{display:flex;align-items:center;justify-content:center;background:none;
            color:var(--on-sup);width:48px;height:48px;min-width:48px;padding:0;
            border-radius:50%;font-size:20px}
    .buscador{flex:1;height:56px;margin:0;padding:0 6px 0 16px;border-radius:var(--r-xl);
              background:var(--sup-high);gap:8px;min-width:0}
    .buscador:focus-within{background:var(--sup-high)}
    .buscador input{color:var(--on-sup);font-size:16px;line-height:24px;letter-spacing:.5px;padding:0}
    .buscador input::placeholder{color:var(--on-sup-var)}
    .buscador:focus-within input{color:var(--on-sup)}
    .buscador .blimpiar,.buscador .bavanz{color:var(--on-sup-var)}
    .solo-ancho{display:none}          /* "Salir" y los iconos extra pasan al menú */
    .solo-angosto{display:flex}
  }
  .bavanz{border:0;background:none;font-size:15px;cursor:pointer;color:rgba(255,255,255,.9);
        padding:4px 7px;border-radius:8px;min-width:44px;min-height:44px}
  .bavanz:hover{background:rgba(255,255,255,.18)}
  .buscador:focus-within .bavanz:hover{background:#e7edec}
  /* Buscador avanzado: los campos del panel de Gmail */
  .avanzada{display:none;max-width:720px;margin:8px auto 0;background:#fff;border:1px solid var(--line);
        border-radius:12px;padding:12px 16px;box-shadow:0 4px 16px rgba(0,0,0,.07)}
  .avanzada.on{display:block}
  .af{display:flex;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap}
  .af label{font-size:12.5px;color:var(--gray);min-width:72px}
  .af input{flex:1;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13.5px;
        font-family:inherit;min-width:0}
  .af input[type=date]{flex:0 1 160px}
  .af-acc{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
  .fchips{max-width:720px;margin:0 auto;padding:8px 16px 0;display:none;gap:6px;flex-wrap:wrap}
  .fchips.on{display:flex}
  .fchip{font-size:12px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;
        cursor:pointer;color:var(--gray)}
  .fchip.on{background:var(--brand);border-color:var(--brand);color:#fff}

  /* ===== Fase 11: aviso de imágenes bloqueadas ===== */
  .img-aviso{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--gray);
        background:#f6f8f8;border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin-bottom:8px}
  .img-aviso button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:3px 9px;
        font-size:12px;cursor:pointer;color:var(--brand)}
  .img-aviso.espia{background:var(--brand-soft);border-color:#cfe3df;color:var(--brand)}

  /* ===== Fase 11: redactar (compose) ===== */
  /* ===== Redactar: ventana en la esquina, como Gmail — NO bloquea la bandeja.
     Puedes seguir leyendo y buscando mientras escribes; se minimiza. ===== */
  #overlay2{position:fixed;right:18px;bottom:0;display:none;z-index:var(--z-compose);
        width:min(540px, calc(100vw - 36px));max-height:86vh}
  #compose{background:#fff;border-radius:12px 12px 0 0;width:100%;overflow:hidden;
        box-shadow:0 -2px 24px rgba(0,0,0,.22);display:flex;flex-direction:column;max-height:86vh}
  #compose .chead{background:var(--dark);color:#fff;padding:10px 14px;font-weight:600;font-size:14px;
        display:flex;align-items:center;gap:4px;cursor:pointer}
  #compose .chead span{flex:1}
  #compose .cclose{background:rgba(255,255,255,.16);border:0;color:#fff;width:26px;height:26px;
        border-radius:7px;cursor:pointer;font-size:15px;line-height:1}
  #compose .cuerpoCompose{display:flex;flex-direction:column;flex:1;min-height:0;overflow-y:auto}
  #compose .cacciones{flex:none}
  .btn-descartar{background:none;color:var(--gray);border:1px solid var(--line);margin-left:14px}
  #overlay2.min #compose .cuerpoCompose{display:none}
  #overlay2.min{max-height:none}
  /* En el teléfono ocupa la pantalla completa, como la app de Gmail.
     820 (no 640): el MISMO umbral del layout de teléfono — antes había una zona muerta
     641-820 con burger + ventana flotante mezclados. 100dvh y no 100vh: la barra del
     navegador ya no tapa Enviar; el teclado lo maneja visualViewport (abajo en el JS). */
  @media (max-width:820px){
    #overlay2{right:0;left:0;top:0;width:100%;max-height:none}
    #compose{border-radius:0;max-height:none;height:100vh;height:100dvh;
      padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
    #overlay2.min{top:auto;bottom:0}
    #overlay2.min #compose{height:auto;padding-top:0}
  }
  #compose .campo{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:9px 16px}
  #compose .campo label{font-size:12.5px;color:var(--gray);min-width:52px}
  #compose .campo input{flex:1;border:0;outline:none;font-size:14px;font-family:inherit;background:none}
  .ctoolbar{display:flex;gap:4px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .ctoolbar button{border:1px solid var(--line);background:#f7fafa;border-radius:7px;min-width:32px;height:30px;
        cursor:pointer;font-size:13px}
  .ctoolbar button:hover{background:var(--brand-soft)}
  #editor{min-height:220px;max-height:46vh;overflow:auto;padding:14px 16px;font-size:14px;line-height:1.6;
        outline:none;word-break:break-word}
  .firma-editor{border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-height:90px;
        font-size:13.5px;line-height:1.6;outline:none;background:#fff}
  .firma-editor:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px rgba(var(--brand-rgb),.1)}
  #editor blockquote{border-left:2px solid var(--line);margin:6px 0;padding-left:10px;color:var(--gray)}
  .cacciones{display:flex;gap:8px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
  .cestado{font-size:12px;color:var(--gray);flex:1;text-align:right}

  /* ===== Fase 12: mini-modal propio (adiós prompt/confirm que congelan la PWA) ===== */
  #overlay3{position:fixed;inset:0;background:rgba(20,30,30,.5);display:none;align-items:center;
        justify-content:center;padding:20px;z-index:var(--z-modal)}
  #mini{background:#fff;border-radius:13px;max-width:400px;width:100%;padding:18px}
  #mini h2{margin:0 0 8px;font-size:15px}
  #mini p{margin:0 0 12px;font-size:13px;color:var(--gray)}
  #mini input,#mini textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;
        font-size:14px;font-family:inherit;margin-bottom:12px}
  #mini .mbtns{display:flex;gap:8px;justify-content:flex-end}

  /* ===== Fase 12: toast con Deshacer + selección múltiple + swipe + atajos ===== */
  .toast.undo{pointer-events:auto;display:flex;gap:12px;align-items:center}
  .toast .tundo{background:none;border:0;color:#7fd4c8;font-weight:700;cursor:pointer;
        min-height:44px;padding:12px 10px;margin:-12px -4px -12px 0;border-radius:var(--r-s);
        font-size:14px;letter-spacing:.1px}
  /* En Gmail el cuadrado de selección está SIEMPRE visible, no aparece al pasar el mouse. */
  .hcheck{flex:none;width:16px;height:16px;border:1.5px solid #b9c6c4;border-radius:3px;display:flex;
        align-items:center;justify-content:center;font-size:11px;color:transparent;cursor:pointer;
        transition:background .12s ease, border-color .12s ease, transform .12s ease}
  .hcheck:hover{border-color:var(--brand);transform:scale(1.12)}
  .hrow.sel{background:var(--brand-soft)}
  .hrow.sel .hcheck{background:var(--brand);border-color:var(--brand);color:#fff}
  .hrow.activo,.hrow:focus-visible{outline:2px solid var(--brand);outline-offset:-2px;border-radius:4px}
  /* La conversación que estás leyendo queda marcada en la lista (panel al costado). */
  .hrow.leyendo{background:var(--brand-soft);box-shadow:inset 3px 0 0 var(--brand)}
  /* El foco de teclado tiene que verse en TODO lo interactivo (accesibilidad básica). */
  button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,
  [tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .selbar{overflow-x:auto;-webkit-overflow-scrolling:touch;display:none;max-width:820px;margin:0 auto;padding:8px 16px 0;gap:8px;align-items:center}
  .selbar.on{display:flex}
  .selbar .scnt{font-size:13px;color:var(--gray);flex:1}
  .selbar button{flex:0 0 auto;white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:var(--r-s);padding:6px 12px;
        font-size:13px;cursor:pointer}
  .hrow{touch-action:pan-y}
  .hrow.swiping{position:relative;z-index:1;background:var(--sup);transition:none}
  .hrow.swipe-vuelta{transition:transform .18s ease}
  /* ===== Ajustes finales de la fila en teléfono =====
     Van al FINAL a propósito: las reglas base de .hcheck/.hclip aparecen más abajo en el
     archivo y por orden de cascada ganarían a las del bloque de la lista. */
  @media (max-width:820px){
    .hcheck,.hdot{display:none}        /* seleccionar es tocar el avatar, como Gmail */
    .hclip{display:none}               /* el 📎 robaba ancho al asunto en cada fila */
    .hrow{padding-right:8px}           /* el texto llega más lejos antes de cortarse */
    .hstar{margin-right:-8px}
  }

  @media (max-width:820px){
    /* Compositor con cabecera clara, como el de Gmail (no una barra oscura de escritorio). */
    #compose .chead{background:var(--superficie);color:var(--on-sup);border-bottom:1px solid var(--line);
                    padding:8px 10px 8px 16px;gap:6px}
    #compose .cclose{background:none;color:var(--on-sup-var);width:44px;height:44px;
                     display:flex;align-items:center;justify-content:center;font-size:20px}
    #compose #cTitulo{font-size:16px;font-weight:500}
    /* Descartar vive arriba: abajo empujaba a Enviar fuera de la pantalla. */
    .cacciones .btn-descartar{display:none}
    .cacciones{gap:8px}
    .cacciones .btn{padding:0 14px;min-height:44px}
  }

  /* Feedback al tacto: en el teléfono no hay :hover, así que al tocar TIENE que verse algo. */
  @media (hover:none){
    .hrow:active{background:var(--sup-c)}
    button:active,.side-b:active,.mbar-b:active,.btn:active,.qa-b:active,.pag:active,.fab:active{filter:brightness(.94)}
  }
</style>
</head>

<div id="login">
  <h2>🔒 Bandeja</h2>
  <p>{{BRAND_NAME}} — ingresa la contraseña del panel.</p>
  <input id="pass" type="password" placeholder="Contraseña" autocomplete="current-password" />
  <button onclick="entrar()">Entrar</button>
  <div class="err" id="loginErr"></div>
</div>

<div id="app" style="display:none">
  <header>
    <button class="burger" onclick="toggleMenu()" title="Carpetas" aria-label="Abrir carpetas">☰</button>
    <h1>📥&nbsp;Bandeja de correos</h1>
    <!-- El buscador vive en la cabecera y ocupa el ancho, como en Gmail -->
    <div class="buscador">

<script>
const KEY = "panel_pass_agente";
// Subcuentas (fase 16): el Worker inyecta la lista al servir el HTML.
const CUENTAS_RAW = "{{CUENTAS_JSON}}";
const CUENTAS = Array.isArray(CUENTAS_RAW) ? CUENTAS_RAW : [];   // [{email, etiqueta}]
const NOSOTROS = (CUENTAS[0] && CUENTAS[0].email) || "{{CONTACT_EMAIL}}";
const esCuentaNuestra = (dir) => !!dir && CUENTAS.some((c) => c.email === String(dir).trim().toLowerCase());
let cuentaActiva = "";
try { cuentaActiva = localStorage.getItem("cuenta_activa") || ""; } catch (e) {}
if (cuentaActiva && !esCuentaNuestra(cuentaActiva)) cuentaActiva = "";
function ctaQuery(pre){ return cuentaActiva ? `${pre||"&"}cuenta=${encodeURIComponent(cuentaActiva)}` : ""; }
// Switcher de buzones (modo agencia): SOLO si el Worker lleva MODO_AGENCIA="1".
const MODO_AGENCIA = "{{MODO_AGENCIA}}" === "1";
let pass = localStorage.getItem(KEY) || "";
let actual = null;                 // correo accionable abierto (para responder/ajustar)
let actualTid = null;              // hilo abierto (fase 10); null = mensaje suelto (spam/papelera)
let filtro = "recibidos";
let page = 1, pageSize = 25, hasMore = false, cargando = false;
let items = [], lastTotal = 0;     // hilos (vistas de conversación) o correos (spam/papelera)
let bloqueadosItems = [];

// Vistas por CONVERSACIÓN (fase 10). Spam/Papelera/Borradores/Bloqueados siguen por mensaje.
function esVistaHilos(f){
  // 'todos' es la vista que usan las etiquetas (carpetas propias): también va por conversación.
  return f==="recibidos"||f==="enviados"||f==="archivados"||f==="destacados"
      || f==="pospuestos"||f==="todos";
}

// Estado de búsqueda (fase 11) y de selección múltiple (fase 12).
let busca = "", chips = {adjunto:false, recibidos:false, mes:false}, buscaTimer = null;
let seleccion = new Set();
let cursor = -1;                   // fila activa para atajos j/k
let imagenesOk = [];               // remitentes con imágenes aprobadas en el hilo abierto

function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));}
function fmtFecha(iso){
  if(!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return esc(iso); // recibido_en puede venir del header Date (posible XSS)
  const now = new Date();
  if (d.toDateString() === now.toDateString())
    return d.toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"});
  if (d.getFullYear() === now.getFullYear())
    return d.toLocaleDateString("es-CL",{day:"numeric",month:"short"});
  return d.toLocaleDateString("es-CL",{day:"2-digit",month:"2-digit",year:"2-digit"});
}
function fechaFull(iso){ const d=new Date(iso); return isNaN(d)?(iso||""):d.toLocaleString("es-CL"); }
// MEJORA sobre Gmail: en una bandeja de cotizaciones lo que importa no es "cuándo llegó"
// sino CUÁNTO LLEVA ESPERANDO. Gmail cambia el formato según antigüedad y confunde;
// aquí lo reciente se muestra como tiempo de espera y lo viejo como fecha.
function fmtEspera(iso){
  if(!iso) return "";
  const d = new Date(iso);
  if(isNaN(d)) return esc(iso);
  const min = Math.floor((Date.now() - d.getTime())/60000);
  if(min < 1) return "recién";
  if(min < 60) return `hace ${min} min`;
  const h = Math.floor(min/60);
  if(h < 24) return `hace ${h} h`;
  return fmtFecha(iso);
}
// Horas que lleva esperando un mensaje entrante sin responder (para el aviso de retraso).
function horasEsperando(iso){
  const d = new Date(iso);
  return isNaN(d) ? 0 : (Date.now() - d.getTime())/3600000;
}
// Fechas que vienen de datetime() de SQLite: 'YYYY-MM-DD HH:MM:SS' en UTC.
function fmtFechaSql(s){ return s ? fmtFecha(s.replace(" ","T")+"Z") : ""; }
function fmtEsperaSql(s){ return s ? fmtEspera(s.replace(" ","T")+"Z") : ""; }
function fechaFullSql(s){ return s ? fechaFull(s.replace(" ","T")+"Z") : ""; }
// Quita los prefijos Re:/Fwd: para mostrar el asunto "limpio" de la conversación.
function quitarRe(s){ return (s||"").replace(/^(\s*(re|rv|ref|res|fwd|fw)\s*:\s*)+/i,"").trim() || "(sin asunto)"; }
// "Rita Pérez, yo (3)": nombres de pila si hay varios participantes, nombre completo si es uno.
function participantesTxt(h){
  let arr = (h.participantes||"").split("|").map(s=>s.trim()).filter(Boolean);
  const vistos = new Set(), unicos = [];
  for(const p of arr){ const k=p.toLowerCase(); if(!vistos.has(k)){ vistos.add(k); unicos.push(p); } }
  if((h.salientes||0)>0 && !vistos.has("yo")) unicos.push("yo");
  if(!unicos.length) return "(desconocido)";
  if(unicos.length===1) return unicos[0];
  // varios: primer nombre de cada uno ("yo" al final, como Gmail)
  const yo = unicos.includes("yo");
  const otros = unicos.filter(p=>p!=="yo").map(p=>p.includes("@")?p.split("@")[0]:p.split(/\s+/)[0]);
  return otros.join(", ") + (yo?", yo":"");
}
// Recorte de citas (fase 10): separa el texto nuevo del historial citado
// ("El [fecha] ... escribió:", "On ... wrote:", "-----Mensaje original-----",
//  bloque "De:/Desde:" con cabeceras, o líneas ">"). Devuelve {visible, cita}.
function partirCitas(texto){
  const lineas = (texto||"").split("\n");
  const marcaSimple = /^((el|on)\s.{4,120}(escribi[oó]|wrote)\s*:?\s*$)|(^-{2,}\s*(mensaje original|original message|mensaje reenviado|forwarded message))|(^>)/i;
  const marcaDe = /^(de|desde|from)\s*:\s*.+/i;
  const cabecera = /^(enviado|para|asunto|fecha|cc|sent|to|subject|date)\s*:\s*/i;
  let idx = -1;
  for(let i=0;i<lineas.length;i++){
    const l = lineas[i].trim();
    if(!l) continue;
    if(marcaSimple.test(l)){ idx=i; break; }
    if(marcaDe.test(l)){
      // "De:" solo cuenta como cita si viene seguido de más cabeceras (Enviado:/Para:/…)
      let cab=0;
      for(let j=i+1;j<Math.min(i+4,lineas.length);j++){ if(cabecera.test(lineas[j].trim())) cab++; }
      if(cab>=1){ idx=i; break; }
    }
  }
  if(idx<=0) return {visible:(texto||"").trimEnd(), cita:""};
  return {visible:lineas.slice(0,idx).join("\n").trimEnd(), cita:lineas.slice(idx).join("\n").trimEnd()};
}

// ============================================================
// Fase 11 — mostrar el HTML de un correo de forma segura y bonita.
// Patrón de la industria (Fastmail/Proton/Close.com): sanitizar con DOMPurify
// y AISLAR en un iframe con sandbox SIN allow-scripts + CSP script-src 'none'.
// allow-same-origin (sin allow-scripts) nos deja medir el alto desde el padre.
// ============================================================
let imgsBloqueadas = 0;        // imágenes normales no cargadas (modo cauteloso)
let rastreadoresBloqueados = 0; // píxeles espía eliminados (siempre)

// Un píxel de rastreo se delata por el tamaño (1x1 o 0) o por la pinta de la dirección.
// Ante la duda NO se elimina: una imagen real perdida molesta más que un rastreo.
const PISTAS_RASTREO = /(open|track|beacon|pixel|spacer|blank|wf\/open|\/o\.gif|utm_|mailstat|sendgrid\.net\/wf)/i;
function esRastreador(img, src){
  const w = parseInt(img.getAttribute("width")||"0",10);
  const h = parseInt(img.getAttribute("height")||"0",10);
  if((w && w<=3) || (h && h<=3)) return true;               // el clásico 1x1
  const est = (img.getAttribute("style")||"").replace(/\s/g,"");
  if(/(width|height):0(px)?[;$]/i.test(est) || /display:none/i.test(est)) return true;
  // Sin dimensiones declaradas y con una URL que huele a baliza de apertura.
  if(!w && !h && PISTAS_RASTREO.test(src)) return true;
  return false;
}
// Por defecto las imágenes SE VEN, igual que Gmail: no hay que aceptar nada. La privacidad
// la cubre el proxy del Worker (el remitente no ve tu IP ni puede ponerte cookies).
// Se puede apagar desde el menú lateral si algún día molesta.
let mostrarImagenesSiempre = localStorage.getItem("imgs_bloqueadas") !== "1";

// Reescribe imágenes remotas a un atributo inerte; el CSS url(...) se neutraliza igual.
function sanitizarCorreo(html, mostrarImgs, adjuntos){
  imgsBloqueadas = 0; rastreadoresBloqueados = 0;
  if(!window.DOMPurify) return "";  // sin la librería no mostramos HTML crudo: nunca
  // Imágenes incrustadas del propio correo (src="cid:…"): se sirven desde nuestro Worker,
  // así que no rastrean y se muestran siempre.
  const porCid = {};
  for(const a of (adjuntos||[])) if(a.cid && a.url) porCid[a.cid] = a.url;
  // <style> SÍ se permite (los correos dependen de él para verse bien) porque va dentro
  // de un iframe aislado con CSP script-src 'none'; lo que se limpia son sus url() e @import.
  const limpio = DOMPurify.sanitize(html||"", {
    USE_PROFILES:{html:true},
    FORBID_TAGS:["form","input","button","base","link","meta","iframe","object","embed"],
    FORBID_ATTR:["srcset","ping","autoplay","formaction"],
    ADD_TAGS:["style"],
    ADD_ATTR:["target"],
    RETURN_DOM_FRAGMENT:true,
  });
  const cont = document.createElement("div");
  cont.appendChild(limpio);
  for(const st of cont.querySelectorAll("style")){
    st.textContent = (st.textContent||"")
      .replace(/@import[^;]+;/gi,"")
      .replace(/url\s*\([^)]*\)/gi,"none")
      .replace(/position\s*:\s*(fixed|absolute)/gi,"position:static");
  }
  for(const img of cont.querySelectorAll("img")){
    const src = img.getAttribute("src")||"";
    if(/^data:image\//i.test(src)) continue;          // inline: no rastrea, se deja
    if(/^cid:/i.test(src)){                            // imagen incrustada del propio correo
      const url = porCid[src.slice(4).replace(/^<|>$/g,"")];
      url ? img.setAttribute("src", url) : img.removeAttribute("src");
      continue;
    }
    if(!/^https?:/i.test(src)){ img.removeAttribute("src"); continue; }
    // Los píxeles de rastreo se eliminan SIEMPRE, se muestren o no las imágenes.
    // Si se cargaran (aunque fuera por el proxy), el remitente sabría que abriste el
    // correo: es justo la fuga que Google admite en Gmail y que aquí no queremos.
    if(esRastreador(img, src)){ img.remove(); rastreadoresBloqueados++; continue; }
    if(mostrarImgs){ img.setAttribute("src", proxyImg(src)); continue; }
    img.removeAttribute("src"); img.setAttribute("data-bloqueada", src);
    img.setAttribute("alt", img.getAttribute("alt")||"imagen bloqueada"); imgsBloqueadas++;
  }
  // Los enlaces abren fuera y sin filtrar el referrer.
  for(const a of cont.querySelectorAll("a")){
    a.setAttribute("target","_blank");
    a.setAttribute("rel","noopener noreferrer nofollow");
  }
  for(const el of cont.querySelectorAll("[style]")){
    const s = el.getAttribute("style")||"";
    if(/url\s*\(/i.test(s)) el.setAttribute("style", s.replace(/url\s*\([^)]*\)/gi,"none"));
    if(/position\s*:\s*(fixed|absolute)/i.test(s)) el.setAttribute("style", s.replace(/position\s*:\s*(fixed|absolute)/gi,"position:static"));
  }
  return cont.innerHTML;
}
// URL firmada del proxy de imágenes del Worker (fase 12): oculta la IP del dueño.
let imgKey = null;
async function prepararImgKey(){
  if(imgKey || !pass || !window.crypto || !crypto.subtle) return;
  try{
    imgKey = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass),
      {name:"HMAC",hash:"SHA-256"}, false, ["sign"]);
  }catch(e){ imgKey=null; }
}
const firmaCache = new Map();
function proxyImg(u){
  const f = firmaCache.get(u);
  return f ? `/img-proxy?u=${encodeURIComponent(u)}&s=${f}` : u;
}
async function firmarImgs(html){
  await prepararImgKey();
  if(!imgKey) return;
  const urls = [...(html||"").matchAll(/<img[^>]+src=["'](https?:[^"']+)["']/gi)].map(m=>m[1]);
  for(const u of new Set(urls)){
    if(firmaCache.has(u)) continue;
    try{
      const mac = await crypto.subtle.sign("HMAC", imgKey, new TextEncoder().encode(u));
      firmaCache.set(u, [...new Uint8Array(mac)].map(b=>b.toString(16).padStart(2,"0")).join("").slice(0,32));
    }catch(e){}
  }
}

// Monta el HTML sanitizado en un iframe aislado y ajusta su alto al contenido.
function montarIframe(iframe, htmlLimpio){
  const doc = `<!doctype html><html><head><meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="script-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'">
    <style>html,body{margin:0;padding:0;background:#fff;color:#1E2A2A;
      font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      word-break:break-word;overflow-x:auto;overflow-y:hidden}
      img{max-width:100%;height:auto}img:not([src]){display:inline-block;min-width:20px;min-height:20px;
      background:#eef2f2;border:1px dashed #cdd8d7;border-radius:4px}
      table{max-width:100%}a{color:{{BRAND_COLOR}}}</style></head><body><div id="_medir">${htmlLimpio}</div></body></html>`;
  iframe.setAttribute("sandbox","allow-popups allow-popups-to-escape-sandbox allow-same-origin");
  iframe.setAttribute("referrerpolicy","no-referrer");
  iframe.srcdoc = doc;
  // OJO: NO medir body.scrollHeight — nunca baja del alto del propio iframe, así que
  // crece en bucle (iframe más alto -> scrollHeight mayor -> …). Se mide el div interno,
  // que sí refleja el alto REAL del contenido.
  const ajustar = () => {
    try{
      const d = iframe.contentDocument;
      const caja = d && d.getElementById("_medir");
      if(!caja) return;
      const h = Math.min(Math.max(Math.ceil(caja.getBoundingClientRect().height) + 8, 40), 4000);
      if(iframe.style.height !== h + "px") iframe.style.height = h + "px";
    }catch(e){}
  };
  iframe.addEventListener("load", () => {
    ajustar();
    // El contenido puede crecer al cargar imágenes: observar desde el padre.
    try{
      const d = iframe.contentDocument;
      const caja = d.getElementById("_medir");
      if(window.ResizeObserver && caja) new ResizeObserver(ajustar).observe(caja);
      d.querySelectorAll("img").forEach(i=>i.addEventListener("load",ajustar));
    }catch(e){}
    setTimeout(ajustar, 350);
  });
}

// Distingue tres cosas que antes se confundían: sin conexión, contraseña mala y error del
// servidor. Confundirlas hacía que un túnel sin señal borrara la contraseña guardada.
class ErrRed extends Error{ constructor(){ super("sin conexión"); this.red=true; } }
class ErrAuth extends Error{ constructor(){ super("contraseña incorrecta"); this.auth=true; } }
async function api(path, opts){
  const o = opts || {};
  o.headers = Object.assign({ "x-panel-pass": pass }, o.headers || {});
  let r;
  try{
    r = await fetch(path, o);
  }catch(e){ marcarSinConexion(true); throw new ErrRed(); }
  marcarSinConexion(false);
  if (r.status === 401) throw new ErrAuth();
  if (!r.ok && r.status >= 500) throw new Error("el servidor falló ("+r.status+")");
  return r.json();
}

// ---------- Switcher de buzones (modo agencia): saltar entre paneles de varios dominios ----------
// La lista [{nombre,url}] vive en el localStorage DE CADA origen y viaja en el #hash al saltar,
// para que el buzón de destino la aprenda. SIN contraseñas: cada origen guarda solo la suya
// (si el destino no tiene sesión, muestra su login normal).
function buzones(){ try{ const l=JSON.parse(localStorage.getItem("buzones_agente")||"[]"); return Array.isArray(l)?l:[]; }catch(e){ return []; } }
function guardarBuzones(l){ try{ localStorage.setItem("buzones_agente", JSON.stringify(l.slice(0,20))); }catch(e){} }
function normalizarBuzon(b){
  if(!b || typeof b.url!=="string") return null;
  let u; try{ u=new URL(b.url.trim()); }catch(e){ return null; }
  if(u.protocol!=="https:" && u.hostname!=="localhost" && u.hostname!=="127.0.0.1") return null;
  const ctas = Array.isArray(b.cuentas)
    ? b.cuentas.map(x=>String(x).trim().toLowerCase()).filter(x=>x.includes("@")).slice(0,10) : [];
  const base = { nombre:String(b.nombre||u.hostname).slice(0,40), url:u.origin };
  if(ctas.length) base.cuentas = ctas;
  return base;
}
function upsertBuzon(lista, b){
  b = normalizarBuzon(b); if(!b) return lista;
  const i = lista.findIndex(x=>x.url===b.url);
  if(i>=0){
    lista[i] = { nombre:b.nombre||lista[i].nombre, url:b.url,
                 ...( (b.cuentas||lista[i].cuentas) ? {cuentas: b.cuentas||lista[i].cuentas} : {} ) };
    return lista;
  }
  // El MISMO buzón puede vivir en dos dominios (workers.dev y el dominio propio): si el
  // nombre es un correo, es su identidad → una sola entrada, prefiriendo el dominio propio.
  if(b.nombre.includes("@")){
    const j = lista.findIndex(x=>x.nombre===b.nombre);
    if(j>=0){
      const actual = lista[j].url;
      if(actual !== location.origin){
        const feo = (u)=>u.includes(".workers.dev");
        if(feo(actual) && !feo(b.url)) lista[j].url = b.url;
      }
      if(b.cuentas) lista[j].cuentas = b.cuentas;
      return lista;
    }
  }
  lista.push(b);
  return lista;
}
function iniciarBuzones(){
  if(!MODO_AGENCIA) return;

  lista = upsertBuzon(lista, { nombre:"{{CONTACT_EMAIL}}" || "{{BRAND_SHORT}}", url:location.origin,
    cuentas: CUENTAS.map(c=>c.email) });  // el actual se registra solo: correo + sus cuentas
  // Buzones hermanos que ya vienen en la config del Worker: se fusionan solos.
  const PRECARGADOS = "{{BUZONES_JSON}}";

    }

      if(Array.isArray(extra)) for(const b of extra.slice(0,20)) lista = upsertBuzon(lista, b);
    }catch(e){}
    if(partes.cuenta){ try{ cuentaDestino = decodeURIComponent(partes.cuenta); }catch(e){} }
    abrirMenuAlLlegar = partes.menu === "1";

  guardarBuzones(lista);

function dominioBuzon(b){

// El color sale del propio nombre, así que un mismo cliente siempre tiene el mismo.
const COLORES_AV = ["#0F6E6E","#B0562C","#5B3FBF","#1F7A4D","#A33A5B","#2C5FA8","#8A6D1F","#7A3E8F"];
function avatarHtml(nombre, clase){
  const txt = (nombre||"?").trim();
  const inicial = (txt.replace(/^[^\p{L}\p{N}]+/u,"")[0] || "?");
  let suma = 0;
  for(let i=0;i<txt.length;i++) suma = (suma*31 + txt.charCodeAt(i)) >>> 0;
  const color = txt.toLowerCase()==="yo" ? "#5F6B6B" : COLORES_AV[suma % COLORES_AV.length];
  return `<span class="av ${clase||''}" style="background:${color}" aria-hidden="true">${esc(inicial)}</span>`;
}

  const texto=document.getElementById("afTexto").value.trim();
  const etq=document.getElementById("afEtiqueta").value.trim();
  const desde=document.getElementById("afDesde").value;
  const hasta=document.getElementById("afHasta").value;
  const adj=document.getElementById("afAdj").checked;
  const noLeido=document.getElementById("afNoLeido").checked;
  // Se arma la misma consulta que escribirías a mano: from:… has:adjunto is:noleido
  let q = texto;
  if(de) q = `from:${de.split(/\s+/)[0]} ${q}`.trim();
  if(adj) q = `has:adjunto ${q}`.trim();
  if(noLeido) q = `is:noleido ${q}`.trim();
  if(!q && !desde && !hasta && !etq){ toast("⚠️ Pon al menos un filtro"); return; }
  busca = q || "(filtros)";
  document.getElementById("qBusca").value = q;
  document.getElementById("qLimpiar").style.display="block";
  let url = `/api/buscar?q=${encodeURIComponent(q)}`;
  if(desde) url += `&desde=${desde}`;
  if(hasta) url += `&hasta=${hasta}`;
  if(etq) url += `&etiqueta=${encodeURIComponent(etq.toLowerCase())}`;
  url += ctaQuery();
  try{
    const d = await api(url);
    items = d.hilos||[]; hasMore=false; lastTotal=items.length;
    render();
    document.getElementById("avanzada").classList.remove("on");
    toast(items.length ? `${items.length} conversaciones` : "Sin resultados");
  }catch(e){ toast("⚠️ "+(e.message||"error")); }
}

// ---------- Búsqueda (fase 11) ----------
function chipsQuery(){
  return Object.keys(chips).filter(k=>chips[k]).map(k=>`&${k}=1`).join("");
}
function toggleChip(btn){
  const k=btn.dataset.chip; chips[k]=!chips[k];
  btn.classList.toggle("on", chips[k]);
  if(busca) buscar();
}
async function buscar(){
  try{
    const d = await api(`/api/buscar?q=${encodeURIComponent(busca)}${chipsQuery()}${ctaQuery()}`);
    items = d.hilos||[]; hasMore=false; lastTotal=items.length;
    if(d.error_busqueda) toast("⚠️ Búsqueda no disponible (falta migrar)");
    render();
  }catch(e){ toast(e && e.red ? "📡 Sin conexión: no se pudo buscar" : "⚠️ "+(e.message||"error")); }
}
function limpiarBusqueda(silencioso){
  try{ document.querySelector("header").classList.remove("oculta"); }catch(e){}
  busca=""; document.getElementById("qBusca").value="";
  document.getElementById("qLimpiar").style.display="none";
  document.getElementById("fchips").classList.remove("on");
  for(const k in chips){ chips[k]=false; }
  document.querySelectorAll(".fchip").forEach(c=>c.classList.remove("on"));
  if(!silencioso) cargar(true);
}

// ---------- Lista (paginada): hilos en Recibidos/Enviados/Archivados, correos en el resto ----------
async function cargar(reset){
  if(reset){ page=1; items=[]; }
  if(busca){ await buscar(); return; }
  const etqQ = etiquetaActiva ? `&etiqueta=${encodeURIComponent(etiquetaActiva.toLowerCase())}` : "";
  if(esVistaHilos(filtro) && !vistaPorMensaje){
    const d = await api(`/api/hilos?filtro=${filtro}&page=${page}&pageSize=${pageSize}${etqQ}${ctaQuery()}`);
    items = reset ? (d.hilos||[]) : items.concat(d.hilos||[]);
    hasMore = !!d.hasMore;
    lastTotal = d.total || items.length;
  } else {
    const d = await api(`/api/correos?filtro=${filtro}&page=${page}&pageSize=${pageSize}${etqQ}${ctaQuery()}`);
    items = reset ? (d.correos||[]) : items.concat(d.correos||[]);
    hasMore = !!d.hasMore;
    lastTotal = d.total || items.length;
  }
  render();
}
async function cargarMas(){
  if(cargando || !hasMore) return;
  cargando=true; page++;
  try{ await cargar(false); } finally { cargando=false; }
}

function vacioMsg(){
  if(busca) return `Sin resultados para “${esc(busca)}”.`;
  if(etiquetaActiva) return `Nada con la etiqueta “${esc(etiquetaActiva)}”.`;
  return filtro==="destacados" ? "Sin conversaciones destacadas. Toca la ☆ de una fila para guardarla aquí."
       : filtro==="pospuestos" ? "Nada pospuesto. Usa ⏰ para esconder una conversación y que vuelva sola."

function cardHtml(c){
  const noLeido = !c.leido;
  // En Enviados, tanto las cotizaciones proactivas ('enviado') como las respuestas ('respondido')
  // se muestran como salientes: "→ destinatario". El destinatario de una respuesta es el cliente (c.de).
  const quien = c.estado==="enviado" ? "→ "+esc(c.para||"")
              : c.estado==="respondido" ? "→ "+esc(c.de||"")
              : c.estado==="borrador_salida" ? "→ "+esc(c.para||"(sin destinatario)")
              : esc(c.de_nombre||c.de);
  // Abrir: un borrador de salida vuelve al compositor; lo demás abre su conversación.
  const abrir = c.estado==="borrador_salida" ? `abrirCompose(${c.id})`
              : (filtro==="borradores" ? `verHilo('${esc(c.thread_id||("id:"+c.id)).replace(/'/g,"\\'")}')`
                                       : `ver(${c.id})`);
  // Los salientes se ordenan/fechan por la fecha de envío (respondido_en), no la de recepción.
  const cuando = (c.estado==="respondido"||c.estado==="enviado") ? (c.respondido_en||c.recibido_en) : c.recibido_en;
  const nHilo = c.hilo_n || 1;
  return `
    <div class="card${noLeido?' card-noleido':''}" onclick="${abrir}">
      <div class="row1">
        <span class="de${noLeido?' bold':''}">${quien}</span>
        ${c.estado==="borrador_salida"?`<span class="est est-ajuste" style="background:#efe9fb;color:#5b3fbf">✍ Sin enviar</span>`:""}
        ${c.confianza==="baja"?`<span class="est est-ajuste">⚠️ Revisar</span>`:""}
        ${nHilo>1?`<span class="badge">💬 ${nHilo}</span>`:""}
        <span class="fecha" title="${esc(fechaFull(cuando))}">${esc(fmtFecha(cuando))}</span>
      </div>
      <div class="asunto${noLeido?' bold':''}">${esc(c.asunto)}</div>
      <div class="snippet">${esc(c.snippet||"")}</div>
      ${chipsHtml(c)}
      ${accionesHtml(c)}
    </div>`;
}

// ---------- Fila de conversación (fase 10, densa estilo Gmail) ----------
// Gmail muestra el NOMBRE del archivo en la propia fila; ver "cotizacion.pdf" de un
// vistazo evita abrir el correo solo para comprobar si el adjunto llegó.
function adjNombresHtml(h){
  const arr=(h.adj_nombres||"").split("|").map(s=>s.trim()).filter(Boolean).slice(0,2);
  if(!arr.length) return "";
  return `<span class="hadj">`+arr.map(n=>`<span title="${esc(n)}">${esc(n)}</span>`).join("")+`</span>`;
}
// MEJORA sobre Gmail: si una cotización lleva mucho sin responder, la fila lo grita.
// Gmail no puede hacer esto porque no sabe qué es un cliente esperando presupuesto.
const HORAS_AVISO = 4, HORAS_URGENTE = 24;
function avisoEspera(h){
  // Solo aplica a lo que el cliente está esperando: entrante y aún sin responder.
  if(filtro!=="recibidos" || (h.respondidos||0)>0) return "";
  if(h.ult_de==="yo") return "";
  const hrs = horasEsperando((h.ultima||"").replace(" ","T")+"Z");
  if(hrs >= HORAS_URGENTE) return `<span class="hchip hchip-rev" title="Lleva más de un día esperando respuesta">⏳ ${Math.floor(hrs/24)}d sin responder</span>`;
  if(hrs >= HORAS_AVISO) return `<span class="hchip hchip-aju" title="Lleva varias horas esperando respuesta">⏳ ${Math.floor(hrs)}h</span>`;
  return "";
}
function hiloChips(h){
  let chips = "";
  if((h.revisar||0)>0)        chips += `<span class="hchip hchip-rev">⚠ Revisar</span>`;
  else if((h.ajustes||0)>0)   chips += `<span class="hchip hchip-aju">⏳ Ajuste</span>`;
  else if((h.borradores||0)>0)chips += `<span class="hchip hchip-bor">✍ Borrador IA</span>`;
  if((h.respondidos||0)>0 && filtro!=="enviados") chips += `<span class="hchip hchip-ok">✓ Respondido</span>`;
  if(filtro==="pospuestos" && h.pospuesto_hasta)
    chips += `<span class="hchip hchip-aju">⏰ ${esc(fmtFechaSql(h.pospuesto_hasta))}</span>`;
  return chips;
}

function hiloHtml(h){
