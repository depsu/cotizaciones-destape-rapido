// Scroll infinito del teléfono: al asomar el final de la lista, se traen más conversaciones.
let obsFin = null;
function observarFinLista(){
  const fin = document.getElementById("finLista");
  if(!fin || !("IntersectionObserver" in window)) return;
  if(!obsFin){
    obsFin = new IntersectionObserver((entradas)=>{
      if(entradas.some(e=>e.isIntersecting) && hasMore && !cargando) cargarMas();
    }, { rootMargin: "400px" });
  }
  obsFin.disconnect();
  obsFin.observe(fin);
}

// La entrada escalonada solo se usa al cambiar de carpeta o buscar, nunca en el
// refresco automático: animar cada 15 segundos marearía.
let animarLista = false;
function render(){
  const lista = document.getElementById("lista");
  let html;
  if(esVistaHilos(filtro) && !vistaPorMensaje){
    // Solo se anima cuando la lista se pinta de nuevo (no en cada refresco de 15 s).
    html = items.length
      ? `<div class="hlist${animarLista?' animar':''}">`+items.map(h=>hiloHtml(h)).join("")+`</div>`
      : `<div class="vacio">${vacioMsg()}</div>`;
  } else {
    html = items.length ? items.map(c=>cardHtml(c)).join("") : `<div class="vacio">${vacioMsg()}</div>`;
  }
  // Contador "1–30 de 234" con flechas de página: es de ESCRITORIO. En el teléfono la lista
  // se alarga sola al llegar al final (ver observador de #finLista, más abajo).
  if(items.length && !busca && window.innerWidth>820){
    const total = lastTotal||items.length;
    html = `<div style="display:flex;justify-content:flex-end;align-items:center;gap:2px;
              padding:0 4px 8px;font-size:12.5px;color:var(--gray)">
              <span style="margin-right:8px">1–${items.length} de ${total}</span>
              <button class="pag" onclick="cargar(true)" title="Actualizar" aria-label="Actualizar">↻</button>
              <button class="pag" ${hasMore?'':'disabled'} onclick="cargarMas()"
                      title="Ver más antiguos" aria-label="Ver más antiguos">›</button>
            </div>` + html;
  }
  if(hasMore){
    html += window.innerWidth>820
      ? `<button class="cargar-mas" onclick="cargarMas()">⬇️ Cargar más antiguos (${items.length} de ${lastTotal})</button>`
      : `<div id="finLista" style="height:1px"></div>`;
  }
  lista.innerHTML = html;
  observarFinLista();
  if(tidLeyendo){
    const f=lista.querySelector(`.hrow[data-tid="${CSS.escape(tidLeyendo)}"]`);
    if(f) f.classList.add("leyendo");
  }
  if(animarLista){
    // Escalonado corto: 18 ms entre filas, tope 10, para que se sienta vivo sin demorar.
    lista.querySelectorAll(".hrow").forEach((f,i)=>{ f.style.animationDelay = Math.min(i,10)*18+"ms"; });
    animarLista = false;
  }
  if(esVistaHilos(filtro) && !busca) setTimeout(prefetchHilos, 300);
}

// ---------- Contadores / badges ----------
async function refrescarContadores(){
  try{
    if(!navigator.onLine){ marcarSinConexion(true); return; }
    const c = await api("/api/contadores" + ctaQuery("?"));
    // El número va a la derecha de cada carpeta del menú, como Gmail.
    const setB = (id, n, negrita) => {
      const el=document.getElementById("tab-"+id); if(!el) return;
      const cnt = el.querySelector(".cnt"); if(!cnt) return;
      cnt.textContent = n>0 ? (n>999?"999+":String(n)) : "";
      const lbl = el.querySelector(".lbl");
      if(lbl) lbl.style.fontWeight = (negrita && n>0) ? "700" : "";
    };
    setB("recibidos", c.recibidos_no_leidos||0, true);
    setB("destacados", c.destacados||0, false);
    setB("pospuestos", c.pospuestos||0, false);
    setB("enviados", c.enviados_no_leidos||0, false);
    setB("borradores", c.borradores||0, false);
    setB("archivados", c.archivados||0, false);
    setB("spam", c.spam||0, false);
    setB("papelera", c.papelera||0, false);
    let pendGlobal = c.pendientes||0;
    if(c.por_cuenta){
      // El badge de la app es SIEMPRE global (suma de las cuentas), aunque la vista esté acotada.
      pendGlobal = Object.values(c.por_cuenta).reduce((a,x)=>a+(x.pendientes||0),0);
      document.querySelectorAll("#listaCuentas .cta-b").forEach(b=>{
        const v=b.dataset.cta||""; const cnt=b.querySelector(".cnt"); if(!cnt) return;
        const n = v ? ((c.por_cuenta[v]||{}).no_leidos||0)
                    : Object.values(c.por_cuenta).reduce((a,x)=>a+(x.no_leidos||0),0);
        cnt.textContent = n>0 ? (n>999?"999+":String(n)) : "";
      });
    }
    if(navigator.setAppBadge){ try{ (pendGlobal>0)?navigator.setAppBadge(pendGlobal):navigator.clearAppBadge(); }catch(e){} }
  }catch(e){}
}

// ---------- Utilidades de acción (toast + quitar de la lista sin recargar) ----------
function toastEl(){
  let el=document.getElementById("toast");
  if(!el){
    el=document.createElement("div"); el.id="toast"; el.className="toast";
    el.setAttribute("role","status"); el.setAttribute("aria-live","polite");
    document.body.appendChild(el);
  }
  return el;
}
function toast(t){
  const el=toastEl();
  el.className="toast show"; el.textContent=t; clearTimeout(el._t);
  el._t=setTimeout(()=>el.classList.remove("show"),2200);
}
// Toast con "Deshacer" (fase 12): la acción ya ocurrió y se puede revertir.
function toastUndo(t, alDeshacer, ms){
  const el=toastEl();
  el.className="toast show undo"; el.innerHTML="";
  el.appendChild(document.createTextNode(t));
  const b=document.createElement("button"); b.className="tundo"; b.textContent="Deshacer";
  b.onclick=async ()=>{ clearTimeout(el._t); el.classList.remove("show"); await alDeshacer(); };
  el.appendChild(b);
  clearTimeout(el._t);
  el._t=setTimeout(()=>{ el.classList.remove("show"); el.className="toast"; }, ms||9000);
}

// ---------- Mini-modal propio (fase 12) ----------
// Los diálogos del navegador (confirm/prompt) CONGELAN la PWA en iOS: los reemplazamos.
function miniCerrar(){ document.getElementById("overlay3").style.display="none"; }
function miniBase(titulo, texto, conInput, valorIni, placeholder, onOk){
  const ov=document.getElementById("overlay3");
  document.getElementById("miniTit").textContent=titulo;
  const p=document.getElementById("miniTxt"); p.textContent=texto||""; p.style.display=texto?"block":"none";
  const inp=document.getElementById("miniInput");
  inp.style.display=conInput?"block":"none";
  inp.value=valorIni||""; inp.placeholder=placeholder||"";
  const si=document.getElementById("miniSi"), no=document.getElementById("miniNo");
  const cerrar=()=>{ miniCerrar(); si.onclick=null; no.onclick=null; inp.onkeydown=null; };
  si.onclick=()=>{ const v=conInput?inp.value.trim():true; cerrar(); onOk(v); };
  no.onclick=cerrar;
  inp.onkeydown=(e)=>{ if(e.key==="Enter"){ e.preventDefault(); si.click(); } };
  ov.style.display="flex";
  setTimeout(()=>{ if(conInput) inp.focus(); },50);
}
function miniPrompt(titulo, texto, placeholder, onOk){ miniBase(titulo,texto,true,"",placeholder,(v)=>{ if(v) onOk(v); }); }
function miniConfirm(titulo, texto, onOk){ miniBase(titulo,texto,false,"","",()=>onOk()); }
// Modal con HTML propio (para listas de opciones, p.ej. plantillas).
function miniHtml(titulo, html, montar){
  const ov=document.getElementById("overlay3"), caja=document.getElementById("mini");
  document.getElementById("miniTit").textContent=titulo;
  const p=document.getElementById("miniTxt");
  p.style.display="block"; p.innerHTML=html;
  document.getElementById("miniInput").style.display="none";
  const si=document.getElementById("miniSi"), no=document.getElementById("miniNo");
  si.style.display="none"; no.textContent="Cerrar";
  const cerrar=()=>{ miniCerrar(); si.style.display=""; no.textContent="Cancelar"; p.innerHTML=""; no.onclick=null; };
  no.onclick=cerrar;
  ov.style.display="flex";
  if(montar) montar(p, cerrar);
}
function quitarDeLista(id){ const i=items.findIndex(x=>x.id===id); if(i>=0){ items.splice(i,1); render(); } }
function quitarDeListaHilo(tid){
  cacheHilos.delete(tid);
  const i=items.findIndex(x=>x.tid===tid); if(i>=0){ items.splice(i,1); render(); }
}

// ---------- Acciones sobre un hilo completo (fase 10) ----------
// Fase 12: UI optimista — la fila desaparece al instante y el toast ofrece Deshacer.
async function accionHilo(url, tid, okMsg, quitar, urlDeshacer){
  const idx = items.findIndex(x=>x.tid===tid);
  const copia = idx>=0 ? items[idx] : null;
  if(quitar){ cerrar(); quitarDeListaHilo(tid); }
  try{
    const d=await api(url,{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({thread_id:tid})});
    if(!d || d.error){
      if(copia){ items.splice(idx,0,copia); render(); }   // revertir el optimismo
      toast("⚠️ "+((d&&d.error)||"error")); return;
    }
    refrescarContadores();
    if(urlDeshacer){
      toastUndo(okMsg, async ()=>{
        try{
          await api(urlDeshacer,{method:"POST",headers:{"content-type":"application/json"},
            body:JSON.stringify({thread_id:tid})});
          if(copia){ items.splice(Math.min(idx,items.length),0,copia); render(); }
          refrescarContadores(); toast("Deshecho ↩️");
        }catch(e){ toast("⚠️ "+e.message); }
      });
    } else toast(okMsg);
  }catch(e){
    if(copia){ items.splice(idx,0,copia); render(); }
    toast("⚠️ "+e.message);
  }
}
// Estrella (fase 13): se pinta al instante y se guarda detrás.
async function destacar(tid, valor, ev){
  if(ev) ev.stopPropagation();
  const it = items.find(x=>x.tid===tid);
  if(it){ it.destacado = valor; render(); }
  try{
    await api("/api/destacar-hilo",{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({thread_id:tid, destacado:valor})});
    if(filtro==="destacados" && !valor) quitarDeListaHilo(tid);
    refrescarContadores();
  }catch(e){
    if(it){ it.destacado = valor?0:1; render(); }   // revertir si falló
    toast("⚠️ "+e.message);
  }
}

function accRestaurarHilo(tid){ accionHilo("/api/restaurar-hilo",tid,"En Recibidos 📥",true,"/api/archivar-hilo"); }

let hiloUnico = false; // hilo de 1 solo mensaje entrante -> permite "Spam" directo

// Aplana los mensajes en entradas de conversación: cada respuesta enviada
// (respuesta_enviada del correo entrante) se vuelve su propia entrada saliente.
function entradasHilo(msgs){
  const arr=[];
  for(const m of msgs){
    const esNuestro = esCuentaNuestra(m.de) || m.estado==="enviado";
    arr.push({
      id:String(m.id), dir:esNuestro?"out":"in",
      nombre: esNuestro?"Yo":(((m.de_nombre||"").trim()) || m.de || "(desconocido)"),
      email: m.de||"", ts:m.recibido_en, leido:m.leido,
      texto:(m.cuerpo_texto||""), html:(m.cuerpo_html||""),
      adj: esNuestro?m.adjunto_nombre:null, adjId:m.id, urlCot:m.url_cotizacion||null,
      adjuntos: m.adjuntos || []          // fase 13: archivos que mandó el cliente
    });
    if(m.url_cotizacion) urlsCot.set(m.id, m.url_cotizacion);
    if(!esNuestro && m.respuesta_enviada && m.respuesta_enviada.trim()){
      arr.push({ id:"r"+m.id, dir:"out", nombre:"Yo", email:NOSOTROS,
        ts:m.respondido_en||m.recibido_en, leido:1,
        texto:m.respuesta_enviada, html:"", adj:m.adjunto_nombre, adjId:m.id });
    }
  }
  arr.sort((a,b)=>(new Date(a.ts||0))-(new Date(b.ts||0)));
  return arr;
}

// Separa el historial citado dentro de un HTML ya sanitizado (blockquote / gmail_quote).
function partirCitasHtml(htmlLimpio){
  const div = document.createElement("div");
  div.innerHTML = htmlLimpio;
  const citas = div.querySelectorAll('blockquote, div.gmail_quote, .gmail_quote, [type="cite"], .moz-cite-prefix, #appendonsend');
  if(!citas.length) return {visible:htmlLimpio, hayCita:false};
  citas.forEach(c=>c.remove());
  // Si al quitar las citas no queda nada legible, mejor mostrar el correo entero.
  if(!div.textContent.trim() && !div.querySelector("img")) return {visible:htmlLimpio, hayCita:false};
  return {visible:div.innerHTML, hayCita:true};
}

let entradasActuales = [];  // entradas del hilo abierto (para montar cuerpos al vuelo)

// Monta el cuerpo de un mensaje (HTML aislado o texto plano) la primera vez que se abre.
function montarCuerpo(idx){
  const e = entradasActuales[idx];
  const cont = document.querySelector(`.hm-body[data-idx="${idx}"]`);
  if(!e || !cont || cont.dataset.montado) return;
  cont.dataset.montado = "1";
  let extra = "";
  if(e.html){
    // Las imágenes se muestran SOLAS (como Gmail), porque igual pasan por nuestro proxy:
    // el remitente nunca ve tu IP ni te pone cookies. Solo se bloquean en Spam/Papelera.
    // Las firmas de las imágenes ya se calcularon en verHiloInterno, antes de montar.
    const confiable = mostrarImagenesSiempre || imagenesOk.includes((e.email||"").toLowerCase()) || e.dir==="out";
    const limpio = sanitizarCorreo(e.html, confiable, e.adjuntos);
    const bloqueadas = imgsBloqueadas;
    const part = partirCitasHtml(limpio);
    const espias = rastreadoresBloqueados;
    if(bloqueadas>0){
      const av = document.createElement("div");
      av.className="img-aviso";
      av.innerHTML = `🖼️ ${bloqueadas} ${bloqueadas===1?"imagen bloqueada":"imágenes bloqueadas"} para proteger tu privacidad.
        <button data-ver="1">Mostrar</button><button data-siempre="1">Mostrar siempre de este remitente</button>`;
      av.querySelector("[data-ver]").onclick = (ev)=>{ ev.stopPropagation(); mostrarImgs(idx,false); };
      av.querySelector("[data-siempre]").onclick = (ev)=>{ ev.stopPropagation(); mostrarImgs(idx,true); };
      cont.appendChild(av);
    }
    // Aviso honesto: este correo te estaba espiando y no lo dejamos. Gmail no avisa.
    if(espias>0){
      const nota=document.createElement("div"); nota.className="img-aviso espia";
      nota.textContent = espias===1
        ? "🕵️ Se bloqueó 1 rastreador: el remitente no sabrá que abriste este correo."
        : `🕵️ Se bloquearon ${espias} rastreadores: el remitente no sabrá que abriste este correo.`;
      cont.appendChild(nota);
    }
    const marco = document.createElement("iframe");
    cont.appendChild(marco);
    montarIframe(marco, part.hayCita?part.visible:limpio);
    if(part.hayCita){
      const b = document.createElement("button");
      b.className="qbtn"; b.textContent="⋯"; b.title="Mostrar texto citado";
      let abierto=false;
      b.onclick=(ev)=>{ ev.stopPropagation(); abierto=!abierto; montarIframe(marco, abierto?limpio:part.visible); };
      cont.appendChild(b);
    }
  } else {
    const part = partirCitas(e.texto||"");
    const d = document.createElement("div"); d.className="hm-txt";
    d.textContent = part.visible || "(sin contenido)";
    cont.appendChild(d);
    if(part.cita){
      const b=document.createElement("button"); b.className="qbtn"; b.textContent="⋯"; b.title="Mostrar texto citado";
      const q=document.createElement("div"); q.className="hm-cita"; q.textContent=part.cita;
      b.onclick=(ev)=>{ ev.stopPropagation(); q.classList.toggle("abierta"); };
      cont.appendChild(b); cont.appendChild(q);
    }
  }
  if(e.adj) cont.insertAdjacentHTML("beforeend", pdfCotizacionHtml(e));
  const chips = adjuntosHtml(e);
  if(chips) cont.insertAdjacentHTML("beforeend", chips);
  cont.insertAdjacentHTML("beforeend", extra);
}

// El PDF de cotización que dejó la IA, como enlace firmado (abre bien en el iPhone).
function pdfCotizacionHtml(e){
  if(!e.adj) return "";
  return e.urlCot
    ? `<div class="hm-adj">📎 <a href="${esc(e.urlCot)}" target="_blank" rel="noopener"
         onclick="event.stopPropagation()"><b>${esc(e.adj)}</b></a> · adjunto en PDF</div>`
    : `<div class="hm-adj">📎 <b>${esc(e.adj)}</b></div>`;
}

// ---------- Adjuntos que mandó el cliente (fase 13) ----------
function pesoLegible(b){
  if(!b) return "";
  return b < 1024 ? b+" B" : b < 1048576 ? Math.round(b/1024)+" KB" : (b/1048576).toFixed(1)+" MB";
}
function iconoArchivo(mime, nombre){
  const n=(nombre||"").toLowerCase(), m=(mime||"").toLowerCase();
  if(m.includes("pdf")||n.endsWith(".pdf")) return "📕";
  if(m.startsWith("image/")) return "🖼️";
  if(m.includes("sheet")||/\.(xlsx?|csv)$/.test(n)) return "📊";
  if(m.includes("word")||/\.docx?$/.test(n)) return "📝";
  if(/\.(zip|rar|7z)$/.test(n)) return "🗜️";
  return "📎";
}
function adjuntosHtml(e){
  // Los 'inline' son las imágenes incrustadas del cuerpo: no se listan como archivos.
  const arr=(e.adjuntos||[]).filter(a=>!a.inline);
  if(!arr.length) return "";
  return `<div class="adjs">`+arr.map(a=> a.url
    ? `<a class="adj" href="${esc(a.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">
         <span class="ic">${iconoArchivo(a.mime,a.nombre)}</span>
         <span><span class="n">${esc(a.nombre||"archivo")}</span><br><span class="t">${pesoLegible(a.tamano)}</span></span>
       </a>`
    : `<span class="adj grande" title="Los archivos sobre 600 KB no se guardan en el panel">
         <span class="ic">${iconoArchivo(a.mime,a.nombre)}</span>
         <span><span class="n">${esc(a.nombre||"archivo")}</span><br>
         <span class="t">${pesoLegible(a.tamano)} · muy pesado, búscalo en tu Gmail</span></span>
       </span>`).join("")+`</div>`;
}

// "Mostrar imágenes" de un mensaje (y opcionalmente confiar en el remitente para siempre).
async function mostrarImgs(idx, siempre){
  const e = entradasActuales[idx];
  if(!e) return;
  if(siempre){
    try{
      await api("/api/imagenes-confiables",{method:"POST",headers:{"content-type":"application/json"},
        body:JSON.stringify({remitente:e.email})});
      if(!imagenesOk.includes((e.email||"").toLowerCase())) imagenesOk.push((e.email||"").toLowerCase());
      toast("Se mostrarán siempre sus imágenes 🖼️");
    }catch(err){ toast("⚠️ "+err.message); }
  }
  await firmarImgs(e.html);
  const cont = document.querySelector(`.hm-body[data-idx="${idx}"]`);
  if(!cont) return;
  const limpio = sanitizarCorreo(e.html, true, e.adjuntos);
  cont.innerHTML=""; delete cont.dataset.montado;
  const marco=document.createElement("iframe"); cont.appendChild(marco);

  cont.dataset.montado="1";
  if(e.adj) cont.insertAdjacentHTML("beforeend", pdfCotizacionHtml(e));
  const chips = adjuntosHtml(e);
  if(chips) cont.insertAdjacentHTML("beforeend", chips);
}

// ---------- Velocidad (fase 12, receta Superhuman): caché + prefetch ----------
// Los hilos que probablemente abras se piden en segundo plano; al tocarlos, abren al instante.
const cacheHilos = new Map();
function prefetchHilos(){
  if(!pass) return;
  const objetivos = items.slice(0,5).map(h=>h && h.tid).filter(t=>t && !cacheHilos.has(t));
  objetivos.forEach(async (t)=>{
    try{ cacheHilos.set(t, await api("/api/hilo?thread_id="+encodeURIComponent(t))); }
    catch(e){ cacheHilos.delete(t); }
  });
  if(cacheHilos.size>40) cacheHilos.clear();
}

async function verHilo(tid){
  try{ await verHiloInterno(tid); }
  catch(e){ toast(e && e.red ? "📡 Sin conexión: no se pudo abrir" : "⚠️ "+(e.message||"error")); }
}
async function verHiloInterno(tid){
  // Pinta al instante si ya está en caché, y refresca detrás (UI optimista).
  const cache = cacheHilos.get(tid);
  const d = cache || await api("/api/hilo?thread_id="+encodeURIComponent(tid));
  if(cache){ api("/api/hilo?thread_id="+encodeURIComponent(tid)).then(f=>cacheHilos.set(tid,f)).catch(()=>{}); }
  else cacheHilos.set(tid, d);
  const msgs = d.mensajes||[];
  if(!msgs.length){ toast("⚠️ Conversación vacía"); return; }
  actualTid = tid;
  // Correo "accionable" (para responder/ajustar): el último pendiente; si no, el último entrante.
  const accionables = msgs.filter(m=>["nuevo","borrador","ajuste"].includes(m.estado));
  const entrantes = msgs.filter(m=>!esCuentaNuestra(m.de) && m.estado!=="enviado");
  actual = accionables[accionables.length-1] || entrantes[entrantes.length-1] || msgs[msgs.length-1];
  hiloUnico = msgs.length===1 && entrantes.length===1;
  imagenesOk = d.imagenes_confiables || [];
  const ent = entradasHilo(msgs); ent.forEach((e,i)=>e.idx=i);
  entradasActuales = ent;
  document.getElementById("mAsunto").textContent = quitarRe(msgs[0].asunto || actual.asunto);
  document.getElementById("mMeta").innerHTML = ent.length>1
    ? `Conversación · ${ent.length} mensajes`
    : `De: <b>${esc(actual.de_nombre||actual.de)}</b> &lt;${esc(actual.de)}&gt;<br>${esc(fechaFull(actual.recibido_en))}`;
  const body=document.getElementById("mBody");
  body.className="mbody hilo";
  // La vista se muestra ANTES de montar los cuerpos: si los iframes se crean mientras
  // está oculta, miden 0 y quedan cortados.
  abrirVista(tid);
  // Regla Gmail: expandidos el último mensaje y los no leídos; el resto colapsado en una línea.
  const abiertos = ent.map((e,i)=> e.leido===0 || i===ent.length-1);
  body.innerHTML = ent.map((e,i)=>hiloMsgHtml(e, abiertos[i])).join("");
  // Firmar TODAS las imágenes antes de montar: así se ven de una, sin parpadeo ni botón.
  if(ent.some(e=>e.html)) await firmarImgs(ent.filter(e=>e.html).map(e=>e.html).join(""));
  ent.forEach((e,i)=>{ if(abiertos[i]) montarCuerpo(i); });
  renderResp(actual);
  renderEtiquetas(actual);
  renderBar(actual);
  // Se abre ARRIBA del todo, con el asunto a la vista (como Gmail), no a mitad del hilo.
  const ov=document.getElementById("overlay");
  ov.scrollTop = 0;
  document.querySelector(".vbar").classList.remove("despegada");
  vigilarScrollVista();
  setTimeout(()=>{ ov.scrollTop = 0; }, 60);
  // El server ya marcó leído el hilo al abrirlo: reflejar sin recargar.
  const it=items.find(x=>x.tid===tid); if(it && it.no_leidos){ it.no_leidos=0; render(); }
  marcarFilaLeyendo(tid);
  refrescarContadores();
}

// Cache de URLs firmadas del PDF (para los mensajes del hilo ya vienen del servidor).
const urlsCot = new Map();
function urlCotizacion(id){ return urlsCot.get(id) || null; }
async function verAdjunto(id){
  // Respaldo por si no hay URL firmada: descarga con la clave y abre el blob.
  try{
    const r = await fetch("/api/adjunto?id="+id, { headers: { "x-panel-pass": pass } });
    if(!r.ok){ toast("⚠️ No se pudo abrir el PDF"); return; }
    const blob = await r.blob();
    const u = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href=u; a.target="_blank"; a.rel="noopener"; a.download=""; document.body.appendChild(a);
    a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(u), 30000);
  }catch(e){ toast("⚠️ "+e.message); }
}

// ============================================================
// Fase 14 — adjuntar archivos desde el panel (antes había que salirse a Gmail).
// Sin R2: tope de 4 MB en total, que es lo que aguanta el envío por Resend.
// ============================================================
const ADJ_TOPE_TOTAL = 4 * 1024 * 1024;
let adjResp = [], adjCompose = [];
function elegirArchivos(destino){
  const inp=document.createElement("input");
  inp.type="file"; inp.multiple=true;
  inp.onchange=()=>agregarArchivos(destino, inp.files);
  inp.click();
}
// Sacar la foto en el momento: en terreno la foto ES la cotización.
function tomarFoto(destino){
  const inp=document.createElement("input");
  inp.type="file"; inp.accept="image/*"; inp.capture="environment";
  inp.onchange=()=>agregarArchivos(destino, inp.files);
  inp.click();
}
// Las fotos de terreno salen de 4 a 8 MB del teléfono: así no cabe ni una. Se achican
// ANTES de subir, en el propio teléfono. Bajar de 4000px a 1600 quita ~84% de los píxeles,
// y para mostrar un sifón tapado esa resolución sobra.
const FOTO_LADO_MAX = 1600, FOTO_CALIDAD = 0.82;
async function comprimirFoto(file){
  if(!/^image\/(jpe?g|png|webp)$/i.test(file.type)) return file;   // solo fotos
  if(file.size < 400*1024) return file;                             // ya es liviana
  try{
    const bitmap = await createImageBitmap(file);
    const escala = Math.min(1, FOTO_LADO_MAX / Math.max(bitmap.width, bitmap.height));
    if(escala === 1 && file.size < 1.2*1024*1024) return file;
    const w = Math.round(bitmap.width*escala), h = Math.round(bitmap.height*escala);
    const lienzo = document.createElement("canvas");
    lienzo.width = w; lienzo.height = h;
    lienzo.getContext("2d").drawImage(bitmap, 0, 0, w, h);
    bitmap.close && bitmap.close();
    const blob = await new Promise(r=>lienzo.toBlob(r, "image/jpeg", FOTO_CALIDAD));
    if(!blob || blob.size >= file.size) return file;                // no mejoró: se deja igual
    const nombre = (file.name||"foto").replace(/\.(png|webp|jpeg)$/i, ".jpg");
    return new File([blob], nombre, {type:"image/jpeg"});
  }catch(e){ return file; }   // si el teléfono no puede, se manda tal cual
}

// Una sola puerta de entrada para los archivos: el botón, la cámara, arrastrar y pegar.
async function agregarArchivos(destino, archivos){
  const lista = destino==="resp" ? adjResp : adjCompose;
  let agregados = 0, ahorro = 0;
  const originales = [...archivos].slice(0,8);
  if(originales.some(f=>/^image\//i.test(f.type) && f.size > 400*1024))
    toast("Preparando las fotos…");
  for(const bruto of originales){
    const f = await comprimirFoto(bruto);
    if(f !== bruto) ahorro += (bruto.size - f.size);
    const yaHay = lista.reduce((s,a)=>s+a.tamano,0);
    if(yaHay + f.size > ADJ_TOPE_TOTAL){
      toast(`⚠️ "${f.name}" no cabe: el correo admite 4 MB en total`);
      continue;
    }
    if(lista.some(a=>a.nombre===f.name && a.tamano===f.size)){ continue; }  // ya estaba
    try{
      const b64 = await new Promise((ok,err)=>{
        const fr=new FileReader();
        fr.onload=()=>ok(String(fr.result).split(",")[1]||"");
        fr.onerror=()=>err(new Error("no se pudo leer"));
        fr.readAsDataURL(f);
      });
      lista.push({nombre:f.name||"archivo", mime:f.type||"application/octet-stream",
                  tamano:f.size, b64});
      agregados++;
    }catch(e){ toast(`⚠️ No se pudo leer "${f.name}"`); }
  }
  pintarAdjElegidos(destino);
  if(agregados){
    const base = agregados===1 ? "Archivo adjuntado 📎" : `${agregados} archivos adjuntados 📎`;
    toast(ahorro > 200*1024 ? `${base} · ${pesoLegible(ahorro)} menos de datos` : base);
  }
}

// Arrastrar archivos a la ventana de redactar o a la caja de respuesta.
function activarSoltarArchivos(zona, destino){
  if(!zona || zona.dataset.soltar) return;
  zona.dataset.soltar = "1";
  const marcar = (on) => zona.classList.toggle("soltando", on);
  ["dragenter","dragover"].forEach(ev=>zona.addEventListener(ev, e=>{
    if(!(e.dataTransfer && [...e.dataTransfer.types].includes("Files"))) return;
    e.preventDefault(); e.stopPropagation(); marcar(true);
  }));
  ["dragleave","dragend"].forEach(ev=>zona.addEventListener(ev, e=>{
    if(e.target===zona) marcar(false);
  }));
  zona.addEventListener("drop", e=>{
    if(!(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length)) return;
    e.preventDefault(); e.stopPropagation(); marcar(false);
    agregarArchivos(destino, e.dataTransfer.files);
  });
}
// Pegar una imagen (captura de pantalla, foto del problema) directo en el correo.
function activarPegarImagenes(campo, destino){
  if(!campo || campo.dataset.pegar) return;
  campo.dataset.pegar = "1";
  campo.addEventListener("paste", e=>{
    const items = (e.clipboardData && e.clipboardData.items) || [];
    const archivos = [...items].filter(i=>i.kind==="file").map(i=>i.getAsFile()).filter(Boolean);
    if(!archivos.length) return;
    e.preventDefault();
    // Las capturas llegan sin nombre: se les pone uno legible con la fecha.
    const conNombre = archivos.map((f,i)=>{
      if(f.name && f.name!=="image.png") return f;
      const ext=(f.type.split("/")[1]||"png").replace("jpeg","jpg");
      return new File([f], `captura-${new Date().toISOString().slice(0,10)}${archivos.length>1?"-"+(i+1):""}.${ext}`, {type:f.type});
    });
    agregarArchivos(destino, conNombre);
  });
}
// Aviso de adjunto olvidado: si el texto promete un archivo y no hay ninguno.
const PROMETE_ADJUNTO = /\b(adjunt|anex|acompa[ñn]o|te env[íi]o el|le env[íi]o el|va el archivo|se adjunta)/i;
function faltaAdjunto(texto, lista){
  return PROMETE_ADJUNTO.test(texto||"") && !(lista||[]).length;
}
function pintarAdjElegidos(destino){
  const lista = destino==="resp" ? adjResp : adjCompose;
  const cont = document.getElementById(destino==="resp" ? "adjElegidos" : "adjComposeElegidos");
  if(!cont) return;

    `<span class="adj"><span class="ic">${iconoArchivo(a.mime,a.nombre)}</span>
       <span><span class="n">${esc(a.nombre)}</span><br><span class="t">${pesoLegible(a.tamano)}</span></span>
       <span class="chip-x" onclick="quitarAdj('${destino}',${i})" title="Quitar">×</span></span>`).join("");
}
function quitarAdj(destino, i){
  (destino==="resp" ? adjResp : adjCompose).splice(i,1);
  pintarAdjElegidos(destino);
}

function enviar(confirmadoSinAdjunto){
  const ta=document.getElementById("respTxt");
  const texto=(ta?ta.value:"").trim();
  if(!texto){ msg("Escribe o redacta una respuesta primero."); return; }
  // Mismo aviso que en el compositor: prometer un adjunto y no mandarlo cuesta un correo más.
  const yaHayPdf = !!(actual && actual.adjunto_nombre);
  const huecos = huecosSinLlenar(texto);

      `Quedó sin llenar: ${huecos.join(", ")}. ¿Enviar igual?`, ()=>enviar(true));
    return;
  }
  if(!confirmadoSinAdjunto && !yaHayPdf && faltaAdjunto(texto, adjResp)){
    miniConfirm("¿Falta el archivo?",
      "En la respuesta dices que adjuntas algo, pero no hay ningún archivo. ¿Enviar igual?",
      ()=>enviar(true));
    return;
  }
  const ccEl=document.getElementById("respCC");

  const id=actual.id, para=actual.de;
  clearTimeout(respTimer);
  botones(true); msg("Enviando en unos segundos…");
  const ejecutar = async (keepalive)=>{
    if(!envioPendiente || envioPendiente.id!==id) return;
    envioPendiente=null;
    try{
      const r = await fetch("/api/enviar",{method:"POST",
        headers:{"content-type":"application/json","x-panel-pass":pass},
        body:JSON.stringify({id,texto,cc}), keepalive:!!keepalive});
      const d = await r.json();
      if(d.ok){
        if(actual && actual.id===id){
          actual.estado="respondido"; actual.respuesta_enviada=texto;
          renderResp(actual); renderBar(actual);
        }
        toast("Enviado 📤"); cargar(true); refrescarContadores();
      } else { msg("⚠️ "+(d.error||"no se pudo enviar")); botones(false); }
    }catch(e){ msg("⚠️ error: "+e.message); botones(false); }
  };
  envioPendiente = {id, texto, timer:setTimeout(()=>ejecutar(false), 6000)};
  toastUndo(`Enviando a ${para}${cc?" (+CC)":""}…`, ()=>{
    if(envioPendiente && envioPendiente.id===id){
      clearTimeout(envioPendiente.timer); envioPendiente=null;
      msg("Envío cancelado. El borrador sigue aquí."); botones(false);
      toast("Envío deshecho ↩️");
    }
  }, 6000);
  // Si el dueño cierra el panel antes de los 6s, el correo IGUAL sale (keepalive).
  window.addEventListener("pagehide", ()=>{ if(envioPendiente&&envioPendiente.id===id) ejecutar(true); }, {once:true});
}

// ============================================================
let vistaAbierta = false, cerrandoPorHistorial = false, msgCursor = -1;

function marcarFilaLeyendo(tid){

// En escritorio ancho la conversación es un panel al costado (la lista sigue visible);
// en pantallas chicas ocupa todo. Una sola función decide, mirando el ancho real.
function panelAlCostado(){ return window.matchMedia("(min-width:1180px)").matches; }

// La cabecera cambia de alto según el tamaño de letra y el ancho: se mide, no se adivina.
// Si el número queda desfasado, las barras pegajosas se meten debajo y cortan los botones.
function medirCabecera(){
  const h = document.querySelector("header");
  if(!h) return;
  const alto = Math.round(h.getBoundingClientRect().height);
  if(alto > 0) document.documentElement.style.setProperty("--alto-cabecera", alto+"px");
}
window.addEventListener("resize", medirCabecera);

// Sombra + asunto en la barra cuando el contenido pasa por debajo.

  const ov=document.getElementById("overlay"), vbar=document.querySelector(".vbar");
  if(!ov || !vbar || ov.dataset.vigilado) return;
  ov.dataset.vigilado="1";
  ov.addEventListener("scroll", ()=>{
    const despegada = ov.scrollTop > 12;
    vbar.classList.toggle("despegada", despegada);
    if(despegada){
      const a=document.getElementById("vbarAsunto"), m=document.getElementById("mAsunto");
      if(a && m && a.textContent!==m.textContent) a.textContent=m.textContent;
    }
  }, {passive:true});
}
function abrirVista(tid){
  // Recordar dónde estaba el foco (la fila) para devolverlo al volver a la bandeja.
  if(!vistaAbierta) focoPrevio = document.activeElement;
  document.getElementById("overlay").classList.add("abierta");
  document.body.classList.add("leyendo");
  // Solo se bloquea el scroll del fondo cuando la vista tapa la pantalla completa.
  document.body.style.overflow = panelAlCostado() ? "" : "hidden";
  if(!panelAlCostado()){ scrollLista=window.scrollY; window.scrollTo(0,0); }
  document.getElementById("overlay").scrollTop = 0;
  if(!vistaAbierta){
    try{ history.pushState({hilo:tid||"msg"}, "", "#leer"); }catch(e){}
    vistaAbierta = true;
  }
}
window.addEventListener("popstate", ()=>{
  // De arriba hacia abajo: primero el compositor, luego el cajón, luego la conversación.
  if(composeAbiertoAhora()){ cerrandoPorHistorial=true; cerrarCompose(); cerrandoPorHistorial=false; return; }
  if(document.getElementById("side").classList.contains("abierto")){
    cerrandoPorHistorial=true; cerrarMenu(); cerrandoPorHistorial=false; return;
  }
  if(vistaAbierta){ cerrandoPorHistorial = true; cerrar(); cerrandoPorHistorial = false; }
});

let focoPrevio = null;
let scrollLista = 0;      // dónde estaba la lista antes de abrir una conversación
let ultimoToque = 0;      // para no repintar la lista justo cuando el dedo está encima
document.addEventListener("touchstart",()=>{ ultimoToque=Date.now(); },{passive:true});
function cerrar(){
  // Si quedó texto sin guardar en la respuesta, guardarlo antes de cerrar (nada se pierde).
  if(respTimer){ clearTimeout(respTimer); respTimer=null; guardarResp(); }
  document.getElementById("overlay").classList.remove("abierta");
  document.body.classList.remove("leyendo");
  document.body.style.overflow="";
  actual=null; actualTid=null; hiloUnico=false; entradasActuales=[]; adjResp=[];
  marcarFilaLeyendo(null);
  document.getElementById("mBody").className="mbody";
  // Sacar la entrada del historial (salvo que justamente venga del botón atrás).
  if(vistaAbierta && !cerrandoPorHistorial){ vistaAbierta=false; try{ history.back(); }catch(e){} }
  else vistaAbierta=false;
  if(focoPrevio && document.body.contains(focoPrevio)){ try{ focoPrevio.focus({preventScroll:true}); }catch(e){} }
  // Volver EXACTAMENTE donde estabas en la lista, como cualquier app nativa.
  if(!panelAlCostado()) requestAnimationFrame(()=>window.scrollTo(0,scrollLista));
  focoPrevio=null;
}

// Red de seguridad local: si entra una llamada y el teléfono cierra la pestaña, lo escrito
// sigue ahí al volver. El servidor guarda cada 2 s; el teléfono, al instante.
const CLAVE_BORRADOR_LOCAL = "borrador_compose";
function guardarLocal(){
  try{
    localStorage.setItem(CLAVE_BORRADOR_LOCAL, JSON.stringify({
      id:composeId,
      para:document.getElementById("cPara").value,
      cc:document.getElementById("cCC").value,
      cco:document.getElementById("cCCO").value,
      asunto:document.getElementById("cAsunto").value,
      html:squire?squire.getHTML():"",
      cuando:new Date().toISOString(),
    }));
  }catch(e){ /* almacenamiento lleno: no es motivo para romper nada */ }
}
function limpiarLocal(){ try{ localStorage.removeItem(CLAVE_BORRADOR_LOCAL); }catch(e){} }
// Al entrar, si quedó algo a medio escribir, se ofrece recuperarlo (no se impone).
function ofrecerBorradorLocal(){
  let g=null;
  try{ g = JSON.parse(localStorage.getItem(CLAVE_BORRADOR_LOCAL)||"null"); }catch(e){}
  if(!g) return;
  const texto = htmlATexto(g.html||"").replace(FIRMA.trim(),"").trim();
  if(!texto && !g.para && !g.asunto){ limpiarLocal(); return; }
  miniConfirm("Tenías un correo a medio escribir",
    `Para ${g.para||"(sin destinatario)"} · ${g.asunto||"sin asunto"}. ¿Lo retomamos?`,
    async ()=>{
      await abrirCompose(g.id||null);
      document.getElementById("cPara").value=g.para||"";
      document.getElementById("cCC").value=g.cc||"";
      document.getElementById("cCCO").value=g.cco||"";
      document.getElementById("cAsunto").value=g.asunto||"";
      if(squire && g.html) squire.setHTML(g.html);
      composeSucio=true;
    });
  // Si dice que no, se descarta para no volver a preguntar.
  const no=document.getElementById("miniNo");
  const antes=no.onclick;
  no.onclick=(e)=>{ limpiarLocal(); if(antes) antes(e); };
}
function programarAutoguardadoCompose(){
  clearTimeout(composeTimer);
  guardarLocal();                                     // instantáneo, sin red
  estadoCompose("Escribiendo…");
  composeTimer = setTimeout(guardarCompose, 2000);    // al servidor con debounce ~2s
}
async function guardarCompose(){
  const para=document.getElementById("cPara").value.trim();
  const asunto=document.getElementById("cAsunto").value.trim();
  const texto=squire?htmlATexto(squire.getHTML()):"";
  if(!para && !asunto && !texto.replace(FIRMA.trim(),"").trim()) return;  // solo la firma: nada que guardar
  try{
    const d=await api("/api/redactar-guardar",{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({id:composeId,para,asunto,texto,de:valorDe()})});
    if(d.id) composeId=d.id;
    composeSucio=false; estadoCompose("Guardado ✓");
    limpiarLocal();          // ya está a salvo en el servidor
  }catch(e){ estadoCompose("⚠️ no se pudo guardar"); }
}
function toggleCC(){

  const mostrar = cc.style.display==="none";
  cc.style.display=cco.style.display = mostrar?"flex":"none";
  if(mostrar) document.getElementById("cCC").focus();
}
async function composeEnviar(confirmadoSinAdjunto){
  const para=document.getElementById("cPara").value.trim();
  const asunto=document.getElementById("cAsunto").value.trim();
  const cc=document.getElementById("cCC").value.trim();
  const cco=document.getElementById("cCCO").value.trim();
  const html=squire?squire.getHTML():"";
  const texto=htmlATexto(html);
  if(!para||!para.includes("@")){ estadoCompose("⚠️ falta el destinatario"); return; }
  if(!texto){ estadoCompose("⚠️ escribe el mensaje"); return; }
  // "Te adjunto la cotización"… y sin archivo. Avisar antes de mandar el papelón.
  const huecosC = huecosSinLlenar(texto);
  if(!confirmadoSinAdjunto && huecosC.length){
    miniConfirm("Faltan datos por completar",
      `Quedó sin llenar: ${huecosC.join(", ")}. ¿Enviar igual?`, ()=>composeEnviar(true));
    return;
  }
  if(!confirmadoSinAdjunto && faltaAdjunto(texto+" "+asunto, adjCompose)){
    miniConfirm("¿Falta el archivo?",
      "En el mensaje dices que adjuntas algo, pero no hay ningún archivo. ¿Enviar igual?",
      ()=>composeEnviar(true));
    return;
  }
  estadoCompose("Enviando…");
  document.querySelectorAll("#compose .btn").forEach(b=>b.disabled=true);
  try{
    const d=await api("/api/redactar-enviar",{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({id:composeId,para,asunto,texto,html,cc,cco,adjuntos:adjCompose,de:valorDe()})});
    if(d.ok){
      composeSucio=false; composeId=null; adjCompose=[]; pintarAdjElegidos("compose"); limpiarLocal();
      document.getElementById("overlay2").style.display="none";
      if(squire) squire.setHTML("");
      toast("Enviado 📤"); cargar(true); refrescarContadores();
    } else estadoCompose("⚠️ "+(d.error||"no se pudo enviar"));
  }catch(e){ estadoCompose("⚠️ "+e.message); }
  document.querySelectorAll("#compose .btn").forEach(b=>b.disabled=false);
}

// ---------- Plantillas de respuesta (fase 12, idea de Zoho) ----------
// Dos tipos de hueco en una plantilla:
//   {cliente} y {fecha} se rellenan solos con lo que ya sabemos;
//   [PRECIO] queda a propósito para que TÚ lo escribas, y avisa antes de enviar.
function rellenarVariables(txt){
  const nombre = (actual && (actual.de_nombre || (actual.de||"").split("@")[0])) || "";
  const primerNombre = nombre.split(/\s+/)[0] || "";
  return (txt||"")
    .replace(/\{cliente\}/gi, nombre || "estimado(a)")
    .replace(/\{nombre\}/gi, primerNombre || "estimado(a)")
    .replace(/\{correo\}/gi, (actual && actual.de) || "")
    .replace(/\{fecha\}/gi, new Date().toLocaleDateString("es-CL",{day:"numeric",month:"long",year:"numeric"}));
}
// Antes de enviar: si quedó un [DATO] sin completar, mejor preguntarlo que mandarlo.
function huecosSinLlenar(texto){
  const m = (texto||"").match(/\[[A-Za-zÁÉÍÓÚÑáéíóúñ0-9 _-]{2,30}\]/g);
  return m ? [...new Set(m)] : [];
}
async function menuPlantillas(destino){
  let d={plantillas:[]};
  try{ d = await api("/api/plantillas"); }catch(e){}
  const lista = d.plantillas||[];
  const cuerpoActual = () => destino==="compose"
    ? (squire?htmlATexto(squire.getHTML()):"")
    : (document.getElementById("respTxt")?document.getElementById("respTxt").value:"");
  const opciones = lista.map(p=>`<button class="qa-b" data-id="${p.id}" style="display:block;width:100%;text-align:left;margin-bottom:5px">📋 ${esc(p.nombre)}</button>`).join("")
    || `<p style="font-size:13px;color:var(--gray)">Aún no tienes plantillas.</p>`;
  miniHtml("Plantillas", opciones +
    `<button class="qa-b" id="plNueva" style="display:block;width:100%;text-align:left">➕ Guardar lo escrito como plantilla</button>`,
    (root, cerrar)=>{
      root.querySelectorAll("[data-id]").forEach(b=>{
        b.onclick=()=>{
          const p = lista.find(x=>String(x.id)===b.dataset.id);
          if(!p) return;
          // Las variables se rellenan solas con lo que ya sabemos del cliente.
          const cuerpo = rellenarVariables(p.cuerpo);
          if(destino==="compose" && squire){ squire.insertHTML(esc(cuerpo).replace(/\n/g,"<br>")); composeSucio=true; programarAutoguardadoCompose(); }
          else { const t=document.getElementById("respTxt"); if(t){ t.value = cuerpo + (t.value?"\n\n"+t.value:""); programarAutoguardadoResp(); } }
          if(/\[[^\]]+\]/.test(cuerpo)) toast("⚠️ Quedan datos por completar entre corchetes");
          cerrar();
        };
      });
      root.querySelector("#plNueva").onclick=()=>{
        const cuerpo = cuerpoActual().trim();
        cerrar();
        if(!cuerpo){ toast("⚠️ Escribe algo primero"); return; }
        miniPrompt("Nueva plantilla","¿Cómo se llama?","Ej: Cotización estándar", async (nombre)=>{
          if(!nombre) return;
          try{ await api("/api/plantillas",{method:"POST",headers:{"content-type":"application/json"},
            body:JSON.stringify({nombre,cuerpo})}); toast("Plantilla guardada 📋"); }catch(e){ toast("⚠️ "+e.message); }
        });
      };
    });
}

// --- PWA / Notificaciones push ---
function urlB64ToUint8Array(b64){
  const pad="=".repeat((4-b64.length%4)%4);
  const s=(b64+pad).replace(/-/g,"+").replace(/_/g,"/");
  const raw=atob(s); const arr=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) arr[i]=raw.charCodeAt(i);
  return arr;
}
async function registrarSW(){
  if("serviceWorker" in navigator){ try{ await navigator.serviceWorker.register("/sw.js"); }catch(e){} }
}
async function activarNotis(){
  if(!("serviceWorker" in navigator) || !("PushManager" in window)){
    alert("Para recibir notificaciones en iPhone: abre el panel en Safari, Compartir → Añadir a pantalla de inicio, ábrelo desde ese ícono y reintenta.");
    return;
  }
  if(!pass){ alert("Primero ingresa al panel."); return; }
  try{
    const perm=await Notification.requestPermission();
    if(perm!=="granted"){ alert("Permiso de notificaciones denegado."); return; }
    const reg=await navigator.serviceWorker.ready;
    const vapid=(await (await fetch("/vapid-public")).text()).trim();
    const vieja=await reg.pushManager.getSubscription();
    if(vieja){ try{ await vieja.unsubscribe(); }catch(e){} }
    const sub=await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:urlB64ToUint8Array(vapid)});
    const d=await api("/api/push-subscribe",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(sub)});
    alert(d.ok? "🔔 Notificaciones activadas en este dispositivo." : "No se pudo activar: "+(d.error||""));
  }catch(e){
    alert("Error: "+e.message+"\n\nEn iPhone debe estar agregado a la pantalla de inicio y abierto desde ahí.");
  }
}
async function asegurarPush(){
  if(!pass) return;
  if(!("serviceWorker" in navigator) || !("PushManager" in window)) return;
  if(Notification.permission!=="granted") return;
  try{
    const reg=await navigator.serviceWorker.ready;
    const vapid=(await (await fetch("/vapid-public")).text()).trim();
    let sub=await reg.pushManager.getSubscription();
    if(!sub){ sub=await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:urlB64ToUint8Array(vapid)}); }
    await api("/api/push-subscribe",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(sub)});
  }catch(e){}
}

function filasVisibles(){ return [...document.querySelectorAll(".hrow")]; }
function moverCursor(paso){
  const filas=filasVisibles();
  if(!filas.length) return;
  cursor = Math.max(0, Math.min(filas.length-1, cursor + paso));
  filas.forEach(f=>f.classList.remove("activo"));
  const f=filas[cursor];
  f.classList.add("activo");
  f.scrollIntoView({block:"nearest"});
}
function tidCursor(){
  const f=filasVisibles()[cursor];
  return f ? f.dataset.tid : null;
}
document.addEventListener("keydown", (e)=>{
  const enCampo = /^(INPUT|TEXTAREA)$/.test(e.target.tagName) || e.target.isContentEditable;
  const modalAbierto = vistaAbierta;
  const composeAbierto = composeAbiertoAhora();
  const miniAbierto = document.getElementById("overlay3").style.display==="flex";
  // Escape cierra lo que esté arriba (incluso dentro de un campo).
  if(e.key==="Escape"){
    if(miniAbierto){ miniCerrar(); return; }
    if(composeAbierto){ cerrarCompose(); return; }
    if(modalAbierto){ cerrar(); return; }
    if(busca){ limpiarBusqueda(); return; }
    return;
  }
  if(enCampo || miniAbierto || composeAbierto) return;
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(document.getElementById("app").style.display==="none") return;
  // WCAG 2.1.4: los atajos de UNA sola tecla deben poder apagarse. Gmail hace lo mismo.
  if(!atajosActivos) return;
  const k=e.key;
  if(k==="/"){ e.preventDefault(); document.getElementById("qBusca").focus(); return; }
  if(k==="c"){ e.preventDefault(); abrirCompose(); return; }
  if(modalAbierto){
    if(k==="e" && actualTid){ e.preventDefault(); accArchivarHilo(actualTid); }
    if(k==="u"){ e.preventDefault(); cerrar(); }
    if(k==="r"){ const t=document.getElementById("respTxt"); if(t){ e.preventDefault(); t.focus(); } }
    if(k==="f"){ e.preventDefault(); reenviar(); }
    if(k==="b" && actualTid){ e.preventDefault(); menuPosponer(actualTid); }
    if(k==="#" && actualTid){ e.preventDefault(); accEliminarHilo(actualTid); }
    // Abrir/cerrar todos los mensajes del hilo (atajos oficiales de Gmail).
    if(k===";"){ e.preventDefault(); entradasActuales.forEach((en,i)=>{
      const el=document.getElementById("hm-"+en.id);
      if(el && !el.classList.contains("abierto")){ el.classList.add("abierto"); montarCuerpo(i); } }); }
    if(k===":"){ e.preventDefault();
      document.querySelectorAll(".hm.abierto").forEach(el=>el.classList.remove("abierto")); }
    // Moverse entre mensajes del hilo.
    if(k==="n"||k==="p"){
      e.preventDefault();
      const abiertos=[...document.querySelectorAll(".hm")];
      if(abiertos.length){
        msgCursor = Math.max(0, Math.min(abiertos.length-1, msgCursor + (k==="n"?1:-1)));
        const el=abiertos[msgCursor];
        if(!el.classList.contains("abierto")){ el.classList.add("abierto"); montarCuerpo(msgCursor); }
        el.scrollIntoView({block:"center",behavior:"smooth"});
      }
    }
    return;
  }
  // Salto de carpeta con dos teclas, como Gmail: g+i, g+s, g+b, g+t, g+d, g+a
  if(k==="g"){ esperandoG = true; setTimeout(()=>{ esperandoG=false; }, 1200); e.preventDefault(); return; }
  if(esperandoG){
    esperandoG = false;
    const destinos = {i:"recibidos", s:"destacados", b:"pospuestos", t:"enviados",
                      d:"borradores", a:"archivados"};
    if(destinos[k]){ e.preventDefault(); setFiltro(destinos[k]); return; }
  }
  // Selección múltiple con dos teclas: *a (todos) y *n (ninguno)
  if(k==="*"){ esperandoAst = true; setTimeout(()=>{ esperandoAst=false; }, 1200); e.preventDefault(); return; }
  if(esperandoAst){
    esperandoAst = false;
    if(k==="a"){ e.preventDefault(); filasVisibles().forEach(f=>{ if(!seleccion.has(f.dataset.tid)) selToggle(f.dataset.tid); }); return; }
    if(k==="n"){ e.preventDefault(); selLimpiar(); return; }
  }
  if(k==="j"){ e.preventDefault(); moverCursor(1); return; }
  if(k==="k"){ e.preventDefault(); moverCursor(-1); return; }
  if(k==="Enter"||k==="o"){ const t=tidCursor(); if(t){ e.preventDefault(); verHilo(t); } return; }
  if(k==="e"){ const t=tidCursor(); if(t){ e.preventDefault(); accArchivarHilo(t); cursor=Math.max(0,cursor-1); } return; }
  if(k==="#"){ const t=tidCursor(); if(t){ e.preventDefault(); accEliminarHilo(t); } return; }
  if(k==="!"){ const t=tidCursor(); const it=items.find(x=>x.tid===t);
    if(it){ e.preventDefault(); accionHilo("/api/eliminar-hilo",t,"Marcado spam 🚫",true,"/api/restaurar-hilo-papelera"); } return; }
  if(k==="x"){ const t=tidCursor(); if(t){ e.preventDefault(); selToggle(t); } return; }
  if(k==="s"){ const t=tidCursor(); const it=items.find(x=>x.tid===t);
    if(it){ e.preventDefault(); destacar(t, it.destacado?0:1); } return; }
  if(k==="b"){ const t=tidCursor(); if(t){ e.preventDefault(); menuPosponer(t); } return; }
  if(k==="I"){ const t=tidCursor(); if(t){ e.preventDefault(); marcarLeidoHilo(t,1); } return; }
  if(k==="U"){ const t=tidCursor(); if(t){ e.preventDefault(); accNoLeidoHilo(t); } return; }
  if(k==="?"){ e.preventDefault(); mostrarAtajos(); return; }
});

// ============================================================
// Fase 12 — deslizar en el teléfono (derecha = Listo, izquierda = Eliminar).
// Detector propio de ~40 líneas inspirado en swiped-events (MIT), sin dependencia.
// ============================================================
(function swipe(){
  let x0=null, y0=null, fila=null, mueve=false, avisado=false;
  const UMBRAL=70;
  // "Leave-behind" de Gmail: al deslizar aparece DEBAJO un fondo de color con la acción escrita,
  // en vez de teñir la propia fila (que dejaba al usuario adivinando qué iba a pasar).
  const capa=document.createElement("div");
  capa.id="swipeBg";
  document.addEventListener("DOMContentLoaded",()=>document.body.appendChild(capa));
  // Qué hace cada lado según la carpeta: en Papelera y Bloqueados no se desliza.
  function accionesDe(){
    if(filtro==="papelera"||filtro==="bloqueados") return null;
    if(filtro==="archivados") return {der:{txt:"Restaurar",col:"#1E8E3E",fn:accRestaurarHilo},
                                      izq:{txt:"Eliminar",col:"#D93025",fn:accEliminarHilo}};
    return {der:{txt:"Listo",col:"#1E8E3E",fn:accArchivarHilo},
            izq:{txt:"Eliminar",col:"#D93025",fn:accEliminarHilo}};
  }
  document.addEventListener("touchstart",(e)=>{
    const f=e.target.closest?e.target.closest(".hrow"):null;
    if(!f || e.touches.length!==1) return;
    if(window.innerWidth>820) return;               // el swipe es gesto de teléfono
    const px=e.touches[0].clientX;
    if(px<28 || px>window.innerWidth-28) return;    // bordes: son del "atrás" del sistema
    if(!accionesDe()) return;
    fila=f; x0=px; y0=e.touches[0].clientY; mueve=false; avisado=false;
    fila.classList.add("swiping");
    const r=f.getBoundingClientRect();
    capa.style.top=r.top+"px"; capa.style.left=r.left+"px";
    capa.style.width=r.width+"px"; capa.style.height=r.height+"px";
    capa.style.display="flex";
  },{passive:true});
  document.addEventListener("touchmove",(e)=>{
    if(!fila || x0===null) return;
    const dx=e.touches[0].clientX-x0, dy=e.touches[0].clientY-y0;
    if(!mueve && Math.abs(dx)<Math.abs(dy)){ soltar(); return; }   // scroll vertical: no es swipe
    if(Math.abs(dx)>12 && Math.abs(dx)>Math.abs(dy)*1.4){
      mueve=true;
      const acc=accionesDe(); if(!acc){ soltar(); return; }
      const lado = dx>0 ? acc.der : acc.izq;
      fila.style.transform=`translateX(${dx*0.65}px)`;             // resistencia, como Gmail
      capa.style.background=lado.col;
      capa.style.justifyContent = dx>0 ? "flex-start" : "flex-end";
      capa.textContent=lado.txt;
      capa.style.opacity = Math.abs(dx)>=UMBRAL ? "1" : ".65";
      if(!avisado && Math.abs(dx)>=UMBRAL){        // vibración al cruzar el umbral
        avisado=true;
        if(navigator.vibrate){ try{ navigator.vibrate(10); }catch(e){} }
      }
    }
  },{passive:true});
  document.addEventListener("touchend",(e)=>{
    if(!fila) return;
    const dx=(e.changedTouches[0].clientX)-x0;
    const tid=fila.dataset.tid;
    const f=fila;
    const acc=accionesDe();
    if(mueve && Math.abs(dx)>UMBRAL && tid && acc){
      const lado = dx>0 ? acc.der : acc.izq;
      f.style.transition="transform .15s ease, opacity .15s ease";
      f.style.transform=`translateX(${dx>0?"100%":"-100%"})`; f.style.opacity="0";
      setTimeout(()=>{ lado.fn(tid); }, 140);
      capa.style.display="none";
      fila=null; x0=null; return;
    }
    soltar();
  });
  function soltar(){
    capa.style.display="none";
    if(!fila) return;
    fila.classList.remove("swiping"); fila.classList.add("swipe-vuelta");
    fila.style.transform=""; fila.style.background="";
    const f=fila; setTimeout(()=>f.classList.remove("swipe-vuelta"),200);
    fila=null; x0=null; y0=null; mueve=false;
  }
})();

// ---------- El FAB se contrae al bajar y vuelve a extenderse al subir (cambio 7/14) ----------
(function fabScroll(){
  let ultY=0;
  window.addEventListener("scroll",()=>{
    if(window.innerWidth>820) return;
    const y=Math.max(0,window.scrollY);
    const bajando = y>ultY;
    const fab=document.getElementById("fab");
    if(fab) fab.classList.toggle("chico", bajando && y>60);
    // La cabecera se esconde al bajar y vuelve al instante al subir (Gmail hace lo mismo).
    const h=document.querySelector("header");
    if(h && !document.body.classList.contains("leyendo")) h.classList.toggle("oculta", bajando && y>80);
    ultY=y;
  },{passive:true});
})();

// ---------- Tirar hacia abajo para actualizar, en el teléfono (fase 12) ----------
(function tirarParaActualizar(){
  let y0=null, activo=false;
  const barra=document.createElement("div");
  barra.style.cssText="position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;text-align:center;font-size:13px;"+
    "color:var(--on-sup);background:var(--sup-high);padding:6px;transform:translateY(-100%);"+
    "transition:transform .2s;z-index:calc(var(--z-cajon) - 2)";
  barra.textContent="↓ Suelta para actualizar";
  document.addEventListener("DOMContentLoaded",()=>document.body.appendChild(barra));
  if(document.body) document.body.appendChild(barra);
  document.addEventListener("touchstart",(e)=>{
    if(window.innerWidth>820){ y0=null; return; }         // gesto de teléfono
    if(composeAbiertoAhora()){ y0=null; return; }         // escribiendo: no interrumpir
    if(document.getElementById("side").classList.contains("abierto")){ y0=null; return; }
    if(window.scrollY>0 || e.touches.length!==1) { y0=null; return; }
    if(vistaAbierta) { y0=null; return; }
    y0=e.touches[0].clientY;
  },{passive:true});
  document.addEventListener("touchmove",(e)=>{
    if(y0===null) return;
    const dy=e.touches[0].clientY-y0;
    if(dy<=0) return;
    // La barra SIGUE al dedo (antes aparecía de golpe a los 60px, sin avisar que faltaba).
    const prog=Math.max(0,Math.min(dy/90,1));
    barra.style.transition="none";
    barra.style.transform="translateY("+(prog*100-100)+"%)";
    if(prog>=1 && !activo){ activo=true; if(navigator.vibrate){ try{navigator.vibrate(8);}catch(e){} } }
    if(prog<1) activo=false;
  },{passive:true});
  document.addEventListener("touchend",async ()=>{
    barra.style.transition="transform .2s";
    if(!activo){ barra.style.transform="translateY(-100%)"; y0=null; return; }
    barra.textContent="Actualizando…";
    try{ await cargar(true); await refrescarContadores(); }catch(e){}
    barra.style.transform="translateY(-100%)";
    setTimeout(()=>{ barra.textContent="↓ Suelta para actualizar"; },300);
    activo=false; y0=null;
  });
})();

// ---------- Buscador: escribe y busca (debounce corto) ----------
document.getElementById("qBusca").addEventListener("input", (e)=>{
  busca = e.target.value.trim();
  document.getElementById("qLimpiar").style.display = busca?"block":"none";
  document.getElementById("fchips").classList.toggle("on", !!busca);
  clearTimeout(buscaTimer);
  if(!busca){ cargar(true); return; }
  buscaTimer = setTimeout(()=>{ if(busca.length>=2) buscar(); }, 280);
});
// Autocompletado del destinatario mientras escribe (libreta que se alimenta sola).
document.getElementById("cPara").addEventListener("input", (e)=>{
  composeSucio=true; programarAutoguardadoCompose(); cargarContactos(e.target.value.trim());
});
document.getElementById("cAsunto").addEventListener("input", ()=>{ composeSucio=true; programarAutoguardadoCompose(); });
document.getElementById("cAsunto").addEventListener("keydown", (e)=>{
  if((e.metaKey||e.ctrlKey)&&e.key==="Enter"){ e.preventDefault(); composeEnviar(); }
});
document.getElementById("editor").addEventListener("keydown", (e)=>{
  if((e.metaKey||e.ctrlKey)&&e.key==="Enter"){ e.preventDefault(); composeEnviar(); }
});

// Panel vivo: cada 15s refresca contadores; la lista solo si estás en la 1ª página, sin modal,
// sin búsqueda ni selección en curso (no pisarle el trabajo al dueño) y no en Bloqueados.
setInterval(()=>{
  if(document.visibilityState!=="visible") return;   // en segundo plano no se gasta batería ni datos
  if(!pass || document.getElementById("app").style.display==="none") return;
  refrescarContadores();
  const modalAbierto = vistaAbierta;
  const composeAbierto = composeAbiertoAhora();
  // En el teléfono, repintar la lista bajo el dedo hace tocar el correo equivocado: solo se
  // refresca si estás arriba y hace 3 s que no tocas la pantalla.
  const seguroRepintar = window.innerWidth>820 || (window.scrollY<40 && Date.now()-ultimoToque>3000);
  if(page===1 && !modalAbierto && !composeAbierto && !busca && !seleccion.size
     && filtro!=="bloqueados" && seguroRepintar)
    cargar(true).catch(()=>{});   // sin conexión: el banner ya avisa, no molestar con toasts
}, 15000);
// Al volver a la app (cambiar de pestaña o desbloquear el teléfono) se refresca al instante.
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible" && pass && !vistaAbierta && !composeAbiertoAhora()){
    refrescarContadores();
  }
});

if(pass){ document.getElementById("login").style.display="none"; iniciar(); }
document.getElementById("pass").addEventListener("keydown",e=>{ if(e.key==="Enter") entrar(); });
// ---------- Teclado móvil (fase móvil): el botón Enviar JAMÁS bajo el teclado ----------
// iOS no encoge 100vh/100dvh al abrir el teclado: seguimos el alto VISIBLE real.
if (window.visualViewport){
  const seguirTeclado = () => {
    const ov = document.getElementById("overlay2");
    const comp = document.getElementById("compose");
    if(!ov || !comp) return;
    const abierto = ov.style.display === "block" && !ov.classList.contains("min");
    if (abierto && window.innerWidth <= 820) {
      comp.style.height = Math.round(window.visualViewport.height) + "px";
    } else {
      comp.style.height = "";
    }
  };
  window.visualViewport.addEventListener("resize", seguirTeclado);
  window.visualViewport.addEventListener("scroll", seguirTeclado);
}

// ---------- Pista de desborde en barras con scroll horizontal ----------
function marcarDesbordes(){
  document.querySelectorAll(".vbar,.tabs,.mbar").forEach(el=>{
    const hayMas = el.scrollWidth > el.clientWidth + 4
      && el.scrollLeft + el.clientWidth < el.scrollWidth - 4;
    el.classList.toggle("desborda", hayMas);
  });
}
window.addEventListener("resize", marcarDesbordes);
document.addEventListener("scroll", marcarDesbordes, true);   // captura: sirve para las barras internas
setInterval(marcarDesbordes, 1200);                            // red de seguridad al re-pintar listas

</script>
